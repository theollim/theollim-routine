<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="더올림수학 루틴 — 폼 바로가기 · 공지사항 · 공식 암기">
<title>더올림수학 루틴</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="더올림 루틴">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0b0b'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E올%3C/text%3E%3C/svg%3E">
<style>
:root{
  --surface:#fcfcfb; --plane:#f9f9f7; --sunk:#f2f1ed;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --line:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --goodBg:rgba(12,163,12,.10); --warnBg:rgba(250,178,25,.16); --critBg:rgba(208,59,59,.10);
  --gEs:#3987e5; --gM1:#12a594; --gM2:#8b5cf6; --gM3:#e2478a; --gHs:#c2760c;
  --accent:#2f6fed; --accentBg:rgba(47,111,237,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --surface:#1a1a19; --plane:#0d0d0d; --sunk:#232321; --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --line:rgba(255,255,255,.12);
    --goodBg:rgba(12,163,12,.16); --warnBg:rgba(250,178,25,.14); --critBg:rgba(208,59,59,.18); }
}
:root[data-theme="dark"]{ --surface:#1a1a19; --plane:#0d0d0d; --sunk:#232321; --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --line:rgba(255,255,255,.12);
  --goodBg:rgba(12,163,12,.16); --warnBg:rgba(250,178,25,.14); --critBg:rgba(208,59,59,.18); }
:root[data-theme="light"]{ --surface:#fcfcfb; --plane:#f9f9f7; --sunk:#f2f1ed; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --line:rgba(11,11,11,.10);
  --goodBg:rgba(12,163,12,.10); --warnBg:rgba(250,178,25,.16); --critBg:rgba(208,59,59,.10); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px}
header .sub{font-size:12px;color:var(--muted);margin-top:1px}
#themeBtn{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:15px}
main{padding:14px 14px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 2px 12px}

/* ── 링크 탭 ── */
.gradeGrid{display:grid;grid-template-columns:1fr;gap:10px}
.gradeCard{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);text-align:left;width:100%}
.gradeCard .emo{font-size:30px;width:42px;text-align:center;flex:0 0 auto}
.gradeCard .lab{font-weight:750;font-size:17px}
.gradeCard .go{margin-left:auto;font-size:12px;color:var(--accent);font-weight:650;flex:0 0 auto}
.backBtn{font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:10px;padding:6px 2px}
.linkCard{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px}
.linkCard .emo{font-size:24px;width:38px;text-align:center;flex:0 0 auto}
.linkCard .lab{font-weight:650;font-size:15px}
.linkCard .go{margin-left:auto;font-size:13px;color:var(--good);font-weight:650;flex:0 0 auto}
.linkCard.off{opacity:.55}
.linkCard.off .go{color:var(--muted)}
.linkCard.skel{background:linear-gradient(90deg,var(--sunk) 25%,var(--line) 37%,var(--sunk) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;height:58px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* ── 공지 탭 ── */
.noticeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-radius:14px;padding:13px 12px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid transparent}
.notice .emo{font-size:19px;margin-bottom:6px}
.notice .t{font-weight:700;font-size:13px;line-height:1.3;margin-bottom:4px}
.notice .b{font-size:11.5px;color:var(--ink2);line-height:1.45}
.notice.crit{border-left-color:var(--crit)}
.notice.warn{border-left-color:var(--warn)}
.notice.good{border-left-color:var(--good)}

/* ── 공식암기 탭 ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13px;border:1px solid var(--line);
  color:var(--ink2);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:650}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar button{flex:1;padding:9px;border-radius:11px;background:var(--accentBg);color:var(--accent);font-size:13px;font-weight:650;border:1px solid var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.fc{perspective:1000px}
.fcIn{position:relative;width:100%;display:grid;transition:transform .4s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d}
.fc.on .fcIn{transform:rotateY(180deg)}
.fcFace{grid-row:1;grid-column:1;min-height:112px;border-radius:13px;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:16px 12px 12px;border-top:3px solid transparent;border-left:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fcFront{background:var(--sunk);font-size:14px;font-weight:700;line-height:1.35}
.fcBack{background:var(--ink);color:var(--plane);transform:rotateY(180deg);
  font-size:12.5px;line-height:1.55;font-weight:600;letter-spacing:-.01em}
.fcBack .def{font-size:12.5px;font-weight:750;margin-bottom:6px}
.fcBack .form{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5}
.fcBack .sub{font-size:11px;opacity:.65;margin-top:3px;font-weight:500}
.propList{margin:2px 0 0;padding:0;list-style:none;text-align:left;width:100%}
.propList li{position:relative;padding-left:12px;margin-bottom:3px;font-weight:500;opacity:.92}
.propList li::before{content:'·';position:absolute;left:0;top:-1px;font-weight:900;opacity:.7}
.gradeTag{font-size:9.5px;font-weight:800;position:absolute;top:9px;left:12px;letter-spacing:.03em;opacity:.85}
.fc[data-t="es"] .fcFace{border-top-color:var(--gEs)} .fc[data-t="es"] .gradeTag{color:var(--gEs)}
.fc[data-t="m1"] .fcFace{border-top-color:var(--gM1)} .fc[data-t="m1"] .gradeTag{color:var(--gM1)}
.fc[data-t="m2"] .fcFace{border-top-color:var(--gM2)} .fc[data-t="m2"] .gradeTag{color:var(--gM2)}
.fc[data-t="m3"] .fcFace{border-top-color:var(--gM3)} .fc[data-t="m3"] .gradeTag{color:var(--gM3)}
.fc[data-t="hs"] .fcFace{border-top-color:var(--gHs)} .fc[data-t="hs"] .gradeTag{color:var(--gHs)}
.fcBack .gradeTag{color:rgba(255,255,255,.55) !important}

/* ── 하단 탭바 ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:650}
nav button .ic{font-size:19px}
</style>
</head>
<body>
<header>
  <div><h1>더올림수학 루틴</h1><div class="sub" id="hdrSub">폼 바로가기 · 공지 · 공식 암기</div></div>
  <button id="themeBtn">🌓</button>
</header>
<main id="main"></main>
<nav>
  <button data-tab="link" class="on"><span class="ic">🔗</span>링크</button>
  <button data-tab="notice"><span class="ic">📌</span>공지</button>
  <button data-tab="card"><span class="ic">🧠</span>공식암기</button>
</nav>

const LINK_FALLBACK = {
  checkin_es:{label:'체크인', emoji:'🌼'}, checkin_ms:{label:'체크인', emoji:'🌿'},
  checkin_hs:{label:'체크인', emoji:'🍀'}, arrival:{label:'등원 — 출석체크', emoji:'✏️'},
  dismissal:{label:'하원 — 수업정리', emoji:'📘'},
};
const LINK_GROUPS = {
  '초등':{emoji:'🌼', keys:['checkin_es','arrival','dismissal']},
  '중등':{emoji:'🌿', keys:['checkin_ms','arrival','dismissal']},
  '고등':{emoji:'🍀', keys:['checkin_hs','arrival','dismissal']},
};
const TIER = {
  '초등':'es', '중1':'m1', '중2':'m2', '중3':'m3',
  '공통수학1':'hs', '공통수학2':'hs', '대수':'hs', '미적분Ⅰ':'hs',
  '확률과 통계':'hs', '미적분Ⅱ':'hs', '기하':'hs',
};

/* ═══════════════════════ 상태 ═══════════════════════ */
let TAB = 'link';
let LINKS = null;         // /api/links 결과
let linkGrade = null;     // '초등' | '중등' | '고등' | null(고르는 중)
let cardGrade = '전체';
let cardsShownAll = true;   // 처음엔 다 보이게
const flipped = new Set();  // 가린 카드 인덱스 (전체보기 상태에서 개별로 가린 것)

const $ = (s,el)=> (el||document).querySelector(s);
const esc = (s)=> String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══════════════════════ 렌더 ═══════════════════════ */
function renderLink(){
  if(!linkGrade){
    const h = Object.entries(LINK_GROUPS).map(([g,meta])=>
      `<button class="gradeCard" data-lg="${esc(g)}">
        <div class="emo">${meta.emoji}</div>
        <div class="lab">${esc(g)}</div>
        <div class="go">체크인 · 등원 · 하원 ›</div>
      </button>`).join('');
    $('#main').innerHTML = `<div class="hint">학년을 먼저 골라주세요.</div><div class="gradeGrid">${h}</div>`;
    return;
  }
  const keys = LINK_GROUPS[linkGrade].keys;
  let h = '';
  if(!LINKS){
    h += keys.map(()=>`<div class="linkCard skel"></div>`).join('');
  } else {
    h += keys.map(key=>{
      const meta = LINK_FALLBACK[key];
      const l = LINKS.find(x=>x.key===key);
      const url = l && l.url;
      const cls = url ? '' : ' off';
      const goTxt = url ? '열기 ›' : '준비중';
      const tag = url ? 'a' : 'div';
      const hrefAttr = url ? `href="${esc(url)}" target="_blank" rel="noopener"` : '';
      return `<${tag} class="linkCard${cls}" ${hrefAttr}>
        <div class="emo">${meta.emoji}</div>
        <div class="lab">${esc(meta.label)}</div>
        <div class="go">${goTxt}</div>
      </${tag}>`;
    }).join('');
  }
  $('#main').innerHTML = `<button class="backBtn" id="linkBack">‹ ${esc(linkGrade)} 다시 고르기</button>
    <div class="hint">눌러서 바로 폼으로 이동합니다. 매일 아침 자동으로 최신 주소를 확인해요.</div>${h}`;
}

function renderNotice(){
  const h = NOTICES.map(n=>`
    <div class="notice ${n.k}">
      <div class="emo">${n.e}</div>
      <div class="t">${esc(n.t)}</div>
      <div class="b">${esc(n.b)}</div>
    </div>`).join('');
  $('#main').innerHTML = `<div class="hint">더올림수학을 다니면서 꼭 알아두면 좋은 것들이에요.</div><div class="noticeGrid">${h}</div>`;
}

function renderCard(){
  const grades = ['전체','초등','중1','중2','중3','고등'];
  const chips = grades.map(g=>`<button class="chip" data-cg="${esc(g)}" aria-pressed="${g===cardGrade}">${esc(g)}</button>`).join('');
  const list = CARDS.filter((c)=>
    cardGrade==='전체' || c.g===cardGrade || (cardGrade==='고등' && TIER[c.g]==='hs'));
  const cardsHtml = list.map((c)=>{
    const idx = CARDS.indexOf(c);
    const on = cardsShownAll || flipped.has(idx);
    const back = c.props
      ? `<div class="def">${esc(c.def)}</div>${c.props.length ? `<ul class="propList">${c.props.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>` : ''}`
      : `<div class="form">${esc(c.b).replace(/\n/g,'<br>')}</div>`;
    return `<div class="fc${on?' on':''}" data-ci="${idx}" data-t="${TIER[c.g]||'hs'}">
      <div class="fcIn">
        <div class="fcFace fcFront"><span class="gradeTag">${esc(c.g)}</span>${esc(c.f)}</div>
        <div class="fcFace fcBack"><span class="gradeTag">${esc(c.g)}</span>${back}</div>
      </div>
    </div>`;
  }).join('');
  $('#main').innerHTML = `
    <div class="hint">지금은 다 보이는 상태예요. 「전체 가리기」를 누르면 카드를 눌러야 답이 보입니다.</div>
    <div class="chips">${chips}</div>
    <div class="toolbar">
      <button id="cardToggleAll">${cardsShownAll?'전체 가리기':'전체 보기'}</button>
      <button id="cardShuffle">순서 섞기</button>
    </div>
    <div class="grid">${cardsHtml}</div>`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB));
  $('#hdrSub').textContent = TAB==='link' ? '폼 바로가기' : TAB==='notice' ? '공지사항' : '초중등 공식 암기';
  if(TAB==='link') renderLink();
  else if(TAB==='notice') renderNotice();
  else renderCard();
}

/* ═══════════════════════ 이벤트 ═══════════════════════ */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click', ()=>{ TAB=b.dataset.tab; render(); }));

$('#themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('deolrim.links.theme', next); }catch(e){}
});
try{
  const savedTheme = localStorage.getItem('deolrim.links.theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
}catch(e){}

document.addEventListener('click', (e)=>{
  const gradeCard = e.target.closest('[data-lg]');
  if(gradeCard){ linkGrade = gradeCard.dataset.lg; renderLink(); return; }
  const linkBack = e.target.closest('#linkBack');
  if(linkBack){ linkGrade = null; renderLink(); return; }
  const chip = e.target.closest('[data-cg]');
  if(chip){ cardGrade = chip.dataset.cg; renderCard(); return; }
  const toggleAll = e.target.closest('#cardToggleAll');
  if(toggleAll){ cardsShownAll = !cardsShownAll; if(cardsShownAll) flipped.clear(); renderCard(); return; }
  const shuffle = e.target.closest('#cardShuffle');
  if(shuffle){
    for(let i=CARDS.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [CARDS[i],CARDS[j]]=[CARDS[j],CARDS[i]]; }
    flipped.clear(); cardsShownAll=false; renderCard(); return;
  }
  const fc = e.target.closest('.fc');
  if(fc && !cardsShownAll){
    const idx = Number(fc.dataset.ci);
    if(flipped.has(idx)) flipped.delete(idx); else flipped.add(idx);
    fc.classList.toggle('on');
  }
});

/* ═══════════════════════ 시작 ═══════════════════════ */
render();
fetch('/api/links', {cache:'no-store'})
  .then(r=>r.json()).then(j=>{ LINKS = (j && j.links) || []; if(TAB==='link') renderLink(); })
  .catch(()=>{ LINKS = []; if(TAB==='link') renderLink(); });

try{
  var ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0b0b'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E올%3C/text%3E%3C/svg%3E";
  var MANI = {name:'더올림수학 루틴', short_name:'더올림 루틴', start_url:'.', scope:'.',
    display:'standalone', orientation:'portrait', background_color:'#f9f9f7', theme_color:'#0b0b0b', lang:'ko',
    icons:[{src:ICON, sizes:'192x192', type:'image/svg+xml'}, {src:ICON, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'}]};
  var blob = new Blob([JSON.stringify(MANI)], {type:'application/manifest+json'});
  var link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}catch(e){}
