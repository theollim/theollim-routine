      그래서 앱이 <b>수업일인데 세 폼 모두 기록이 없는 경우</b>를 결석으로 봅니다.
      폼에 '당일결석·무단결석'이라고 찍힌 것만 <b>결석(기록)</b>이고, 나머지는 <b>추정</b>입니다.
      <b>왜 빠졌는지는 원장님만 아십니다.</b> 그래서 아이에게 되묻지 않고,
      위 <b>「사유를 적을 결석」</b>에서 한 화면에 모아 톡톡 찍도록 만들었습니다. 찍는 즉시 노션에 저장됩니다.
      <br><br><b>앞으로 빠질 것</b>만 등원 폼에서 미리 받습니다 —
      「2주 안에 빠질 예정이 있나요?」. 미래는 앱이 절대 맞힐 수 없기 때문입니다.
      <br><br><b>휴원·방학</b>은 세지 않습니다 — 학원 전체에서 기록이 한 건도 없는 날은 수업이 없었던 날로 봅니다.
      <br><br><b>7/14 이전</b>은 등원 폼이 없고 시간표도 달랐습니다. 그래서 그때는
      <b>남아 있는 기록만</b> 세고 <b>결석은 추정하지 않습니다</b> — 안 온 날인지 폼만 안 낸 날인지
      가릴 방법이 없기 때문입니다. 수업 형태에 '당일결석'이라고 찍힌 것만 결석으로 셉니다.
      수업 시간 이수 계산에서도 그 기간은 뺍니다.
      <br><br><b>숙제와 진도는 5월 6일부터 전부 들어 있습니다</b> — 기간을 「전체」로 두시면 다 보입니다.
      <b>등록 전</b>도 세지 않습니다 — 학생의 첫 기록 이전 날짜는 건너뜁니다.
      <br><br><b>보강</b>은 등원 폼의 <b>수업 형태</b>를 먼저 읽습니다 —
      '결석보강·보강·출석'이 정규 요일 밖에 찍히면 보강, '클리닉·시험대비'는 추가 수업으로 따로 셉니다.
      보강은 빠진 날과 <b>7일 안</b>이면 그 결석을 채운 것으로 봅니다.
      <br><br><b>당일결석·무단결석도 보강 대상이 아닙니다.</b> 보강은 미리 알려주신 결석에만 붙습니다 —
      당일결석은 빠진 채로 남습니다.
      <br><br><b>지각은 보강 대상이 아닙니다.</b> 늦은 만큼 수업이 줄어들 뿐이라,
      상습 지각은 따로 모아 누적 손해 시간을 보여드립니다.
      </div>
    </details></div>`;

  // 미리 알려준 결석 예정
  const pl = plannedAbs();
  if(pl.length){
    h += `<div class="card"><h2>빠질 예정</h2>
      <div class="sub">아이들이 미리 알려준 것입니다 — 앱이 스스로는 알 수 없는 정보예요</div>`;
    pl.forEach(x=>{
      h += `<div class="row"><span class="av" style="background:var(--warnBg);color:#8a5c00">!</span>
        <span class="grow"><span class="nm">${esc(x.s?x.s.name:x.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(x.s?x.s.grade:'')}</span></span>
          <span class="meta">${esc(x.reason||'사유 없음')}</span></span>
        <span class="right">${fmtD(x.date)}</span></div>`;
    });
    h += `</div>`;
  }

  // 사유가 비어 있는 결석 — 한 번에 정리하기
  const pend = pendingAbsences();
  if(pend.length){
    h += `<div class="card"><h2>사유를 적을 결석 ${pend.length}건</h2>
      <div class="sub">왜 빠졌는지는 원장님만 아십니다. 한 화면에서 톡톡 찍어 정리하세요</div>
      <button class="btn" id="absReasonBtn">한 번에 정리하기</button></div>`;
  }

  // 자기주도학습반 — 지각이 아니라 '얼마나 오래 앉아 있었나'가 지표다
  const ss = ACTIVE.filter(s=>s.selfStudy).map(s=>({s, st:attendStats(s.id)}))
                   .filter(x=>x.st.stayN>0);
  if(ss.length){
    ss.sort((a,b)=>b.st.stay-a.st.stay);
    h += `<div class="card"><h2>자기주도학습</h2>
      <div class="sub">수업 전에 미리 와서 하는 반입니다 — 지각이 아니라 <b>앉아 있던 시간</b>으로 봅니다</div>`;
    ss.forEach(({s,st})=>{
      h += `<button class="row" data-stu="${s.id}">
        <span class="av" style="background:var(--s1Bg);color:var(--s1)">${esc(s.name[0])}</span>
        <span class="grow"><span class="nm">${esc(s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)} · ${s.slots[0]?s.slots[0].days.join('')+' '+s.slots[0].start+' 수업':''}</span></span>
          <span class="meta">${st.stayN}일 · 하루 평균 ${fmtMin(st.stayAvg)}
            ${st.preMin? ` · 수업 전 자습 누적 ${fmtMin(st.preMin)}`:''}</span></span>
        <span class="right">${fmtMin(st.stay)}<br>
          <span style="color:var(--muted);font-size:11px">총 체류</span></span></button>`;
    });
    h += `</div>`;
  }

  // 수업 시간 이수 — 주 목표 분수 대비 실제
  // 온라인 학생은 학원에 머무는 시간이 없어 '이수 시간'이 성립하지 않습니다 — 여기서 뺍니다
  const mins = ACTIVE.filter(st=>!st.online).map(st=>({s:st, st:attendStats(st.id)}))
                     .filter(x=>x.st.targetMin>0).sort((a,b)=>a.st.minRate-b.st.minRate);
  if(mins.length){
    h += `<div class="card"><h2>수업 시간 이수</h2>
      <div class="sub">초등 주 180분 · 중고등 주 240분 기준 — 회당 시간은 학생마다 다릅니다</div>`;
    mins.slice(0,8).forEach(({s,st})=>{
      const k = st.minRate>=95?'good' : st.minRate>=80?'warn':'crit';
      h += `<button class="row" data-stu="${s.id}" style="align-items:flex-start">
        <span class="av" style="background:var(--${k}Bg);color:var(--${k})">${esc(s.name[0])}</span>
        <span class="grow"><span class="nm">${esc(s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)} · 회당 ${s.sessionMin}분 · 주 ${s.sessions}회</span></span>
          <span class="pbar" style="margin:7px 0 4px">
            <i class="acad" style="left:0;width:${Math.min(100,st.minRate)}%;background:var(--${k})"></i></span>
          <span class="meta">목표 ${fmtMin(st.targetMin)} · 실제 ${fmtMin(st.doneMin)}</span></span>
        <span class="right">${st.minRate}%</span></button>`;
    });
    if(mins.length>8) h += `<div class="meta" style="padding-top:8px">나머지 ${mins.length-8}명은 목표를 채웠습니다</div>`;
    h += `</div>`;
  }

  // 상습 지각 — 시간표가 아니라 습관의 문제
  const habit = [];
  ACTIVE.filter(st=>!st.selfStudy).forEach(st=>{
    const ds = datesIn(V2FROM, TODAY).map(d=>{
      const sl=slotFor(st,d), r=REC[st.id+'|'+d];
      return (sl && r?.arrival) ? minsOf(r.arrival.at)-minsOfHM(sl.start) : null;
    }).filter(x=>x!==null).sort((a,b)=>a-b);
    if(ds.length < 4) return;
    const med = ds[Math.floor(ds.length/2)];
    const lateN = ds.filter(x=>x>CFG.late).length;
    if(med > CFG.late && lateN >= 3) habit.push({s:st, med, n:ds.length, lateN});
  });
  if(habit.length){
    habit.sort((a,b)=>b.lateN-a.lateN);
    h += `<div class="card"><h2>상습 지각</h2>
      <div class="sub">한두 번이 아니라 <b>계속</b> 늦는 학생입니다 — 지각은 보강 대상이 아니므로 그만큼 수업이 줄어듭니다</div>`;
    habit.forEach(({s,med,n,lateN})=>{
      const lost = med * lateN;
      h += `<button class="row" data-stu="${s.id}">
        <span class="av" style="background:var(--warnBg);color:#8a5c00">!</span>
        <span class="grow"><span class="nm">${esc(s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)} · 회당 ${s.sessionMin}분</span></span>
          <span class="meta">${n}회 중 <b style="color:var(--crit)">${lateN}회 지각</b> · 평소 ${med}분 늦음
            · 누적 약 ${fmtMin(lost)} 손해</span></span>
        <span class="right">+${med}분</span></button>`;
    });
    h += `</div>`;
  }

  // 시간표 확인 — 계속 일찍 오는 경우만 (늦는 건 위의 '상습 지각'이 담당)
  const drift = [];
  ACTIVE.filter(st=>!st.selfStudy).forEach(st=>{
    const ds = datesIn(V2FROM, TODAY).map(d=>{
      const sl=slotFor(st,d), r=REC[st.id+'|'+d];
      return (sl && r?.arrival) ? minsOf(r.arrival.at)-minsOfHM(sl.start) : null;
    }).filter(x=>x!==null).sort((a,b)=>a-b);
    if(ds.length < 4) return;
    const med = ds[Math.floor(ds.length/2)];
    if(med <= -20) drift.push({s:st, med, n:ds.length});
  });
  if(drift.length){
    drift.sort((a,b)=>a.med-b.med);
    h += `<div class="card"><h2>시간표를 다시 볼 학생</h2>
      <div class="sub">등록된 시각보다 계속 일찍 옵니다 — 시간표가 실제와 다를 수 있습니다</div>`;
    drift.forEach(({s,med,n})=>{
      h += `<button class="row" data-stu="${s.id}">
        <span class="av" style="background:var(--s1Bg);color:var(--s1)">i</span>
        <span class="grow"><span class="nm">${esc(s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)}</span></span>
          <span class="meta">등록 ${s.slots.map(x=>x.days.join('')+' '+(x.start||'온라인')).join(' / ')}
            · ${n}회 중 평소 ${-med}분 일찍 옴</span></span>
        <span class="right">${med}분</span></button>`;
    });
    h += `</div>`;
  }

  h += `<div class="card"><div class="filters">`;
  Object.entries(F).forEach(([k,v])=>
    h += `<button class="chip" data-attf="${k}" aria-pressed="${k===attFilter}">${v.t}</button>`);
  h += `</div>`;
  const list = rows.filter(F[attFilter].f).sort(F[attFilter].sort);
  if(!list.length) h += `<div class="empty">이 기간에 해당하는 학생이 없습니다.</div>`;
  list.forEach(({s,st})=>{
    const k = st.streak>=2?'crit' : st.uncovered?'serious' : st.late?'warn':'good';
    h += `<button class="row" data-stu="${s.id}">
      <span class="av" style="background:var(--${k}Bg);color:var(--${k})">${esc(s.name[0])}</span>
      <span class="grow">
        <span class="nm">${esc(s.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)}</span></span>
        <span class="meta">${s.online
            ? (st.absent?`기록 없는 날 ${st.absent}일`:'매일 기록 들어옴')
            : (st.absent?`결석 ${st.absent}회`:'결석 없음')}${
            st.unknown?` · <span style="color:var(--muted)">확인 못 함 ${st.unknown}일</span>`:''}${st.covered?
            (st.extendMode?` <b style="color:var(--good)">(오는 날 더 해서 시간은 채움 · ${st.minRate}%)</b>`
                          :` <b style="color:var(--good)">(보강 ${st.covered}회 채움)</b>`):''}
          ${st.makeup>st.covered?` · 보강 ${st.makeup}회`:''}
          ${st.late?` · 지각 ${st.late}회`:''}
          ${st.streak>=2?` · <b style="color:var(--crit)">${s.online?`${st.streak}일째 기록 없음`:`연속 결석 ${st.streak}회`}</b>`:''}</span>
        <span class="pbar" style="height:6px;margin:6px 0 0">
          <i class="school" style="left:0;width:${st.rateM??0}%"></i>
          <i class="acad" style="left:0;width:${st.rate??0}%;background:var(--${k})"></i></span>
      </span>
      <span class="right">${st.rate==null?'—':st.rate+'%'}${st.covered?`<br><span style="color:var(--good);font-size:11px">보강 포함 ${st.rateM}%</span>`:
        `<br><span style="color:var(--muted);font-size:11px">${st.present}/${st.present+st.absent}회</span>`}</span>
    </button>`;
  });
  h += `</div>`;
  $('#s-att').innerHTML = h;
}

/* ═══════════════════════ 화면 3 · 숙제 ═══════════════════════ */
let hwFilter='bad';
function saveFilters(){ try{ localStorage.setItem('deolrim.filters', JSON.stringify({att:attFilter, hw:hwFilter})); }catch(e){} }
function viewHw(){
  saveFilters();
  const rows = ACTIVE.map(s=>({s, st:hwStats(s.id)}))
    .filter(x=>x.st.total>0 || x.st.noCheckin>0);
  const F = {
    bad:   {t:'미완료 있는 학생', f:x=>x.st.bad>0,      sort:(a,b)=>b.st.bad-a.st.bad || a.st.rate-b.st.rate},
    wrong: {t:'오답 미완료',      f:x=>x.st.wrong>0,    sort:(a,b)=>b.st.wrong-a.st.wrong},
    streak:{t:'연속 미완료',      f:x=>x.st.streak>=CFG.streak,  sort:(a,b)=>b.st.streak-a.st.streak},
    nosub: {t:'숙제 기록 없음',   f:x=>x.st.noCheckin>0,sort:(a,b)=>b.st.noCheckin-a.st.noCheckin},
    pend:  {t:'확인 전',          f:x=>x.st.pending>0,  sort:(a,b)=>b.st.pending-a.st.pending},
    all:   {t:'전체',            f:()=>true,          sort:(a,b)=>a.st.rate-b.st.rate},
  };
  const CONTENT = hwFilter === 'content';
  const totBad = rows.filter(F.bad.f).length;
  const totWrong = rows.filter(F.wrong.f).length;
  const totStreak = rows.filter(F.streak.f).length;
  const totNo = rows.filter(F.nosub.f).length;
  const totPend = rows.filter(F.pend.f).length;

  let h = `<div class="seg">
    <button data-hwf="bad" aria-pressed="${!CONTENT}">학생별로 보기</button>
    <button data-hwf="content" aria-pressed="${CONTENT}">숙제 내용 보기</button>
  </div>`;
  if(!CONTENT) h += `<div class="card">
    <div class="hero">${fmtD(P.from)} ~ ${fmtD(P.to)}</div>
    <div class="heroNum">${totBad}<small> / ${ACTIVE.length}명 미완료</small></div>
    <div class="tiles">
      ${tile(totBad?'crit':'good','미완료 학생',totBad,'명','숙제를 다 못 한 적 있음','fBad')}
      ${tile(totWrong?'warn':'good','오답 미완료',totWrong,'명','숙제는 했지만 오답 남음','fWrong')}
      ${tile(totStreak?'crit':'good','연속 미완료',totStreak,'명','2회 이상 연달아','fStreak')}
      ${tile(totNo?'warn':'good','숙제 기록 없음',totNo,'명','수업일인데 아무 기록도 없음','fNosub')}
      ${tile(totPend?'warn':'good','확인 전',totPend,'명','했다는데 안 가져옴','fPend')}
    </div></div>`;

  if(CONTENT){
    h += `<div class="card">` + renderHwContent() + `</div>`;
    $('#s-hw').innerHTML = h;
    return;
  }

  h += `<div class="card"><div class="filters">`;
  Object.entries(F).forEach(([k,v])=>
    h += `<button class="chip" data-hwf="${k}" aria-pressed="${k===hwFilter}">${v.t}</button>`);
  h += `</div>`;

  const list = rows.filter(F[hwFilter].f).sort(F[hwFilter].sort);
  if(!list.length) h += `<div class="empty">이 기간에 해당하는 학생이 없습니다.</div>`;
  list.forEach(({s,st})=>{
    const k = st.streak>=CFG.streak?'crit' : st.bad?'serious' : st.wrong?'warn':'good';
    h += `<button class="row" data-stu="${s.id}">
      <span class="av" style="background:var(--${k}Bg);color:var(--${k})">${esc(s.name[0])}</span>
      <span class="grow">
        <span class="nm">${esc(s.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)}</span></span>
        <span class="meta">
          ${st.bad? `미완료 ${st.bad}회` : '미완료 없음'}
          ${st.wrong? ` · 오답 미완료 ${st.wrong}회`:''}
          ${st.streak>=CFG.streak? ` · <b style="color:var(--crit)">연속 ${st.streak}회</b>`:''}
          ${st.pending? ` · <b style="color:var(--warn)">확인 전 ${st.pending}일</b>`:''}${
            st.noCheckin? ` · 기록 없음 ${st.noCheckin}회`:''}
        </span>
        <span class="pbar" style="height:6px;margin:6px 0 0">
          <i class="acad" style="left:0;width:${st.rate??0}%;background:var(--${k})"></i></span>
      </span>
      <span class="right">${st.rate==null?'—':st.rate+'%'}<br>
        <span style="color:var(--muted);font-size:11px">${st.total}회 중 ${st.done}</span></span>
    </button>`;
  });
  h += `</div>`;
  $('#s-hw').innerHTML = h;
}

/* ── 숙제 내용: 무엇을 얼마나 냈고, 다음에 무엇을 내주었나 ── */
function renderHwContent(){
  const rs = recsInP().filter(r=>{
    const s = byId[r.sid];
    return s && s.active && (gotForm(r) || r.dismissal || r.hw || r.cls);
  }).sort((a,b)=> a.date===b.date ? byId[a.sid].name.localeCompare(byId[b.sid].name)
                                  : (a.date<b.date?1:-1));
  if(!rs.length) return `<div class="empty">이 기간에 숙제 기록이 없습니다.</div>`;
  const byDate = {};
  rs.forEach(r=>(byDate[r.date] ||= []).push(r));
  let h = `<div class="sub" style="margin:2px 0 10px">그날 아이가 <b>해 온 숙제</b>와, 수업 끝나고 <b>새로 내준 숙제</b>를 나란히 놓았습니다</div>`;
  let shown = 0;
  Object.keys(byDate).sort().reverse().forEach(d=>{
    if(shown > 90) return;
    h += `<div class="dsep">${fmtD(d)}</div>`;
    byDate[d].forEach(r=>{
      if(shown++ > 90) return;
      const s = byId[r.sid], hw = hwOf(r);
      const c = askOf(r), dm = r.dismissal;
      const did = [];
      if(c){
        if(c.books?.length) did.push(esc(c.books.join(' · ')));
        if(c.hwItems) did.push(`${c.hwItems}문항`);
        if(c.hwMinutesRaw) did.push(esc(c.hwMinutesRaw));
      } else if(r.hw){
        if(r.hw.items) did.push(`${r.hw.doneItems ?? 0}/${r.hw.items}문항`);
        if(r.hw.minutes) did.push(`${r.hw.minutes}분`);
        if(r.hw.printScore!=null) did.push(`프린트 ${r.hw.printScore}점`);
      }
      const next = [];
      const nh = dm?.nextHw?.filter(x=>x && x!=='숙제없음') || r.cls?.nextHw || [];
      if(nh.length) next.push(esc(nh.join(' · ')));
      const ni = dm?.nextHwItems ?? r.cls?.nextHwItems;
      if(ni) next.push(`${ni}문항`);
      if(dm?.nextHwRange) next.push(esc(dm.nextHwRange));
      const unit = (dm?.academyUnits?.length ? dm.academyUnits : r.cls?.academyUnits) || [];
      h += `<button class="row" data-stu="${s.id}" style="align-items:flex-start">
        <span class="av" style="${hw?`background:var(--${hw.k}Bg);color:var(--${hw.k})`:''}">${esc(s.name[0])}</span>
        <span class="grow">
          <span class="nm">${esc(s.name)}
            <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)}</span>
            ${hw? badge(hw.k, hw.t):''}</span>
          <span class="kv" style="margin-top:5px">
            <b>해 온 숙제</b> ${did.length? did.join(' · ') : '<span style="color:var(--muted)">기록 없음</span>'}
            ${c?.reasons?.length? `<br><b>못 한 이유</b> ${esc(c.reasons.join(', '))}`:''}
            ${c?.question? `<br><b>질문</b> ${esc(c.question)}`:''}
            ${r.arrival?.wrongRaw? `<br><b>오답</b> ${esc(r.arrival.wrongRaw)}`:''}
            ${r.arrival?.backlog? `<br><b>밀린 숙제</b> ${esc(r.arrival.backlog)}`:''}
            ${unit.length? `<br><b>그날 진도</b> ${esc(unit.join(' · '))}`:''}
            <br><b>오늘 내준 숙제</b> ${next.length? next.join(' · ')
              : (dm||r.cls) ? '<span style="color:var(--muted)">숙제 없음</span>'
                            : '<span style="color:var(--muted)">하원 기록 없음</span>'}
          </span></span></button>`;
    });
  });
  if(rs.length > 90) h += `<div class="meta" style="padding-top:10px">최근 90건만 보여드립니다 — 기간을 좁히면 전부 보입니다</div>`;
  return h;
}

/* ═══════════════════════ 화면 4 · 진도 ═══════════════════════ */
function viewProg(){
  const rows = ACTIVE.map(s=>({s,p:progOf(s.id)})).filter(x=>x.p);
  const order = {behind:0, even:1, nodata:2, ahead:3};
  rows.sort((a,b)=> order[a.p.kind]-order[b.p.kind] || (b.p.n||0)-(a.p.n||0));
  const behind = rows.filter(x=>x.p.kind==='behind');
  const nodata = rows.filter(x=>x.p.kind==='nodata');
  const ahead  = rows.filter(x=>x.p.kind==='ahead');

  let h = `<div class="card">
    <div class="hero">학교 진도 대비 학원 진도</div>
    <div class="heroNum">${behind.length}<small>명 뒤처짐</small></div>
    <div class="tiles">
      ${tile(behind.length?'crit':'good','학원이 뒤',behind.length,'명','학교보다 늦게 나감','')}
      ${tile('good','선행 중',ahead.length,'명','학교보다 앞서 나감','')}
      ${tile(nodata.length?'warn':'good','판단 불가',nodata.length,'명','학교 진도 기록 없음','')}
      ${tile('mute','기준',D.counts.roster,'명','현재 재원생','')}
    </div>
    <div class="warnbox" style="margin:14px 0 0">
      <b>어떻게 세었나</b> — 학교·학원 단원을 2022 개정 교육과정 순서에 얹어 몇 칸 차이인지 셉니다.
      학년이 서로 다르면 학기 단위로 표시합니다. 학교 진도는 등원·숙제 폼에 적힌 단원이 근거이므로,
      그 칸이 비어 있으면 <b>판단 불가</b>로 둡니다 — 추측하지 않습니다.
    </div></div>`;

  h += `<div class="card"><h2>학생별 진도 비교</h2>
    <div class="sub">막대가 오른쪽일수록 진도가 앞섭니다</div>
    <div class="legend" style="margin-bottom:10px">
      <span><i class="dot" style="background:var(--muted);opacity:.55"></i>학교</span>
      <span><i class="dot" style="background:var(--s1)"></i>학원</span>
      <span><i class="dot" style="background:var(--crit)"></i>학원이 뒤</span>
    </div>`;
  rows.forEach(({s,p})=>{
    const k = p.kind==='behind'?'crit' : p.kind==='nodata'?'mute' : p.kind==='even'?'blue':'good';
    let bar='';
    if(p.kind!=='nodata'){
      // 같은 자 위에 두 줄로 나란히 — 긴 쪽이 더 나간 쪽
      const lo=Math.min(p.school.g,p.academy.g), hi=Math.max(p.school.g,p.academy.g);
      const span=Math.max(hi-lo,400), base=lo-span*0.55, tot=span*1.45;
      const px=g=>Math.max(6,Math.min(100,(g-base)/tot*100));
      const behind = p.kind==='behind';
      bar = `<span class="pair">
        <span class="pairRow"><span class="pairLab">학교</span>
          <span class="pbar"><i class="school" style="left:0;width:${px(p.school.g)}%"></i></span></span>
        <span class="pairRow"><span class="pairLab">학원</span>
          <span class="pbar ${behind?'behind':''}"><i class="acad" style="left:0;width:${px(p.academy.g)}%"></i></span></span>
      </span>`;
    }
    h += `<button class="row" data-stu="${s.id}" style="align-items:flex-start">
      <span class="av" style="background:var(--${k==='mute'?'sunk':k+'Bg'});color:var(--${k==='mute'?'ink2':k})">${esc(s.name[0])}</span>
      <span class="grow">
        <span class="nm">${esc(s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(s.grade)} · ${esc(s.school||'')}</span>
          ${badge(k, p.kind==='nodata'?'학교 진도 기록 없음':p.txt)}</span>
        ${bar}
        <span class="meta">
          학교 ${p.school? esc(p.school.sem+' '+p.school.unit) : '—'}
          &nbsp;→&nbsp; 학원 ${p.academy? esc(p.academy.sem+' '+p.academy.unit) : '—'}
        </span>
      </span></button>`;
  });
  h += `</div>`;
  $('#s-prog').innerHTML = h;
}

/* ═══════════════════════ 학생 상세 시트 ═══════════════════════ */
function timelineCard(s, rs){
  let h = `<div class="card"><h2>기록 타임라인</h2>
    <div class="sub">체크인 → 등원 → 하원 순으로 하루를 한 덩어리로 묶었습니다</div><div class="tl">`;
  if(!rs.length) h += `<div class="empty">이 기간에 기록이 없습니다.</div>`;
  rs.forEach(r=>{
    const hw = hwOf(r), a = arrivalStatus(s,r);
    const cls = hw? (hw.nb?'hw-mid':hw.ok&&!hw.wrong?'hw-good':hw.ok?'hw-mid':'hw-bad') : '';
    h += `<div class="ev ${cls}"><div class="evd">${fmtD(r.date)}</div><div class="evb">`;
    const bits=[];
    if(r.checkin) bits.push(`<b>체크인</b> ${hhmm(r.checkin.submittedAt)}${r.checkin.hwRaw?' · '+esc(r.checkin.hwRaw):''}`);
    else if(r.arrival && (r.arrival.question || r.arrival.hwItems)) bits.push(`<b>등원 폼에 숙제 내용</b> 적어 옴`);
    if(r.arrival) bits.push(`<b>등원</b> ${hhmm(r.arrival.at)}${a?` (${a.t})`:''}${r.arrival.type?' · '+esc(r.arrival.type):''}`);
    if(r.dismissal){ const stM=stayMin(r);
      bits.push(`<b>하원</b> ${hhmm(r.dismissal.at)}${stM!=null&&stM>0?` · 체류 ${fmtMin(stM)}`:''}${r.dismissal.understanding?' · '+esc(r.dismissal.understanding):''}`); }
    if(r.hw) bits.push(`<b>숙제(구)</b> ${esc(r.hw.hwRaw||'')}${r.hw.items?` · ${r.hw.doneItems??0}/${r.hw.items}문항`:''}`);
    if(r.cls) bits.push(`<b>수업(구)</b> ${esc((r.cls.academyUnits||[]).join(', ')||r.cls.todayLearned||'')}`);
    h += bits.join('<br>') + `</div>`;
    const kv=[];
    const acad = r.dismissal?.academyUnits?.length? r.dismissal.academyUnits : r.cls?.academyUnits;
    const sch  = r.arrival?.schoolUnits?.length? r.arrival.schoolUnits
               : r.dismissal?.schoolUnits?.length? r.dismissal.schoolUnits : r.hw?.schoolUnits;
    if(acad?.length) kv.push(`<b>학원 진도</b> ${esc(acad.join(' · '))}`);
    if(sch?.length)  kv.push(`<b>학교 진도</b> ${esc(sch.join(' · '))}`);
    const ask = askOf(r);
    const did=[];
    if(ask?.books?.length) did.push(esc(ask.books.join(' · ')));
    if(ask?.hwItems) did.push(`${ask.hwItems}문항`);
    if(ask?.hwMinutesRaw) did.push(esc(ask.hwMinutesRaw));
    if(did.length) kv.push(`<b>해 온 숙제</b> ${did.join(' · ')}`);
    if(r.dismissal?.todayItems) kv.push(`<b>수업 중 푼 문항</b> ${r.dismissal.todayItems}문항`);
    if(r.arrival?.wrongRaw) kv.push(`<b>오답 현황</b> ${esc(r.arrival.wrongRaw)}`);
    if(r.arrival?.backlog) kv.push(`<b>밀린 숙제</b> ${esc(r.arrival.backlog)}`);
    if(r.dismissal?.todayLearned) kv.push(`<b>오늘 배운 내용</b> ${esc(r.dismissal.todayLearned)}`);
    if(ask?.question) kv.push(`<b>질문</b> ${esc(ask.question)}${
      [ask.qBook, ask.qPage?ask.qPage+'쪽':'', ask.qNo?ask.qNo+'번':''].filter(Boolean).length
        ? ` <span style="color:var(--muted)">(${esc([ask.qBook, ask.qPage?ask.qPage+'쪽':'', ask.qNo?ask.qNo+'번':''].filter(Boolean).join(' '))})</span>` : ''}`);
    if(ask?.stuckAt?.length) kv.push(`<b>막힌 곳</b> ${esc(ask.stuckAt.join(', '))}`);
    if(ask?.reasons?.length) kv.push(`<b>못 한 이유</b> ${esc(ask.reasons.join(', '))}`);
    if(r.checkin?.missingPrep?.length) kv.push(`<b>빠진 준비</b> ${esc(r.checkin.missingPrep.join(', '))}`);
    if(r.dismissal?.nextHw?.length) kv.push(`<b>오늘 내준 숙제</b> ${esc(r.dismissal.nextHw.join(', '))}${r.dismissal.nextHwItems?` ${r.dismissal.nextHwItems}문항`:''}${r.dismissal.nextHwRange?` · ${esc(r.dismissal.nextHwRange)}`:''}`);
    if(r.dismissal?.help?.length) kv.push(`<b>도움 요청</b> ${esc(r.dismissal.help.join(', '))}`);
    if(kv.length) h += `<div class="kv">${kv.join('<br>')}</div>`;
    h += `</div>`;
  });
  return h + `</div></div>`;
}

/* ── 학생 한 장 「한눈에」 ──────────────────────────────────────────
   숙제 흐름 · 최근 질문과 막힌 곳 · 원장 메모 · 이번 달 수업료를 한 덩어리로.
   여태 타임라인·수업료 탭·출결 표에 흩어져 있어 한눈에 안 잡히던 것들입니다. */
function stuGlanceHtml(sid){
  const s = byId[sid]; if(!s) return '';
  const all = (BY_STU[sid] || []);                       // 최신순

  /* 1) 숙제 흐름 — 최근 12회 색 줄 */
  const flow = [];
  for(const r of all){
    const h = hwOf(r); if(!h || h.code === 'no_hw') continue;
    flow.push({d:r.date, k:h.k, t:h.t});
    if(flow.length >= 12) break;
  }
  flow.reverse();

  /* 2) 최근 질문·막힌 곳 */
  const asks = [];
  for(const r of all){
    const c = askOf(r); if(!c) continue;
    const where = [c.qBook, c.qPage ? c.qPage+'쪽' : '', c.qNo ? c.qNo+'번' : ''].filter(Boolean).join(' ');
    const bits = [];
    if(c.question) bits.push(esc(c.question));
    if(c.qWhy) bits.push(esc(c.qWhy));
    if(c.stuckAt.length) bits.push('막힌 곳: ' + esc(c.stuckAt.join(', ')));
    if(c.reasons.length) bits.push('못 한 이유: ' + esc(c.reasons.join(', ')));
    if(!bits.length && !where) continue;
    asks.push({d:r.date, where, txt:bits.join(' · '), src:c.src});
    if(asks.length >= 5) break;
  }

  /* 3) 원장 메모 — 날짜별로 흩어져 있던 것 */
  const memos = Object.keys(OVR).filter(k=>k.indexOf(sid + '|') === 0)
    .map(k=>({d:k.slice(k.indexOf('|')+1), o:OVR[k]}))
    .filter(x=>x.o && x.o.note && /^\d{4}-\d{2}-\d{2}$/.test(x.d) && x.d !== PROGDATE)
    .sort((a,b)=> a.d < b.d ? 1 : -1).slice(0, 5);

  /* 3.5) 집에서 한 공부 — 학생 폰(루틴앱)에서 온 것 */
  const rs = rtnStats(sid, 14);
  const rlist = (RTN[sid] || []).slice(0, 5);

        <td>${r.arrival?hhmm(r.arrival.at):'—'}</td>
        <td>${r.dismissal?hhmm(r.dismissal.at):'—'}${stM!=null&&stM>0?`<br><span style="color:var(--muted);font-size:11px">${fmtMin(stM)}</span>`:''}</td></tr>`;

/* ═══════════════════════ 학부모 발송용 묶음 ═══════════════════════ */
/* ── 누구에게 언제 보냈나 ──────────────────────────────────────────
   「발송|YYYY-MM-DD」 한 줄에 그날 보낸 학생 번호를 ∥ 로 이어 둡니다.
   이것만 있으면 「오래 안 보낸 순」을 앱이 알아서 셉니다 —
   원장님이 누구 차례인지 기억하지 않아도 됩니다. */
const SEND_EVERY = 14;          // 격주
const SEND_BATCH = 15;          // 한 번에 15명
const sendKey = d => '발송|' + d;
function sendOf(d){
  return String((OVR[sendKey(d)] || {}).note || '')
    .split('∥').map(x=>x.trim()).filter(Boolean);
}
function sentMap(){
  const m = {};
  Object.keys(OVR).filter(k=>k.indexOf('발송|') === 0).forEach(k=>{
    const d = k.slice(3);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    sendOf(d).forEach(sid=>{ if(!m[sid] || m[sid] < d) m[sid] = d; });
  });
  return m;
}
function daysSince(d){
  if(!d) return null;
  return Math.round((parseYmd(TODAY) - parseYmd(d)) / 864e5);
}
/* 오래 안 보낸 사람이 맨 위로 올라옵니다 — 보낸 적 없는 사람이 가장 위 */
function sendQueue(){
  const m = sentMap();
  return ACTIVE.map(s=>({s, last: m[s.id] || null, ago: daysSince(m[s.id])}))
    .sort((a,b)=>{
      if(a.last === b.last) return a.s.name.localeCompare(b.s.name, 'ko');
      if(!a.last) return -1;
      if(!b.last) return 1;
      return a.last < b.last ? -1 : 1;
    });
}
function markSent(sid){
  const cur = sendOf(TODAY);
  if(!cur.includes(sid)) cur.push(sid);
  return setOvr('발송', TODAY, {note: cur.join(' ∥ ')});
}
function unmarkSent(sid){
  const cur = sendOf(TODAY).filter(x=> x !== sid);
  return setOvr('발송', TODAY, {note: cur.join(' ∥ ')});
}
/* 보낼 때가 됐나 — 오래 안 보낸 사람이 배치의 절반을 넘으면 */
function sendDue(){
  const q = sendQueue();
  const due = q.filter(x=> !x.last || x.ago >= SEND_EVERY);
  return due.length >= Math.min(SEND_BATCH, Math.ceil(ACTIVE.length/2)) ? due : null;
}
function parentSummary(sid){
  const s = byId[sid];
  const at = attendStats(sid), hw = hwStats(sid), p = progOf(sid);
  const rs = (BY_STU[sid]||[]).filter(r=>inP(r.date)).sort((a,b)=>a.date<b.date?-1:1);
  const und = {}; rs.forEach(r=>{ const u=r.dismissal?.understanding; if(u) und[u]=(und[u]||0)+1; });
  const undTxt = Object.entries(und).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${k.replace(/[^가-힣 ]/g,'').trim()} ${v}회`).join(' · ') || '기록 없음';
  const books = [...new Set(rs.flatMap(r=>askOf(r)?.books||[]))].join(' · ') || '기록 없음';
  const items = rs.map(r=>askOf(r)?.hwItems).filter(n=>typeof n==='number');
  const avgItems = items.length? Math.round(items.reduce((a,b)=>a+b,0)/items.length) : null;
  const L = [];
  L.push(`[더올림수학] ${s.name} 학습 요약`);
  L.push(`기간 ${fmtD(P.from)} ~ ${fmtD(P.to)} · ${s.grade} ${s.school||''}`);
  L.push('');
  L.push(`■ 출결`);
  L.push(`  예정 ${at.present+at.absent}회 중 출석 ${at.present}회${at.rate!=null?` (${at.rate}%)`:''}`);
  if(at.absent) L.push(`  결석 ${at.absent}회${at.covered?
    (at.extendMode?` (오시는 날 수업을 늘려 시간은 모두 채웠습니다)`:` (그중 ${at.covered}회는 보강으로 채웠습니다)`):''}`);
  if(at.late)   L.push(`  지각 ${at.late}회`);
  if(at.makeup) L.push(`  보강 수업 ${at.makeup}회`);
  if(at.clinic) L.push(`  클리닉 ${at.clinic}회`);
  if(at.targetMin) L.push(`  수업 시간 ${fmtMin(at.doneMin)} 이수 (목표 ${fmtMin(at.targetMin)}, ${at.minRate}%)`);
  if(s.selfStudy && at.stayN) L.push(`  자기주도학습 포함 하루 평균 ${fmtMin(at.stayAvg)}씩 공부했습니다`);
  L.push('');
  L.push(`■ 숙제`);
  L.push(`  제출 ${hw.total}회 중 완료 ${hw.done}회${hw.rate!=null?` (${hw.rate}%)`:''}`
    + (hw.pending?` · 확인 전 ${hw.pending}일(했다는데 안 가져옴)`:''));
  if(hw.wrong)  L.push(`  오답까지 마치지 못한 날 ${hw.wrong}회`);
  if(hw.bad)    L.push(`  숙제를 다 하지 못한 날 ${hw.bad}회${hw.streak>=2?` (최근 ${hw.streak}회 연속)`:''}`);
  if(avgItems)  L.push(`  하루 평균 ${avgItems}문항`);
  if(books!=='기록 없음') L.push(`  교재 ${books}`);
  L.push('');
  L.push(`■ 진도`);
  if(p && p.kind!=='nodata'){
    L.push(`  학교 ${p.school.sem} ${p.school.unit} (${fmtD(p.school.date)} 기준)`);
    L.push(`  학원 ${p.academy.sem} ${p.academy.unit} (${fmtD(p.academy.date)} 기준)`);
    L.push(`  → ${p.txt}`);
  } else L.push(`  비교할 학교 진도 기록이 없습니다`);
  L.push('');
  L.push(`■ 수업 중 이해도`);
  L.push(`  ${undTxt}`);
  const NOQ = /^\s*(없|없어요|없습니다|없음|무|x|X|\.|-|없슴)\s*[.!]*\s*$/;
  const qs = rs.map(r=>askOf(r)?.question).filter(q=>q && !NOQ.test(q));
  if(qs.length){ L.push(''); L.push(`■ 아이가 남긴 질문 ${qs.length}건`);
    qs.slice(-3).forEach(q=>L.push(`  · ${q}`)); }
  L.push('');
  L.push(`※ 이 요약은 제출된 기록만으로 만들어졌습니다. 기록이 없는 날은 세지 않았습니다.`);
  return L.join('\n');
}
/* 원장님이 쓰신 <장면> 한 줄 — 학생마다 따로 기억해 둡니다 */
window.__scene = window.__scene || {};
function sceneOf(sid){ return String(window.__scene[sid] || '').trim(); }

/* 앞 기간 — 같은 길이만큼 뒤로. ①변화 를 재는 자입니다 */
function prevRange(){
  const d = Math.round((parseYmd(P.to) - parseYmd(P.from)) / 864e5) + 1;
  return {from: addDays(P.from, -d), to: addDays(P.from, -1)};
}

/* ═══ 선생님 한마디 — 네 토막 ═══════════════════════════════════
   ① 변화        지난 기간과 견줘 무엇이 달라졌나
   ② 장면        원장님이 본 한 장면 ← 원장님이 쓰는 유일한 곳
   ③ 지금 보는 것 지금 무엇을 지켜보고 있나
   ④ 집에서      집에서 무엇을 해 주시면 되나
   ─────────────────────────────────────────────────────────────
   ①③④ 는 기록에서 만듭니다. 기록이 없으면 그 토막을 아예 안 씁니다 —
   빈 칸을 말로 메우지 않는 것이 이 카드의 원칙입니다. */
function parentComment(sid, scene){
  const s = byId[sid], at = attendStats(sid), hw = hwStats(sid), p = progOf(sid);
  const R = prevRange();
  const hwB = hwStats(sid, R.from, R.to);
  const L = [];

  /* ── ① 변화 ── */
  const 변화 = [];
  if(hw.quality != null && hwB.quality != null){
    const d = hw.quality - hwB.quality;
    if(d >= 12) 변화.push('지난 기간보다 숙제를 더 챙겨 왔습니다');
    else if(d <= -12) 변화.push('지난 기간보다 숙제가 밀렸습니다');
    else 변화.push('숙제는 지난 기간과 비슷한 흐름입니다');
  } else if(hw.quality != null){
    const g = gradeOf(hw.quality).g;
    변화.push(g === 'A' ? '숙제를 꾸준히 해 왔습니다'
      : g === 'B' ? '숙제를 대체로 해 왔습니다' : '숙제를 함께 챙겨 보고 있습니다');
  }
  if(hw.wrongRate != null && hwB.wrongRate != null){
    const d = hw.wrongRate - hwB.wrongRate;
    if(d >= 15) 변화.push('오답 정리까지 마치는 날이 늘었습니다');
    else if(d <= -15) 변화.push('오답 정리가 지난 기간보다 줄었습니다');
  }
  if(at.covered) 변화.push('빠진 수업은 보강으로 채웠습니다');
  if(변화.length) L.push(변화.join('. ') + '.');

  /* ── ② 장면 — 원장님 한 줄 ── */
  const sc = String(scene != null ? scene : sceneOf(sid)).trim();
  if(sc) L.push(sc.replace(/\s*$/, '').replace(/([^.!?…])$/, '$1.'));

  /* ── ③ 지금 보는 것 ── */
  const 보는것 = [];
  if(p && p.kind === 'behind') 보는것.push('학교 진도에 맞추어 속도를 올리는 중입니다');
  else if(p && p.kind === 'ahead') 보는것.push('학교 진도보다 앞서 나가고 있어 심화로 넓히는 중입니다');
  if(hw.streak >= (CFG.streak || 3)) 보는것.push(`숙제가 ${hw.streak}회 연달아 밀려 그 자리를 함께 보고 있습니다`);
  else if(hw.wrongRate != null && hw.wrongRate < 70) 보는것.push('틀린 문제를 다시 푸는 자리를 지켜보고 있습니다');
  if(s.selfStudy && at.stayN) 보는것.push('수업 전 자습 시간을 이어가고 있습니다');
  if(보는것.length) L.push(보는것.join('. ') + '.');

  /* ── ④ 집에서 ── */
  let 집 = '';
  if(hw.streak >= (CFG.streak || 3)) 집 = '집에서는 숙제를 다 했는지보다 <b>어디까지 했는지</b>만 한 번 물어봐 주시면 좋겠습니다.';
  else if(hw.wrongRate != null && hw.wrongRate < 70) 집 = '집에서는 <b>틀린 문제를 다시 풀었는지</b> 한 번만 확인해 주시면 좋겠습니다.';
  else if(at.uncovered) 집 = '빠진 수업은 보강으로 채우겠습니다. 일정만 알려 주시면 됩니다.';
  else if(hw.quality != null && gradeOf(hw.quality).g === 'A') 집 = '집에서는 지금처럼 <b>지켜봐 주시는 것</b>으로 충분합니다.';
  if(집) L.push(집.replace(/<\/?b>/g, ''));

  if(!L.length) L.push('이 기간에는 기록이 많지 않아 다음 기간에 더 자세히 전해 드리겠습니다.');
  return L.join(' ');
}

/* 세로형 카드를 캔버스에 직접 그린다 — 카카오톡으로 바로 보낼 수 있게 */
function drawParentCard(sid, comment){
  const S = byId[sid], at = attendStats(sid), hw = hwStats(sid), p = progOf(sid);
  const W = 860, H = 1600, R = 2;
  const cv = document.createElement('canvas');
  cv.width = W*R; cv.height = H*R;
  const x = cv.getContext('2d'); x.scale(R,R);
  const F = (w,sz)=>`${w} ${sz}px system-ui,-apple-system,"Malgun Gothic",sans-serif`;
  const INK='#0b0b0b', INK2='#52514e', MUT='#898781', LINE='#e1e0d9';
  const KC = {good:'#0ca30c', warn:'#fab219', serious:'#ec835a', crit:'#d03b3b', mute:'#898781'};
  const C = {all_done:'#0ca30c', mostly:'#0ca30c', hw_done_wrong_pending:'#fab219',
             not_brought:'#fab219',
             half:'#ec835a', partial:'#ec835a', little:'#d03b3b', none:'#d03b3b', no_hw:'#c3c2b7'};
  const wrap = (t, mx, fs) => {
    x.font = F(400, fs); const ws = String(t||'').split(/\s+/).filter(Boolean), out=[]; let ln='';
    ws.forEach(w=>{ const c = ln ? ln+' '+w : w;
      if(x.measureText(c).width > mx && ln){ out.push(ln); ln = w; } else ln = c; });
    if(ln) out.push(ln); return out;
  };

  x.fillStyle='#fcfcfb'; x.fillRect(0,0,W,H);
  x.fillStyle='#0b0b0b'; x.fillRect(0,0,W,8);

  let y = 58;
  x.fillStyle=MUT; x.font=F(600,17); x.fillText('더올림수학', 48, y);
  y += 46;
  x.fillStyle=INK; x.font=F(700,40); x.fillText(`${S.name} 학습 요약`, 48, y);
  y += 32;
  x.fillStyle=INK2; x.font=F(400,17);
  x.fillText(`${S.grade}${S.school?' · '+S.school:''}   |   ${fmtD(P.from)} ~ ${fmtD(P.to)}`, 48, y);

  // ── 등급 세 칸: 출결 · 숙제 완성도 · 오답
  y += 34;
  const cards = [
    ['출결', at.rateM ?? at.rate, at.present+at.absent ? `${at.present}/${at.present+at.absent}회 출석` : '기록 없음'],
    ['숙제 완성도', hw.quality, hw.total ? `${hw.total}회 제출` : '기록 없음'],
    ['오답 마무리', hw.wrongRate, hw.didHw ? `숙제 한 ${hw.didHw}회 중 ${hw.wrongDone}회` : '기록 없음'],
  ];
  const bw = (W-96-24)/3;
  cards.forEach((c,i)=>{
    const bx = 48 + i*(bw+12), g = gradeOf(c[1]);
    x.fillStyle = g ? KC[g.k]+'18' : '#f2f1ed';
    x.beginPath(); x.roundRect(bx, y, bw, 132, 14); x.fill();
    if(g){ x.strokeStyle = KC[g.k]+'55'; x.lineWidth=1;
           x.beginPath(); x.roundRect(bx+.5, y+.5, bw-1, 131, 14); x.stroke(); }
    x.fillStyle=INK2; x.font=F(600,15); x.fillText(c[0], bx+18, y+30);
    x.fillStyle = g ? KC[g.k] : MUT; x.font=F(700,46);
    x.fillText(g ? g.g : '—', bx+18, y+82);
    if(c[1] != null){ x.font=F(600,17); x.fillStyle=INK2;
      x.fillText(`${c[1]}%`, bx+18+x.measureText(g.g).width+22, y+82); }
    x.fillStyle=MUT; x.font=F(400,13.5); x.fillText(c[2], bx+18, y+112);
  });
  y += 132 + 20;
  x.fillStyle=MUT; x.font=F(400,13);
  x.fillText('A 80~100 · B 60~80 · C 40~60 · D 20~40 · E 0~20', 48, y);
  y += 34;

  // ── 진도
  x.fillStyle=INK; x.font=F(650,20); x.fillText('어디까지 나갔나', 48, y);
  y += 30; x.font=F(400,17); x.fillStyle=INK2;
  if(p && p.school){ x.fillText(`학교  ${p.school.sem} ${p.school.unit}`, 48, y); y += 26; }
  if(p && p.academy){ x.fillText(`학원  ${p.academy.sem} ${p.academy.unit}`, 48, y); y += 26; }
  if(p && p.kind && p.kind!=='nodata'){
    x.fillStyle = p.kind==='behind' ? KC.crit : KC.good; x.font=F(600,17);
    x.fillText(p.txt, 48, y); y += 28;
  } else if(!p || !p.academy){ x.fillText('진도 기록이 없습니다', 48, y); y += 28; }
  y += 12;

  // ── 그래프
  x.fillStyle=INK; x.font=F(650,20); x.fillText('숙제를 해 온 모습', 48, y);
  const rs = (BY_STU[sid]||[]).filter(r=>inP(r.date))
      .map(r=>({date:r.date, h:hwOf(r)})).filter(r=>r.h && r.h.code!=='no_hw')
      .sort((a,b)=> a.date<b.date?-1:1).slice(-14);
  const gx=48, gy=y+24, gw=W-96, gh=140;
  x.strokeStyle=LINE; x.lineWidth=1;
  [0,.5,1].forEach(t=>{ x.beginPath(); x.moveTo(gx, gy+gh*t+.5); x.lineTo(gx+gw, gy+gh*t+.5); x.stroke(); });
  if(rs.length){
    const n=rs.length, slot=gw/n, bwid=Math.min(38, slot*0.62);
    rs.forEach((r,i)=>{
      const v = (HWSCORE[r.h.code] ?? 50)/100, bh = Math.max(8, gh*v);
      const cx = gx + slot*i + (slot-bwid)/2;
      x.fillStyle = C[r.h.code] || MUT;
      x.beginPath(); x.roundRect(cx, gy+gh-bh, bwid, bh, 5); x.fill();
      if(n <= 10){ x.fillStyle=MUT; x.font=F(400,12); x.textAlign='center';
        x.fillText(fmtD(r.date).replace(/\(.\)/,''), cx+bwid/2, gy+gh+20); x.textAlign='left'; }
    });
    y = gy+gh + (n<=10 ? 46 : 24);
    x.font=F(400,13);
    [['모두 완료','#0ca30c'],['오답 남음','#fab219'],['일부만','#ec835a'],['못 함','#d03b3b']]
      .forEach((g,i)=>{ const lx = 48 + i*140;
        x.fillStyle=g[1]; x.beginPath(); x.roundRect(lx, y-10, 11, 11, 3); x.fill();
        x.fillStyle=MUT; x.fillText(g[0], lx+17, y); });
    y += 30;
  } else { x.fillStyle=MUT; x.font=F(400,15);
    x.fillText('이 기간에 숙제 기록이 없습니다', gx+8, gy+gh/2); y = gy+gh+28; }

  // ── 모르는 문제를 어떻게 풀었나
  const inp = (BY_STU[sid]||[]).filter(r=>inP(r.date));
  const NOQ = /^\s*(없|없어요|없습니다|없음|무|x|X|\.|-|없슴)\s*[.!]*\s*$/;
  const qs = inp.map(r=>askOf(r)?.question).filter(q=>q && !NOQ.test(q));
  const tried = [...new Set(inp.flatMap(r=>{ const t = askOf(r)?.tried; return t ? [t].flat() : []; }))];
  const helps = [...new Set(inp.flatMap(r=>r.dismissal?.help||[]))].filter(h=>!/요청\s*없음/.test(h));
  if(qs.length || tried.length || helps.length){
    y += 10;
    x.fillStyle=INK; x.font=F(650,20); x.fillText('모르는 문제를 만났을 때', 48, y);
    y += 30; x.font=F(400,16); x.fillStyle=INK2;
    if(qs.length){ x.fillText(`스스로 질문을 남긴 날 ${qs.length}회`, 48, y); y += 25; }
    if(tried.length) wrap('해 본 것 — ' + tried.join(', '), W-96, 16)
      .slice(0,2).forEach(l=>{ x.fillText(l, 48, y); y += 24; });
    if(helps.length) wrap('선생님께 요청 — ' + helps.join(', '), W-96, 16)
      .slice(0,2).forEach(l=>{ x.fillText(l, 48, y); y += 24; });
    y += 12;
  }

  // ── 코멘트
  y += 8;
  const lines = wrap(comment, W-96-52, 17);
  const cH = Math.max(120, 62 + lines.length*27 + 22);
  x.fillStyle='#f2f1ed'; x.beginPath(); x.roundRect(48, y, W-96, cH, 14); x.fill();
  x.fillStyle='#0b0b0b'; x.beginPath(); x.roundRect(48, y, 5, cH, 3); x.fill();
  x.fillStyle=INK; x.font=F(650,17); x.fillText('선생님 한마디', 74, y+34);
  x.fillStyle=INK2; x.font=F(400,17);
  let ly = y+66; lines.forEach(l=>{ x.fillText(l, 74, ly); ly += 27; });
  y += cH + 30;

  x.fillStyle=MUT; x.font=F(400,13);
  x.fillText('제출된 기록만으로 만들었습니다. 기록이 없는 날은 세지 않았습니다.', 48, y);

  const finalH = Math.ceil(y + 34);
  const out = document.createElement('canvas');
  out.width = W*R; out.height = finalH*R;
  const o = out.getContext('2d');
  o.fillStyle = '#fcfcfb'; o.fillRect(0, 0, W*R, finalH*R);
  o.drawImage(cv, 0, 0, W*R, finalH*R, 0, 0, W*R, finalH*R);
  return out;
}

/* ═══ 오늘 탭 — 「보낼 때가 됐습니다」 ═════════════════════════
   때가 안 됐으면 아예 안 나타납니다. 나타나면 그냥 위에서부터 누르시면 됩니다.
   누구 차례인지 원장님이 기억할 필요가 없어야 합니다. */
function reportBatch(){
  const q = sendQueue();
  const done = sendOf(TODAY);
  const 남은 = q.filter(x=> !done.includes(x.s.id) && (!x.last || x.ago >= SEND_EVERY));
  const 보냄 = done.map(id=> byId[id]).filter(Boolean).map(s2=>({s:s2, done:true}));
  const 칸 = Math.max(0, SEND_BATCH - 보냄.length);
  return {남은: 남은.slice(0, 칸), 보냄, 더: Math.max(0, 남은.length - 칸)};
}
function reportHtml(){
  if(!sendDue()) return '';
  const B = reportBatch();
  if(!B.남은.length && !B.보냄.length) return '';
  const 총 = B.남은.length + B.보냄.length;
  let h = `<div class="card doorCard"><div class="doorTop">
      <h2 style="margin:0">학부모 보고서 보낼 때</h2>
      <span class="wgN">${B.보냄.length}/${총} 보냄</span></div>
    <div class="sub">오래 안 보낸 순입니다. 위에서부터 누르시면 됩니다 —
      누가 남았는지 기억하지 않으셔도 됩니다.</div>`;
  B.남은.forEach(x=>{
    const 언제 = x.last ? `마지막 발송 ${x.ago}일 전` : '보낸 적 없음';
    h += `<button class="row" data-parent="${x.s.id}" style="width:100%;text-align:left">
      <span class="grow"><span class="nm">${esc(x.s.name)}</span>
        <span class="meta">${esc(x.s.grade)} · ${언제}</span></span>
      <span class="right">›</span></button>`;
  });
  if(B.더) h += `<div class="meta" style="margin-top:8px">이 다음 차례 ${B.더}명은
    이번 것을 다 보내면 올라옵니다.</div>`;
  if(B.보냄.length){
    h += `<div class="meta" style="font-weight:700;margin:14px 0 6px">오늘 보냄</div>`;
    B.보냄.forEach(x=>{
      h += `<div class="row"><span class="grow"><span class="nm">✓ ${esc(x.s.name)}</span></span>
        <button class="doorNo" data-unsent="${x.s.id}">되돌리기</button></div>`;
    });
  }
  h += `</div>`;
  return h;
}

  const s = byId[sid];
  window.__pc = window.__pc || {};
  if(!window.__pc[sid]) window.__pc[sid] = parentComment(sid);
  window.__sceneWas = sceneOf(sid);
  const txt = parentSummary(sid);
  $('#sheetIn').innerHTML = `<div class="sheetTop">
      <span class="nm" style="font-size:17px">${esc(s.name)} · 학부모 발송용</span>
      <button class="closeX" id="closeSheet">×</button></div>
    <div class="sub">${fmtD(P.from)} ~ ${fmtD(P.to)} 기록만으로 만들었습니다</div>
    <div class="seg" style="margin-bottom:12px">
      <button data-ptab="card" aria-pressed="true">카드 이미지</button>
      <button data-ptab="text" aria-pressed="false">글로 보내기</button>
    </div>
    <div id="pCard">
      <div id="cardBox" style="border:1px solid var(--line);border-radius:12px;overflow:hidden"></div>
      <label class="cfg" style="border-top:none;display:block;padding-bottom:4px">
        <b style="font-size:13.5px">장면 한 줄</b>
        <span class="meta" style="display:block">원장님이 쓰시는 곳은 여기 하나입니다.
          나머지 문장은 기록에서 만듭니다.</span></label>
      <input id="pScene" class="hwInp" type="text" maxlength="70"
        placeholder="예) 지난 화요일 이차방정식 문제를 혼자 끝까지 풀어냈습니다"
        value="${esc(sceneOf(sid))}">
      <div class="meta" style="margin-top:6px">비워 두셔도 됩니다 —
        그러면 기록으로 만든 문장만 나갑니다.</div>
      <label class="cfg" style="border-top:none;display:block;padding:12px 0 4px">
        <b style="font-size:13.5px">선생님 한마디</b>
        <span class="meta" style="display:block">고쳐 쓰시면 카드에 바로 반영됩니다</span></label>
      <textarea id="pComment" class="search" rows="4"
        style="resize:vertical;line-height:1.6">${esc(window.__pc[sid])}</textarea>
      <button class="btn" data-pdl="${sid}">이미지로 저장</button>
      <button class="btn ghost" data-preset="${sid}">한마디 다시 만들기</button>
      <button class="btn ghost" data-sentnext="${sid}">보냄으로 표시하고 다음 사람</button>
      <div class="kv" style="margin-top:12px">저장된 이미지를 카카오톡으로 바로 보내시면 됩니다.
        휴대폰에서 저장이 안 되면 카드를 <b>길게 눌러</b> 이미지를 저장하세요.</div>
    </div>
    <div id="pText" style="display:none">
      <div class="copyBox" id="pSum">${esc(txt)}</div>
      <button class="btn" id="pCopy">전체 복사</button>
    </div>`;
  $('#sheet').classList.add('on'); $('#sheetIn').scrollTop = 0;
  renderCard(sid);
}
function renderCard(sid){
  const box = $('#cardBox'); if(!box) return;
  const cv = drawParentCard(sid, window.__pc[sid]);
  cv.style.width = '100%'; cv.style.display = 'block';
  box.innerHTML = ''; box.appendChild(cv);
  window.__cv = cv;
}

/* ═══════════════════════ 계획 탭 — 학생별 진도 로드맵 (3b-1) ═══════════════════════
   아이패드 진도표의 선행/현행 시트를 앱으로. 과정의 단원 목록 위에
   1회·2회 학습 날짜가 자동으로 얹히고, 단원을 눌러 다음 수업 계획에 바로 넣는다. */
let PLANSID = null, PLANSEM = null, PLANVIEW = 'road', PLANMON = TODAY.slice(0,7);
/* 고정 일정 — 진도표 2권에 적혀 있던 학교 시험·공휴일. 새 일정이 확정되면 달력에서 직접 적으세요.
   (개학·방학은 학교별로 달라 진도표에서도 수기 항목이었습니다) */
const CAL_FIXED_RANGES = [
  {from:'2026-09-24', to:'2026-09-26', label:'추석 연휴'},
  {from:'2026-10-01', to:'2026-10-02', label:'하늘중 중간고사'},
  {from:'2026-10-03', to:'2026-10-03', label:'개천절'},
  {from:'2026-10-05', to:'2026-10-05', label:'대체공휴일'},
  {from:'2026-10-07', to:'2026-10-08', label:'운서중 중간고사'},
  {from:'2026-10-09', to:'2026-10-09', label:'한글날'},
  {from:'2026-10-20', to:'2026-10-21', label:'중산중 중간고사'},
  {from:'2026-12-25', to:'2026-12-25', label:'성탄절'},
  {from:'2027-01-01', to:'2027-01-01', label:'신정'},
];
function calFixedOn(ds){ return CAL_FIXED_RANGES.filter(r=> r.from <= ds && ds <= r.to).map(r=>r.label); }
function planCalHtml(){
  const [y, mo] = PLANMON.split('-').map(Number);
  const firstDow = parseYmd(PLANMON + '-01').getDay();
  const dim = new Date(y, mo, 0).getDate();
  const isThisMon = PLANMON === TODAY.slice(0,7);
  let h = `<div class="card"><div style="display:flex;align-items:center;gap:8px">
    <button class="btn ghost" data-calmon="-1" style="width:auto;margin:0;padding:10px 16px;font-size:14px;font-weight:700">‹ 지난달</button>
    <h2 class="grow" style="text-align:center">${y}년 ${mo}월${isThisMon?'':` <button data-calmon="0" style="font-size:11px;color:var(--s1);font-weight:600;padding:2px 6px">이번 달로</button>`}</h2>
    <button class="btn ghost" data-calmon="1" style="width:auto;margin:0;padding:10px 16px;font-size:14px;font-weight:700">다음달 ›</button></div>
    <div class="sub" style="margin-top:6px;text-align:center">날짜를 누르면 일정을 적습니다 — 개학 · 방학 · 상담 예약 · 시험.
      노션에 저장되어 아이패드와 폰에서 똑같이 보입니다.</div>
    <div class="calGrid">`;
  ['일','월','화','수','목','금','토'].forEach(w=> h += `<div class="calW${w==='일'?' sun':''}">${w}</div>`);
  for(let i=0; i<firstDow; i++) h += `<div class="calC off"></div>`;
  const evs = [];
  const mEnd = `${PLANMON}-${String(dim).padStart(2,'0')}`;
  for(let d=1; d<=dim; d++){
    const ds = `${PLANMON}-${String(d).padStart(2,'0')}`;
    const ev = (OVR['달력|'+ds]||{}).note || '';
    if(ev) evs.push({day:ds, when:fmtD(ds), text:ev, fixed:false});
    const fxs = calFixedOn(ds);
    const exam = /시험|중간|기말|평가|고사/.test(fxs.join('') + ev);
    h += `<button class="calC${ds===TODAY?' today':''}${exam?' exam':''}" data-calday="${ds}">
      <span class="calD">${d}</span>
      ${fxs.map(f=>`<span class="calE" style="color:var(--crit);font-weight:600">${esc(f)}</span>`).join('')}
      ${ev? `<span class="calE">${esc(ev)}</span>`:''}
    </button>`;
  }
  h += `</div></div>`;
  CAL_FIXED_RANGES.forEach(r=>{
    if(r.to < PLANMON+'-01' || r.from > mEnd) return;
    evs.push({day:r.from, when: r.from===r.to ? fmtD(r.from) : `${fmtD(r.from)} ~ ${fmtD(r.to)}`, text:r.label, fixed:true});
  });
  evs.sort((a,b)=> a.day<b.day?-1:1);
  h += `<div class="card"><h2>이달 일정<span class="wgN">${evs.length}건</span></h2>${
    evs.length
      ? `<div class="calList">` + evs.map(e=>`<button class="row" data-calday="${e.day}">
          <span style="min-width:66px;font-weight:600;font-size:13px;flex:0 0 auto;font-variant-numeric:tabular-nums">${esc(e.when)}</span>
          <span class="grow" style="font-size:13px${e.fixed?';color:var(--crit)':''}">${esc(e.text)}</span>
          <span class="right" style="font-size:11px;color:var(--${e.fixed?'muted':'s1'});min-width:30px">${e.fixed?'고정':'✎'}</span></button>`).join('') + `</div>`
      : `<div class="empty">아직 적은 일정이 없습니다 — 달력에서 날짜를 눌러 적어 보세요.</div>`}</div>`;
  return h;
}
/* ── 단원 기준(체크사항)과 만점 통과 — 3b-3 ──────────────────────────

function passMapOf(sname){
  const out = {};   // '과정 단원' -> 가장 이른 통과일
  const pre = '통과|' + sname + '|';
  Object.keys(OVR).forEach(k=>{
    if(!k.startsWith(pre)) return;
    const date = k.slice(pre.length);
    String(OVR[k].note||'').split('∥').map(x=>x.trim()).filter(Boolean).forEach(tag=>{
      if(!out[tag] || out[tag] > date) out[tag] = date;
    });
  });
  return out;
}
function passToggle(sname, sem, unit, passedDate){
  const tag = sem + ' ' + unit;
  if(passedDate){
    const k = '통과|' + sname;
    const cur = (OVR[k+'|'+passedDate]||{}).note || '';
    const parts = cur.split('∥').map(x=>x.trim()).filter(Boolean).filter(x=>x!==tag);
    return setOvr(k, passedDate, {note: parts.join(' ∥ ')});
  }
  const k = '통과|' + sname;
  const cur = (OVR[k+'|'+TODAY]||{}).note || '';
  const parts = cur.split('∥').map(x=>x.trim()).filter(Boolean);
  if(!parts.includes(tag)) parts.push(tag);
  return setOvr(k, TODAY, {note: parts.join(' ∥ ')});
}

/* ── 수업료 대장 (4단계) ─────────────────────────────────────────────
   장부 기록만 한다 — 돈이 오가는 건 앱 밖. 앱 전체가 PIN 잠금이라 원장만 본다.
   저장: 가짜 학생 「수업료|이름」 + 그 달 1일 날짜 행의 note 로 노션에.
   note 예: "35만 · 입금 8/5 · 영수증 ✓ · 메모…" — 입금/영수증/미납 낱말로 상태를 읽는다. */
let FEEMON = TODAY.slice(0,7);
let FEEVIEW = 'fee';   // 'fee' 받는 돈 · 'exp' 쓴 돈
let EXPYEAR = false;   // 올해 전체 표 펼침
function feeKey(name){ return `수업료|${name}|${FEEMON}-01`; }
function feeOf(name){ return (OVR[feeKey(name)]||{}).note || ''; }
function feeSave(name, text){ return setOvr(`수업료|${name}`, `${FEEMON}-01`, {note: text}); }
function feeMonAdd(k){
  const [y, m] = FEEMON.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
/* 지난달 기록에서 상태 낱말(입금·영수증·미납)을 뺀 나머지 = 금액·메모 */
function feeAmountPart(txt){
  return String(txt||'').split('·').map(x=>x.trim())
    .filter(x=>x && !/입금|영수증|미납/.test(x)).join(' · ');
}
const won = n => (Number(n) || 0).toLocaleString('ko-KR');   /* 350000 → 350,000 */
/* ── 금액 ────────────────────────────────────────────────────────
   여태 「35만」처럼 손으로 적어 두신 글자를 그대로 두고도 합계가 나오게 합니다.
   「35만」 「35.5만」 「350,000원」 「350000」 을 모두 같은 금액으로 읽습니다.
   앞으로 저장할 때는 「350,000원」 꼴로 맨 앞에 둡니다 — 눈으로도 바로 보이게. */
function moneyIn(part){
  const t = String(part || '');
  if(/입금|영수증|미납/.test(t)) return 0;          // 상태 낱말은 금액이 아닙니다
  let m = t.match(/(\d+(?:\.\d+)?)\s*만/);
  if(m) return Math.round(Number(m[1]) * 10000);
  m = t.match(/(\d{1,3}(?:,\d{3})+|\d{4,})\s*원?/);
  if(m) return Number(String(m[1]).replace(/,/g, ''));
  return 0;
}
function feeAmount(txt){
  const ps = String(txt || '').split('·').map(x=>x.trim()).filter(Boolean);
  for(const x of ps){ const v = moneyIn(x); if(v) return v; }
  return 0;
}
/* 기록에서 금액만 갈아 끼웁니다 — 입금·영수증·메모는 그대로 둡니다 */
function feeWithAmount(txt, amt){
  const ps = String(txt || '').split('·').map(x=>x.trim()).filter(Boolean).filter(x=>!moneyIn(x));
  if(amt > 0) ps.unshift(won(amt) + '원');
  return ps.join(' · ');
}
/* 그 학생이 최근에 적어 두신 금액 — 몇 달을 건너뛰어도 찾아옵니다 */
function feeLastAmount(name, back){
  for(let k = 1; k <= (back || 6); k++){
    const v = feeAmount((OVR[`수업료|${name}|${feeMonAdd(-k)}-01`] || {}).note || '');
    if(v) return {amt: v, mon: feeMonAdd(-k)};
  }
  return null;
}
/* 다른 학생들에게 많이 쓰신 금액 — 새 학생 적으실 때 한 번에 고르시라고 */
function feeCommonAmounts(){
  const cnt = {};
  Object.keys(OVR).filter(k=>k.indexOf('수업료|') === 0).forEach(k=>{
    const v = feeAmount((OVR[k] || {}).note || '');
    if(v) cnt[v] = (cnt[v] || 0) + 1;
  });
  return Object.keys(cnt).map(Number).sort((a,b)=> cnt[b] - cnt[a] || b - a).slice(0, 3);
}
/* 이번 달 수입 — 적어 두신 금액의 합, 그리고 그중 입금 확인된 몫 */
function feeMonthSum(mon){
  const m = mon || FEEMON;
  let total = 0, got = 0, wrote = 0;
  ACTIVE.forEach(s=>{
    const txt = (OVR[`수업료|${s.name}|${m}-01`] || {}).note || '';
    const v = feeAmount(txt);
    if(v){ total += v; wrote++; if(/입금/.test(txt)) got += v; }
  });
  return {total, got, due: total - got, wrote, blank: ACTIVE.length - wrote};
}
function expMonthList(mon){
  const m = mon || FEEMON;
  const last = String(new Date(Number(m.slice(0,4)), Number(m.slice(5,7)), 0).getDate()).padStart(2,'0');
  return expAll(`${m}-01`, `${m}-${last}`);
}
function expMonthSum(mon){ return expSum(bizOnly(expMonthList(mon))); }   // 공부방 것만
function expMonthMine(mon){ return expSum(mineOnly(expMonthList(mon))); }
/* 한 해 수입 — 퇴원한 학생 것까지 다 셉니다(그 해에 실제로 받은 돈이니까).
   그래서 ACTIVE 가 아니라 적어 둔 기록 전체를 훑습니다. */
function feeYearSum(y){
  let total = 0, got = 0, months = new Set();
  Object.keys(OVR).forEach(k=>{
    if(k.indexOf('수업료|') !== 0) return;
    const d = k.slice(k.lastIndexOf('|') + 1);
    if(d.slice(0,4) !== String(y)) return;
    const t = (OVR[k] || {}).note || '';
    const v = feeAmount(t);
    if(!v) return;
    total += v; months.add(d.slice(0,7));
    if(/입금/.test(t)) got += v;
  });
  return {total, got, months: months.size};
}
/* 교육서비스업 — 직전 해 수입이 이 선을 넘으면 그 다음 해부터 복식부기 장부 대상입니다.
   (2026년 기준. 국세청 기준이 바뀌면 이 숫자만 고치면 됩니다) */
const BOOK_LINE = 75000000;
function feeYearHtml(){
  const y = Number(FEEMON.slice(0,4));
  const ys = feeYearSum(y);
  if(!ys.total) return '';
  const over = ys.total >= BOOK_LINE;
  const rest = BOOK_LINE - ys.total;
  const pct = Math.min(100, Math.round(ys.total / BOOK_LINE * 100));
  return `<div class="card"><h2>${y}년 수입<span class="wgN">${ys.months}개월 적힘</span></h2>
    <div class="kv" style="line-height:2;font-size:14px">
      <span style="color:var(--muted)">올해 적어 둔 수업료</span> <b style="font-size:17px">${won(ys.total)}원</b><br>
      <span style="color:var(--muted)">그중 입금 확인</span> <b>${won(ys.got)}원</b></div>
    <span class="pbar" style="height:8px;margin:10px 0 6px">
      <i class="${over?'yWarn':'yOk'}" style="left:0;width:${pct}%"></i></span>
    <div class="meta">${over
      ? `<b style="color:var(--warn)">장부 기준선(7,500만원)을 넘었습니다.</b>
         올해 수입이 이대로면 <b>내년부터 복식부기 장부</b> 대상입니다 —
         그때는 세무사에게 맡기시는 편이 낫습니다(장부 없이 내면 가산세가 붙습니다).`
      : `장부 기준선(7,500만원)까지 <b>${won(rest)}원</b> 남았습니다 (${pct}%).
         이 선 아래면 <b>간편장부</b>라 지금처럼 적어 두신 것으로 혼자 신고하실 수 있습니다.`}</div>
    <div class="meta" style="margin-top:6px">이 숫자는 <b>금액을 적어 두신 것만</b> 셉니다.
      빈 달이 있으면 그만큼 적게 나옵니다.</div></div>`;
}

/* ── 세금 달력 ────────────────────────────────────────────────────
   공부방은 부가세 면세라 부가세 신고 대신 「사업장현황신고」를 합니다.
   두 날짜뿐이고, 기간이 되면 오늘 화면에 알아서 뜹니다. */
const TAXDAYS = [
  {from:'01-05', to:'02-10', due:'02-10', t:'사업장현황신고',
   s:'작년 수입을 신고합니다 — 부가세 면세라 이걸 대신 냅니다. 홈택스에서 직접 됩니다.'},
  {from:'05-01', to:'05-31', due:'05-31', t:'종합소득세 신고',
   s:'수입 − 경비로 세금을 냅니다. 지출 대장 「표로 복사」를 그대로 쓰시면 됩니다.'},
];
function taxDueNow(){
  const md = TODAY.slice(5);
  const hit = TAXDAYS.find(x=> md >= x.from && md <= x.to);
  if(!hit) return null;
  const y = Number(TODAY.slice(0,4));
  const days = Math.round((parseYmd(`${y}-${hit.due}`) - parseYmd(TODAY)) / 86400000);
  return {...hit, days};
}

/* 두 탭 어디에 계셔도 같은 자리에서 보이는 이번 달 셈 */
function feeProfitHtml(){
  const f = feeMonthSum(), e = expMonthSum(), mine = expMonthMine();
  const left = f.total - e;
  return `<div class="card"><h2>${Number(FEEMON.slice(5))}월 셈<span class="wgN">수입 − 지출</span></h2>
    <div class="kv" style="line-height:2;font-size:14px">
      <span style="color:var(--muted)">받을 수업료</span> <b>${won(f.total)}원</b>${
        f.blank ? ` <span class="meta">· ${f.blank}명 금액 안 적힘</span>` : ''}<br>
      <span style="color:var(--muted)">쓴 돈</span> <b>−${won(e)}원</b>${
        mine ? ` <span class="meta">· 개인 ${won(mine)}원은 뺐습니다</span>` : ''}<br>
      <span style="color:var(--muted)">남는 돈</span>
      <b style="font-size:17px;color:${left < 0 ? 'var(--crit)' : 'var(--good)'}">${won(left)}원</b></div>
    <div class="meta" style="margin-top:6px">입금 확인된 돈은 ${won(f.got)}원, 아직 안 들어온 돈은 ${won(f.due)}원입니다.</div></div>`;
}
function feeCarryJobs(){
  const jobs = [];
  ACTIVE.forEach(s=>{
    if(feeOf(s.name)) return;                                   // 이번 달에 이미 적은 학생은 건드리지 않음
    const last = feeLastAmount(s.name, 6);                      // 한두 달 건너뛰어도 찾아옵니다
    if(last) jobs.push({s, amt: won(last.amt) + '원'});
  });
  return jobs;
}
async function feeCarryOver(){
  const jobs = feeCarryJobs();
  if(!jobs.length) return toast('가져올 지난달 금액이 없습니다');
  if(!confirm(`지난달 금액을 ${jobs.length}명에게 그대로 가져올까요?\n입금·영수증 표시는 가져오지 않습니다.`)) return;
  toast(`${jobs.length}명 가져오는 중…`);
  let bad = 0;
  for(const j of jobs){ const r = await feeSave(j.s.name, j.amt); if(!(r && r.ok)) bad++; }
  toast(bad ? `${jobs.length - bad}명 저장 · ${bad}명은 이 기기에만` : `${jobs.length}명 가져왔습니다`);
  render();                     /* 오늘 화면에서 눌렀을 때도 그 자리가 바로 갱신되게 */
  if(SCR !== 'fee') viewFee();
}
function feeState(txt){
  return {paid: /입금/.test(txt), rcpt: /영수증/.test(txt), unpaid: /미납/.test(txt)};
}
/* 「입금 9/5(금)」 에서 날짜만 꺼냅니다.
   해가 안 적혀 있어서, 그 수업료 달을 기준으로 가장 가까운 해를 고릅니다 —
   1월 수업료를 12월에 미리 내신 경우도 제 해로 잡히게 하려는 것입니다. */
function feePaidDate(txt, mon){
  const m = String(txt || '').match(/입금\s*(\d{1,2})\/(\d{1,2})/);
  if(!m) return '';
  const base = mon || FEEMON;
  const y0 = Number(base.slice(0,4)), m0 = Number(base.slice(5,7));
  const mm = Number(m[1]), dd = Number(m[2]);
  let y = y0;
  if(mm - m0 > 6) y -= 1;
  if(m0 - mm > 6) y += 1;
  const d = `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  return (/^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d))) ? d : '';
}

/* ═══════════════════════ 지출 대장 ═══════════════════════
   토너·A4용지처럼 학원 운영에 쓴 돈을 적어 둡니다. 연말 경비 처리에 그대로 씁니다.
   저장은 기존 통로 그대로 — 노션 「✎ 원장 수정 기록」에 「지출|날짜」 한 줄,
   그날 산 것들을 ∥ 로 이어 둡니다. 한 건 = 분류|항목|금액|결제수단|반복|개인 */
/* 분류는 원장님이 고르기 쉬운 말로 두고, 세무 계정과목은 아래 표로 따로 붙입니다.
   그래야 고를 때는 편하고, 세무사에게 넘길 때는 그대로 쓰입니다. */
const EXP_CATS = ['소모품', '간식·식대', '교재·교구', '구독료', '통신비',
                  '공과금', '보험료', '임대료', '광고선전', '상담 다과', '비품',
                  '기부금', '기타'];
const EXP_ACCT = {
  '소모품':    '소모품비',
  '간식·식대': '복리후생비',
  '교재·교구': '도서인쇄비',
  '구독료':    '지급수수료',
  '통신비':    '통신비',
  '공과금':    '수도광열비',
  '보험료':    '보험료',      // 건강보험·장기요양·화재보험 등
  '임대료':    '임차료',
  '광고선전':  '광고선전비',
  '상담 다과': '기업업무추진비',
  '비품':      '비품(자산·감가상각)',
  '기부금':    '기부금',      // 정기 후원·헌금 — 필요경비 산입 대상(한도 있음)
  '기타':      '잡비',
};
/* 이 지출이 공부방 것이냐 내 것이냐 — 분류(계정과목)와는 다른 축입니다.
   공부방 것만 합계·경비에 들어가고, 개인 것은 따로 모아 보여만 줍니다. */
const EXP_OWNS = ['공부방', '개인'];
const acctOf = c => EXP_ACCT[c] || '잡비';
const EXP_PAYS = ['카드', '현금', '계좌이체'];
function expKey(d){ return '지출|' + d; }
function expOf(d){
  return String((OVR[expKey(d)] || {}).note || '').split('∥').map(x=>x.trim()).filter(Boolean).map(x=>{
    const q = x.split('|').map(y=>y.trim());
    return {cat: q[0] || '기타', name: q[1] || '', amt: Number(q[2]) || 0, pay: q[3] || '',
            rep: q[4] === 'R',                       // 매달 반복 표시
            own: q[5] === 'P' ? '개인' : '공부방'};   // 옛 기록(칸 없음)은 모두 공부방
  });
}
function expSaveDay(d, items){
  const note = items.map(i=>[i.cat, i.name, i.amt, i.pay, i.rep ? 'R' : '',
                             i.own === '개인' ? 'P' : ''].join('|')).join(' ∥ ');
  return setOvr('지출', d, {note});
}
function expAll(from, to){
  const out = [];
  Object.keys(OVR).filter(k=>k.indexOf('지출|') === 0).map(k=>k.slice(3))
    .filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d) && d >= from && d <= to).sort()
    .forEach(d=> expOf(d).forEach((it, i)=> out.push(Object.assign({}, it, {date:d, i}))));
  return out;
}
function expSum(list){ return list.reduce((a,x)=>a + x.amt, 0); }
const bizOnly  = list => list.filter(x=> x.own !== '개인');   // 경비로 셀 것
const mineOnly = list => list.filter(x=> x.own === '개인');

function feeTabsHtml(){
  return `<div style="display:flex;gap:6px;margin:0 2px 12px">
    <button class="chip" data-feetab="fee" aria-pressed="${FEEVIEW==='fee'?'true':'false'}">수업료 (받는 돈)</button>
    <button class="chip" data-feetab="exp" aria-pressed="${FEEVIEW==='exp'?'true':'false'}">지출 (쓴 돈)</button></div>`;
}

function viewExp(){
  const [y, mo] = FEEMON.split('-').map(Number);
  const last = String(new Date(y, mo, 0).getDate()).padStart(2,'0');
  const all = expAll(`${FEEMON}-01`, `${FEEMON}-${last}`);
  const list = bizOnly(all);                 // 합계·분류별은 공부방 것만
  const mine = mineOnly(all);
  const total = expSum(list), mineTotal = expSum(mine);
  const byCat = {};
  list.forEach(x=>{ byCat[x.cat] = (byCat[x.cat] || 0) + x.amt; });
  // 분류 이름이 바뀌어도 옛 기록이 사라지지 않도록, 실제 쓰인 이름을 모두 셈에 넣는다
  const catsUsed = EXP_CATS.concat(Object.keys(byCat).filter(c=>!EXP_CATS.includes(c)));

  let h = `<div class="card" style="display:flex;align-items:center;gap:8px">
    <button data-act="feeBack" aria-label="오늘 화면으로" style="font-size:22px;line-height:1;padding:2px 8px">‹</button>
    <span class="grow"><span class="nm" style="font-size:16px">지출 대장</span>
      <span class="meta">공부방에 쓴 돈을 적어 둡니다 — 연말 경비 처리에 그대로. 개인 것도 적어 두시면 갈라 둡니다</span></span></div>`;
  h += feeTabsHtml();
  h += `<div class="card"><div style="display:flex;align-items:center;gap:8px">
    <button class="btn ghost" data-feemon="-1" style="width:auto;margin:0;padding:9px 14px;font-size:13.5px;font-weight:700">‹ 지난달</button>
    <h2 class="grow" style="text-align:center">${y}년 ${mo}월</h2>
    <button class="btn ghost" data-feemon="1" style="width:auto;margin:0;padding:9px 14px;font-size:13.5px;font-weight:700">다음달 ›</button></div>
    <div class="tiles" style="margin-top:12px">
      ${tile('mute','이번 달 공부방 지출', won(total), '원', `${list.length}건`, '')}
      ${tile('mute','올해 누적', won(expSum(bizOnly(expAll(`${y}-01-01`, `${y}-12-31`)))), '원', `${y}년`, 'expYear')}
    </div>${mineTotal ? `<div class="meta" style="margin-top:8px">개인으로 적어 두신 것 ${mine.length}건 ·
      ${won(mineTotal)}원 — 합계와 세무 자료에서 뺐습니다.</div>` : ''}
    <button class="btn" data-expadd="1" style="margin-top:12px">+ 지출 적기</button>${(()=>{
      // 구독료·임대료처럼 매달 같은 것은 지난달 것을 그대로 가져옵니다
      const pm = feeMonAdd(-1);
      const plm = String(new Date(Number(pm.slice(0,4)), Number(pm.slice(5,7)), 0).getDate()).padStart(2,'0');
      const reps = expAll(`${pm}-01`, `${pm}-${plm}`).filter(x=>x.rep);
      const have = list.filter(x=>x.rep).length;
      return (reps.length && !have) ? `<button class="btn ghost" data-act="expCarry" style="margin-top:8px">
        ↩ 매달 반복 ${reps.length}건 가져오기 <span style="font-weight:400;font-size:11.5px;opacity:.75">— ${esc(reps.map(x=>x.name).slice(0,3).join(' · '))}${reps.length>3?' 외':''}</span></button>` : '';
    })()}</div>`;

  h += feeProfitHtml();
  if(total){
    h += `<div class="card"><h2>분류별</h2>`;
    catsUsed.filter(c=>byCat[c]).sort((a,b)=>byCat[b]-byCat[a]).forEach(c=>{
      const pct = Math.round(byCat[c] / total * 100);
      h += `<div class="row" style="align-items:center">
        <span class="grow"><span class="nm" style="font-size:13.5px">${esc(c)}
          <span style="font-weight:400;color:var(--muted);font-size:11px">${esc(acctOf(c))}</span></span>
          <span class="pbar" style="height:6px;margin:6px 0 0">
            <i class="acad" style="left:0;width:${pct}%"></i></span></span>
        <span class="right">${won(byCat[c])}원<br><span style="color:var(--muted)">${pct}%</span></span></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="card"><h2>${mo}월 내역<span class="wgN">${all.length}건</span></h2>`;
  if(!all.length) h += `<div class="empty">이 달에 적은 지출이 없습니다.</div>`;
  let lastD = '';
  all.slice().reverse().forEach(x=>{
    if(x.date !== lastD){ h += `<div class="meta" style="padding:10px 0 2px;font-weight:700;color:var(--ink2)">${fmtD(x.date)}</div>`; lastD = x.date; }
    h += `<button class="row" data-expedit="${x.date}|${x.i}">
      <span class="grow"><span class="nm" style="font-size:13.5px">${esc(x.name || '(항목 없음)')}${
          x.rep?' <span style="font-weight:400;font-size:10.5px;color:var(--s1)">↻ 매달</span>':''}${
          x.own==='개인'?' <span style="font-weight:400;font-size:10.5px;color:var(--muted)">· 개인</span>':''}</span>
        <span class="meta">${esc(x.cat)}${x.pay?` · ${esc(x.pay)}`:''}</span></span>
      <span class="right"><b>${won(x.amt)}원</b><br><span style="font-size:10px;color:var(--s1)">✎ 고치기</span></span></button>`;
  });
  h += `</div>`;

  if(EXPYEAR){
    const rows = [];
    for(let m=1; m<=12; m++){
      const mk = `${y}-${String(m).padStart(2,'0')}`;
      const lm = String(new Date(y, m, 0).getDate()).padStart(2,'0');
      const ls = bizOnly(expAll(`${mk}-01`, `${mk}-${lm}`));
      if(ls.length) rows.push({m, ls, sum: expSum(ls)});
    }
    h += `<div class="card"><h2>${y}년 전체<span class="wgN">${won(expSum(bizOnly(expAll(`${y}-01-01`,`${y}-12-31`))))}원</span></h2>
      <div class="sub">공부방 지출만 모았습니다 — 연말에 그대로 넘기시면 됩니다</div>`;
    if(!rows.length) h += `<div class="empty">올해 적은 지출이 없습니다.</div>`;
    else {
      const used = [];

/* 칩을 누르면 화면을 다시 그리므로, 그 전에 지금 적힌 값을 붙잡아 둔다 */
function expGrab(){

  const d = g('expDate'), n = g('expName'), a = g('expAmt');

}

function expCopyTable(){

  all.forEach(x=> lines.push([x.date, acctOf(x.cat), x.cat, x.name, x.amt, x.pay].join('\t')));
  lines.push(['합계','','','', expSum(all), ''].join('\t'));
  // 세무사가 실제로 보는 건 계정과목별 합계라 아래에 따로 붙입니다
  const byA = {};
  all.forEach(x=>{ const a = acctOf(x.cat); byA[a] = (byA[a] || 0) + x.amt; });
  lines.push('', `[${y}년 계정과목별 합계]`, '계정과목\t금액');
  Object.keys(byA).sort((a,b)=>byA[b]-byA[a]).forEach(a=> lines.push([a, byA[a]].join('\t')));
  lines.push(['합계', expSum(all)].join('\t'));
  /* 수입도 함께 — 세무 자료는 수입·지출이 같이 있어야 쓸모가 있습니다 */
  let inSum = 0;
  const inLines = ['', `[${y}년 수업료 수입]`, '월\t학생\t금액\t입금\t현금영수증'];
  for(let m = 1; m <= 12; m++){

    ACTIVE.forEach(s=>{
      const t = (OVR[`수업료|${s.name}|${mk}-01`] || {}).note || '';
      const v = feeAmount(t);
      if(!v) return;
      inSum += v;
      inLines.push([`${m}월`, s.name, v, /입금/.test(t) ? 'O' : '', /영수증/.test(t) ? 'O' : ''].join('\t'));
    });
  }
  inLines.push(['합계', '', inSum, '', ''].join('\t'));
  inLines.push('', `[${y}년 요약]`, '구분\t금액',
    ['수입', inSum].join('\t'), ['지출', expSum(all)].join('\t'),
    ['남은 돈', inSum - expSum(all)].join('\t'));
  lines.push(...inLines);
  /* 개인 지출은 경비가 아니라 따로 맨 뒤에 — 빠뜨리지도, 섞이지도 않게 */
  if(mine.length){
    lines.push('', `[${y}년 개인 지출 — 경비 아님]`, '날짜\t분류\t항목\t금액\t결제');
    mine.forEach(x=> lines.push([x.date, x.cat, x.name, x.amt, x.pay].join('\t')));
    lines.push(['합계', '', '', expSum(mine), ''].join('\t'));
  }
  const txt = lines.join('\n');
  const done = ()=> toast(`${y}년 수입·지출을 복사했습니다`);
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사하지 못했습니다'); }
    ta.remove();
  }
}

/* ═══════════════════════ 수업료 납부일 ═══════════════════════
   「이 날까지 들어와야 한다」는 날짜입니다. 매월 며칠(1~31).
   기본값은 명단에 있고, 원장님이 고치신 것은 아래 한 칸에 모입니다. */
const PAYKEY = '납부일|1900-01-03';
function payOvrMap(){
  const note = (OVR[PAYKEY] || {}).note || '';
  const m = {};
  String(note).split('∥').forEach(part=>{
    const [sid, d] = String(part).trim().split(':');
    const n = Number(d);
    if(sid && n >= 1 && n <= 31) m[sid] = n;
  });
  return m;
}
function payDayOf(sid){
  const o = payOvrMap()[sid];
  if(o) return o;
  const s = byId[sid];
  return (s && s.payDay) ? Number(s.payDay) : null;
}
function setPayDay(sid, day){
  const m = payOvrMap();
  if(day) m[sid] = Number(day); else delete m[sid];
  const note = Object.keys(m).sort().map(k=> k + ':' + m[k]).join(' ∥ ');
  const k = PAYKEY.split('|');
  return setOvr(k[0], k[1], {note});
}
/* 이번 달 이 학생의 기한이 지났나 — 「보고 있는 달」 기준입니다.
   지난달을 보고 계실 땐 그 달 말일이 지났으면 지난 것으로 봅니다. */
function payDue(sid, mon){
  const d = payDayOf(sid); if(!d) return null;
  const m = mon || FEEMON;
  const last = new Date(Date.parse(m + '-01') + 32*86400000);
  const lastDay = new Date(Date.UTC(last.getUTCFullYear(), last.getUTCMonth(), 0)).getUTCDate();
  const day = Math.min(d, lastDay);          // 31일인데 2월이면 말일로
  const date = m + '-' + String(day).padStart(2, '0');
  const past = date < TODAY;
  /* 며칠 늦었나 — 기한 다음 날을 1일째로 셉니다.
     9월 6일이 기한이고 오늘이 9월 8일이면 2일입니다. */
  const late = past
    ? Math.round((Date.parse(TODAY) - Date.parse(date)) / 86400000)
    : 0;
  return {day, date, past, late, thisMon: m === TODAY.slice(0,7)};
}
/* 배지에 쓰는 말 — 「6일까지」 · 「6일까지 · 2일 늦음」 · 「6일까지 · 안 냄」
   지난달 장부를 열어 보실 때는 날수를 세지 않습니다. 250일 늦음은 말이 안 됩니다. */
function payDueText(du, paid){
  if(!du) return '';
  const base = du.day + '일까지';
  if(!du.past || paid) return base;
  return base + ' · ' + (du.thisMon ? du.late + '일 늦음' : '안 냄');
}
/* 보고 계신 달 기준으로, 기한이 지났는데 입금 표시가 없는 학생 */
function feeOverdue(){
  return ACTIVE.filter(s=>{
    const du = payDue(s.id); if(!du || !du.past) return false;
    return !feeState(feeOf(s.name)).paid;
  }).sort((a,b)=> payDue(b.id).late - payDue(a.id).late   // 오래 늦은 사람부터
                || a.name.localeCompare(b.name));
}
/* ═══════════════════════ 수업료 안내 문자 ═══════════════════════
   눌러서 복사 → 카톡에 붙여넣기. 문구는 운영 화면에서 고치실 수 있습니다.
   빈칸: {이름} {학년} {달} {금액} {납부일} {계좌} */
const SMSKEY = '문자틀|1900-01-04';
const SMS_DEF = {
  /* 재원생은 금액도 계좌도 이미 압니다 — 넣지 않습니다 (원장님 결정 2026-09-02) */
  before:
`안녕하세요, 더올림수학입니다.
{이름} 학생 {달}월 원비 안내드립니다.

납부일은 {납부일}입니다.
{추가}
늘 믿고 맡겨 주셔서 감사합니다.`,
  late:
`안녕하세요, 더올림수학입니다.
{이름} 학생 {달}월 원비 안내드립니다.

{납부일}에 원비 관련 문자를 보내드렸어야 했는데,
늦어져서 죄송합니다.
불편을 드린 점 너그럽게 양해 부탁드립니다.
{추가}
확인 부탁드립니다. 감사합니다.`,
  /* 신규생에게만 덧붙이는 두 줄 — 스위치를 켠 학생 문자 끝에 붙습니다 */
  extra:
`· 금액 : {금액}
· 입금 : {계좌}`,
  acct: '',
};
function smsTpl(){
  let o = {};
  try{ o = JSON.parse((OVR[SMSKEY] || {}).note || '{}'); }catch(e){ o = {}; }
  return {before: o.before || SMS_DEF.before, late: o.late || SMS_DEF.late,
          extra: o.extra || SMS_DEF.extra,
          acct: o.acct != null ? o.acct : SMS_DEF.acct};
}
function smsTplSave(o){
  const k = SMSKEY.split('|');
  return setOvr(k[0], k[1], {note: JSON.stringify(o)});
}
/* 계좌·금액을 붙일 학생 — 신규생만. 명단에 등록일이 적혀 있으면 자동으로 켭니다. */
const SMS_NEW_DAYS = 90;
function smsIsNew(sid){
  const s = byId[sid];
  if(!s || !s.from || !/^\d{4}-\d{2}-\d{2}$/.test(s.from)) return false;
  const age = Math.round((parseYmd(TODAY) - parseYmd(s.from)) / 86400000);
  return age <= SMS_NEW_DAYS;          // 앞으로 올 학생(음수)도 신규로 봅니다
}
window.__smsFull = window.__smsFull || {};
function smsFull(sid){
  return window.__smsFull[sid] !== undefined ? !!window.__smsFull[sid] : smsIsNew(sid);
}

/* 한 학생의 문자 한 통 — full 이면 금액·계좌 두 줄을 덧붙입니다 */
function smsFor(sid, mon, full){
  const s = byId[sid]; if(!s) return '';
  const m = mon || FEEMON;
  const t = smsTpl();
  const du = payDue(sid, m);
  const amt = feeAmount(feeOf(s.name));
  const late = !!(du && du.past && !feeState(feeOf(s.name)).paid);
  const acct = String(t.acct || '').trim();
  const add = (full === undefined ? smsFull(sid) : full)
    ? String(t.extra || '').split('\n')
        .filter(line => !(/\{계좌\}/.test(line) && !acct))   // 계좌를 안 적었으면 그 줄만 뺍니다
        .join('\n').trim()
    : '';
  /* {추가} 자리에 끼웁니다. 그 빈칸이 없는 문구(원장님이 직접 쓰신 것)면 맨 뒤에 붙입니다. */
  let body = late ? t.late : t.before;
  if(/\{추가\}/.test(body)) body = body.replace(/\{추가\}/g, add ? '\n' + add + '\n' : '');
  else if(add) body = body + '\n\n' + add;
  return body
    .replace(/\{이름\}/g, s.name)
    .replace(/\{학년\}/g, s.grade || '')
    .replace(/\{달\}/g, String(Number(m.slice(5))))
    .replace(/\{금액\}/g, amt ? won(amt) + '원' : '(금액 미기재)')
    .replace(/\{납부일\}/g, du ? `${Number(m.slice(5))}월 ${du.day}일` : '(납부일 미정)')
    .replace(/\{계좌\}/g, acct)
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
/* 복사 — 안 되는 폰에서는 글자를 띄워 길게 눌러 복사하게 합니다 */
function copyText(txt, okMsg){

    const ta = document.createElement('textarea');

async function feeAct(kind, sid){
  const s = byId[sid]; if(!s) return;
  if(kind === 'payday'){
    const el = document.getElementById('payDayIn');
    const v = el ? Number(el.value) : 0;
    if(el && el.value !== '' && !(v >= 1 && v <= 31)) return toast('1에서 31 사이로 적어 주세요');
    const r = await setPayDay(sid, el && el.value === '' ? 0 : v);
    toast(!(r && r.ok) ? '인터넷이 없어 이 기기에만 저장했습니다'
          : v ? `${s.name} · 매월 ${v}일` : `${s.name} · 납부일 지움`);
    render(); return openFeeEdit(sid);
  }
  let txt = feeOf(s.name);
  const parts = txt ? txt.split('·').map(x=>x.trim()).filter(Boolean) : [];
  const drop = re => { for(let i=parts.length-1;i>=0;i--) if(re.test(parts[i])) parts.splice(i,1); };
  if(kind==='paid'){
    const el = document.getElementById('feePaidD');
    const v = el && /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : TODAY;
    drop(/입금/); parts.push(`입금 ${fmtD(v)}`); drop(/미납/);
  }
  if(kind==='paidOff'){ drop(/입금/); }
  if(kind==='rcpt'){ feeState(txt).rcpt ? drop(/영수증/) : parts.push('영수증 ✓'); }
  if(kind==='unpaid'){ feeState(txt).unpaid ? drop(/미납/) : parts.push('미납'); }
  if(kind==='amt'){
    const el = document.getElementById('feeAmt');
    const v = Math.max(0, Math.round(Number(el ? el.value : 0) || 0));
    const r0 = await feeSave(s.name, feeWithAmount(txt, v));
    toast(r0 && r0.ok ? (v ? `${won(v)}원으로 저장했습니다` : '금액을 지웠습니다') : '이 기기에 저장했습니다');
    openFeeEdit(sid); viewFee(); return;
  }
  if(kind==='memo'){
    const v = prompt(`${s.name} — ${FEEMON.slice(5)}월 수업료 기록 (전체를 직접 고칩니다)`, txt);
    if(v === null) return;
    const r = await feeSave(s.name, v.trim());
    toast(r && r.ok ? '노션에 저장했습니다' : '이 기기에 저장했습니다');
    $('#sheet').classList.remove('on'); viewFee(); return;
  }
  const r = await feeSave(s.name, parts.join(' · '));
  toast(r && r.ok ? '노션에 저장했습니다' : '이 기기에 저장했습니다');
  openFeeEdit(sid); viewFee();
}

    String(pa).split('∥').forEach(part=>{
      const d0 = decodeProgUnit(part.trim(), od);
      if(d0 && d0.sem === sem) (od <= TODAY ? slot2(d0.unit).past : slot2(d0.unit).future).push(od);
    });
  });
  Object.values(map).forEach(v=>{
    v.past = [...new Set(v.past)].sort();
    v.future = [...new Set(v.future)].sort();
  });
  return map;
}

async function planRemoveUnit(date, enc){
  const s = byId[PLANSID]; if(!s || !enc || !date) return;
  const cur = (ovrOf(s.id, date)||{}).progAcademy || '';
  const parts = String(cur).split('∥').map(x=>x.trim()).filter(Boolean).filter(x=>x!==enc);
  const r = await setOvr(s.id, date, {progAcademy: parts.join(' ∥ ')});
  delete CFALL[date];
  const d0 = decodeProgUnit(enc);
  toast(`${fmtD(date)} 계획에서 「${d0?d0.unit:''}」를 뺐습니다${r&&r.ok?' — 노션 반영':''}`);
  viewPlan();
}
async function planAddUnit(enc){
  if(!enc) return toast('이 단원은 목록 코드가 없어 추가할 수 없습니다');
  const s = byId[PLANSID]; if(!s) return;
  const target = planNextClassDate(s);
  if(!target) return toast('이 학생의 다음 수업일을 찾지 못했습니다 — 시간표를 확인해 주세요');
  const cur = (ovrOf(s.id, target)||{}).progAcademy || '';
  const parts = cur ? String(cur).split('∥').map(x=>x.trim()).filter(Boolean) : [];
  if(parts.includes(enc)) return toast('이미 그 날짜 계획에 있습니다');
  parts.push(enc);
  const r = await setOvr(s.id, target, {progAcademy: parts.join(' ∥ ')});
  delete CFALL[target];    // 한 번에 확인이 새로 읽게
  const d0 = decodeProgUnit(enc);
  toast(`${fmtD(target)} 계획에 「${d0?d0.unit:''}」 추가${r&&r.ok?' — 노션 저장됨':' (이 기기에 저장)'}`);
  viewPlan();
}

/* ═══════════════════════ 한 번에 확인 + 하루 한 장 (3a단계) ═══════════════════════
   수업 중에는 종이가 1차 도구, 저녁에 여기서 다른 것만 고쳐 확정한다.
   저장하면 수업 단원은 「학원 진도」(진도 고치기와 같은 자리), 숙제는 「내준 숙제」로 노션에 기록. */
let CF = null;      // 보고 있는 날짜의 편집 상태 (CFALL[CFDATE]의 별칭)
let CFDATE = null;  // 보고 있는 수업일
const CFALL = {};   // 날짜별 편집 상태 — 날짜를 오가도 만지던 내용이 유지된다
function cfDates(){
  // 수업일 기준 3일: [지난 수업일] + [오늘(수업 있으면)과 다음 수업일들]
  const out = [];
  let d = addDays(TODAY, -1);
  for(let i=0; i<21; i++){                       // 직전 수업일 하나
    if(scheduledOn(d).length){ out.push(d); break; }
    d = addDays(d, -1);
  }
  d = TODAY;
  for(let i=0; i<21 && out.length<3; i++){       // 오늘부터 수업일 두 개
    if(scheduledOn(d).length) out.push(d);
    d = addDays(d, 1);
  }
  return out.length ? out : [TODAY];
}
function cfPrevHw(s, date){
  const prev = (BY_STU[s.id]||[]).find(x=>x.date < date &&
    (x.dismissal?.nextHw?.length || x.cls?.nextHw?.length || x.dismissal?.nextHwItems || x.dismissal?.nextHwRange));
  if(!prev) return '';
  const dm = prev.dismissal || prev.cls;
  const parts=[];
  const nh=(dm.nextHw||[]).filter(x=>x && x!=='숙제없음');
  if(nh.length) parts.push(nh.join(' · '));
  if(dm.nextHwItems) parts.push(dm.nextHwItems+'문항');
  if(dm.nextHwRange) parts.push(dm.nextHwRange);
  return parts.join(' · ');
}
function cfInit(date){
  // 기본 날짜: 오늘 수업이 있으면 오늘, 없으면 다음 수업일 (지난 수업일은 칩으로만)
  const ds = cfDates();
  CFDATE = date || CFDATE || ds.find(d=>d>=TODAY) || ds[ds.length-1];
  if(!CFALL[CFDATE]){
    const st = CFALL[CFDATE] = {};
    scheduledOn(CFDATE).forEach(s=>{
      const ovr = ovrOf(s.id, CFDATE) || {};
      const units = [];                          // 단원은 여러 개 — 평가날엔 시험 범위 전체
      if(ovr.progAcademy){                       // 이미 이 날짜로 저장해 둔 것이 있으면 그것부터 (∥ 로 여러 개)
        String(ovr.progAcademy).split('∥').forEach(part=>{
          const d0 = decodeProgUnit(part.trim());
          if(d0) units.push({enc: part.trim(), label: d0.unit, on: true});
        });
      }
      if(!units.length){
        const p = progOf(s.id);
        if(p && p.academy){
          const idx = (((D && D.curriculum) || {})[p.academy.sem]||[]).indexOf(p.academy.unit);
          units.push({enc: idx>=0 ? (encodeProgUnit(p.academy.sem, idx)||'') : '', label: p.academy.unit, on: true});
        }
      }
      // 숙제 미리 채우기 — ① 이 날짜로 저장해 둔 것 ② 그날 하원 폼에 실제로 적힌 「다음 숙제」 ③ 지난 수업에 내준 것
      let ownHw = '';
      const rOwn = REC[s.id+'|'+CFDATE];
      const dmOwn = rOwn && (rOwn.dismissal || rOwn.cls);
      if(dmOwn){
        const parts=[];
        const nh=(dmOwn.nextHw||[]).filter(x=>x && x!=='숙제없음');
        if(nh.length) parts.push(nh.join(' · '));
        if(dmOwn.nextHwItems) parts.push(dmOwn.nextHwItems+'문항');
        if(dmOwn.nextHwRange) parts.push(dmOwn.nextHwRange);
        ownHw = parts.join(' · ');
      }
      const hw = ovr.nextHw || ownHw || cfPrevHw(s, CFDATE);
      st[s.id] = {units, hw, hwOn:!!hw};
    });
  }
  CF = CFALL[CFDATE];
}
/* 그 학생의 켜진 단원들에 딸린 「단원 기준」 모으기 — 오늘 체크에 쓴다 */
/* 기준 한 줄 그리기 — 「항목 → 들어야 하는 답」 형식이면 답을 초록으로 나란히 */
function stdLineHtml(l){
  const cut = l.indexOf('→');
  if(cut < 0) return `<div class="cfStdL">${esc(l)}</div>`;
  return `<div class="cfStdL">${esc(l.slice(0,cut).trim())}
    <span class="stdAns">→ ${esc(l.slice(cut+1).trim())}</span></div>`;
}
function cfStdFor(c){
  const out = [];
  (c.units||[]).filter(u=>u.on && u.enc).forEach(u=>{
    const d0 = decodeProgUnit(u.enc); if(!d0) return;
    const idx = (((D && D.curriculum)||{})[d0.sem]||[]).indexOf(d0.unit); if(idx < 0) return;
    const lines = stdOf(d0.sem, idx);
    if(lines.length) out.push({enc:u.enc, sem:d0.sem, unit:d0.unit, lines});
  });
  return out;
}

    let good = true;
    // 오늘(또는 지난 날) 저장 = 실제 기록 → 진도 스냅샷(PROGDATE)에는 가장 멀리 나간 단원 하나
    // 여러 단원(평가 범위 등)은 그 날짜 칸에 ∥ 로 이어서 전부 기록
    // 미래 날짜 저장 = 계획 → 그 날짜 칸에만, 진도는 건드리지 않는다
    if(!j.units.length){
      const saved = (ovrOf(j.s.id, CFDATE)||{}).progAcademy;
      if(saved){
        const r = await setOvr(j.s.id, CFDATE, {progAcademy: ''});   // 그 날짜 단원 기록 지우기
        if(!(r && r.ok)) good = false;
      }
    }
    if(j.units.length){
      const joined = j.units.map(u=>u.enc).join(' ∥ ');
      if(future){
        const r = await setOvr(j.s.id, CFDATE, {progAcademy: joined});
        if(!(r && r.ok)) good = false;
      } else {
        const top = j.units.reduce((a,b)=>
          ((decodeProgUnit(b.enc)||{}).g||0) > ((decodeProgUnit(a.enc)||{}).g||0) ? b : a);
        const r1 = await setOvr(j.s.id, PROGDATE, {progAcademy: top.enc});
        if(!(r1 && r1.ok)) good = false;
        if(j.units.length > 1){
          const r2 = await setOvr(j.s.id, CFDATE, {progAcademy: joined});
          if(!(r2 && r2.ok)) good = false;
        }
      }
    }
    if(j.hw){
      const r = await setOvr(j.s.id, CFDATE, {nextHw: j.hw});
      if(!(r && r.ok)) good = false;
    }
    if(good) ok++; else fail++;
  }
  toast(fail ? `노션 저장 ${ok}명 · 실패 ${fail}명 — 실패분도 이 기기에는 남아 있습니다`
             : (future ? `${ok}명 계획 저장 완료 — ${fmtD(CFDATE)}에 미리 채워져 나옵니다` : `${ok}명 저장 완료`));
  render();
}

function wgRisk(){
  const rows=[];
  ACTIVE.forEach(s=>{
    const why=[];
    const hs=hwStats(s.id); if(hs.streak>=CFG.streak) why.push(`숙제 연속 ✕ ${hs.streak}회`);

function wgHwFlow(){
  // 학생별 최근 수업일 8칸 — 색 줄로 숙제 흐름을 본다. 빨강이 이어지면 밀리는 중.
  const rows = ACTIVE.map(s=>{
    const cells = [];
    let d = TODAY, cnt = 0, guard = 0;
    while(cnt < 8 && guard < 45){
      if(slotFor(s, d)){
        const r = REC[s.id+'|'+d];
        const h = r ? hwOf(r) : null;
        let k = 'none';
        if(h){
          if(h.code === 'no_hw') k = 'nohw';
          else if(h.ok && !h.wrong) k = 'good';
          else if(h.ok && h.wrong) k = 'wrong';
          else if(h.code === 'half' || h.code === 'partial' || h.code === 'little') k = 'part';
          else k = 'bad';
        } else if(d <= TODAY && !r) k = 'none';
        cells.unshift({d, k});
        cnt++;
      }
      d = addDays(d, -1); guard++;
    }
    const st = hwStats(s.id, addDays(TODAY,-30), TODAY);
    return {s, cells, streak: st.streak};
  }).filter(x=>x.cells.some(c=>c.k !== 'none'));
  rows.sort((a,b)=> b.streak - a.streak || a.s.name.localeCompare(b.s.name));
  const KLAB = {good:'완료', wrong:'오답 남음', part:'일부만', bad:'못 함', nohw:'숙제 없음', none:'기록 없음'};
  let b = `<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px">
    <span><i class="hc hcg"></i> 완료</span><span><i class="hc hcw"></i> 오답 남음</span>
    <span><i class="hc hcp"></i> 일부만</span><span><i class="hc hcb"></i> 못 함</span>
    <span><i class="hc hcn"></i> 없음·기록 없음</span></div>`;
  if(!rows.length) b += `<div class="empty">아직 볼 기록이 없습니다.</div>`;
  rows.forEach(x=>{
    b += `<button class="row" data-stu="${x.s.id}" style="align-items:center">
      <span class="grow" style="min-width:0">
        <span class="nm" style="font-size:13.5px">${esc(x.s.name)}
          <span style="font-weight:400;color:var(--muted);font-size:11.5px">${esc(x.s.grade)}</span>
          ${x.streak>=CFG.streak? badge('crit', '연속 ✕ '+x.streak) : ''}</span>
        <span style="display:flex;gap:3px;margin-top:5px">${x.cells.map(c=>
          `<i class="hc hc${c.k==='good'?'g':c.k==='wrong'?'w':c.k==='part'?'p':c.k==='bad'?'b':'n'}"
             title="${fmtD(c.d)} ${KLAB[c.k]}"></i>`).join('')}</span>
      </span><span class="right">›</span></button>`;
  });
  return {n:'', sub:'왼쪽이 과거, 오른쪽이 최근 — 학생별 최근 수업일 8칸 · 밀리는 학생이 위로', body:b};
}

        if(j && !j.error && j.students && j.students.length){
          if(pin) savedPinPut(pin);
          cachePut(j);
          var n = j.meta && j.meta.notion;
          var noPin = j.meta && j.meta.pin === 'off';
          say(n === 'ok'
                ? (noPin ? '잠금이 아직 없습니다 — Vercel 환경변수에 APP_PIN 을 넣어 주세요' : '')
                : (n === 'no_token'
                    ? '탈리는 연결됐고, 수정 기록은 아직 이 기기에만 저장됩니다'
                    : '탈리는 연결됐고, 노션 저장은 실패했습니다'),
              n === 'ok' && !noPin);
          launch(j, 'tally');
        } else if(j && j.overrides){        // 탈리는 안 되지만 노션 수정본은 살릴 수 있다
          var c = cacheGet();
          if(c){ c.overrides = j.overrides; c.meta = Object.assign({}, c.meta, j.meta); }
          say(j.error === 'no_key' ? '탈리 키가 아직 없어 저장된 기록으로 엽니다'
                                   : '탈리에 연결하지 못해 저장된 기록으로 엽니다', false);
          launch(c, 'cache');
        } else {
          say(j && j.error === 'no_key' ? '탈리 키가 아직 없어 저장된 기록으로 엽니다'
                                        : '탈리에 연결하지 못해 저장된 기록으로 엽니다', false);
          launch(cacheGet(), 'cache');
        }
      })
      .catch(function(){
        if(done) return; done = true; clearTimeout(t);
        say('연결하지 못해 이 기기에 저장된 기록으로 엽니다', false); launch(cacheGet(), 'cache');
      });
  }
  fetchData(savedPinGet());
  /* 홈 화면 아이콘·manifest 는 실제 파일(/manifest.json, /icon-*.png)을 씁니다 */
})();
</script>
</body>
</html>
