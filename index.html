    when:'이미 일어난 일이 조건으로 주어질 때', caution:'중2 「확률」에서는 분모가 늘 전체였다 — 분모가 바뀐다는 것이 새로 배우는 전부 / P(A) > 0 일 때만 정의된다', example:'P(B|A) = P(A∩B) ÷ P(A)\n두 아이 중 적어도 한 명이 아들일 때\n둘 다 아들일 확률\n= (1/4) ÷ (3/4) = 1/3'},

  {g:'확률과 통계', u:'통계', f:'확률변수와 확률분포', def:'확률변수: 시행 결과에 따라 값이 정해지는 변수 / 확률분포: 그 값과 확률의 대응 관계', props:['이산확률변수: 값을 셀 수 있다(주사위 눈 등)','연속확률변수: 구간 안의 모든 값을 가진다(키, 몸무게 등)','확률의 총합은 항상 1']},
  {g:'확률과 통계', u:'통계', f:'이산확률변수의 평균·분산', b:'E(X) = Σ xᵢpᵢ\nV(X) = E(X²) - {E(X)}²\nσ(X) = √V(X)',
    when:'확률분포표가 주어졌을 때 기댓값과 흩어진 정도를 구할 때', caution:'분산은 제곱의 평균 - 평균의 제곱 (순서를 바꾸지 않기)', example:'E(X)=2, E(X²)=6 → V(X)=2'},
  {g:'확률과 통계', u:'통계', f:'확률변수 aX + b', b:'E(aX+b) = aE(X) + b\nV(aX+b) = a²V(X)\nσ(aX+b) = |a| σ(X)',
    when:'확률변수를 상수배하거나 더했을 때의 평균·분산', caution:'분산에는 b가 영향을 주지 않고, a는 제곱으로 붙는다', example:'E(X)=3,V(X)=2 → E(2X+1)=7, V(2X+1)=8'},
  {g:'확률과 통계', u:'통계', f:'이항분포', b:'B(n, p) 를 따를 때\nE(X) = np\nV(X) = npq   (q = 1-p)\nσ(X) = √(npq)',
    when:'독립시행을 n번 반복한 성공 횟수의 평균·분산을 구할 때', caution:'q = 1-p 를 빠뜨리지 않기', example:'주사위 60번, 1의 눈 → E=10, V=25/3'},
  {g:'확률과 통계', u:'통계', f:'정규분포', def:'평균 m, 표준편차 σ 인 종 모양의 좌우대칭 연속확률분포, N(m, σ²)', shape:'normalCurve', props:['x = m 에 대하여 좌우대칭이고 곡선 아래 넓이의 합은 1','σ가 클수록 곡선이 낮고 옆으로 퍼진다','n이 충분히 크면 이항분포는 정규분포에 가까워진다']},
  {g:'확률과 통계', u:'통계', f:'정규분포의 표준화', b:'Z = (X - m) / σ\nZ는 표준정규분포 N(0, 1)을 따른다', shape:'normalCurve',
    when:'정규분포를 표준정규분포로 바꿔 표를 이용할 때', caution:'평균을 빼고 표준편차로 나누는 순서 지키기', example:'m=50,σ=10,X=65 → Z=1.5'},
  {g:'확률과 통계', u:'통계', f:'표본평균의 분포', b:'모평균 m, 모표준편차 σ 인 모집단에서\n크기 n인 표본을 뽑을 때\nE(X̄) = m,  V(X̄) = σ²/n,  σ(X̄) = σ/√n',
    when:'표본평균이 어떻게 흩어지는지 다룰 때', caution:'표본의 크기 n이 커질수록 표본평균은 모평균 가까이 모인다', example:'σ=10, n=25 → σ(X̄)=2'},
  {g:'확률과 통계', u:'통계', f:'모평균의 신뢰구간', b:'모집단이 정규분포를 따르고 σ를 알 때\n표본평균 x̄ 에 대하여\n95%: x̄ - 1.96·σ/√n ≤ m ≤ x̄ + 1.96·σ/√n\n99%는 1.96 대신 2.58',
    when:'표본으로 모평균의 범위를 추정할 때', caution:'n이 충분히 크면 모집단이 정규분포가 아니어도 쓸 수 있다 / 신뢰도를 높이거나 n을 줄이면 구간이 길어진다', example:'구간의 길이 = 2 × 1.96 × σ/√n'},
  {g:'확률과 통계', u:'통계', f:'통계 + 함수', pair:1, b:'주인공 — 정규분포\n도구 — 표준화\n어떤 정규분포든\nZ = (X - m) ÷ σ 로 바꿔 표를 쓴다',
    when:'평균과 표준편차가 다른 정규분포의 확률을 구할 때', caution:'중3 「표준편차로 비교하기」의 최종 확장 — 단위가 다른 것을 같은 자로 재는 일이다', example:'X ~ N(50, 10²) 일 때 P(X ≤ 60)\nZ = (60-50) ÷ 10 = 1\n→ P(Z ≤ 1)'},

  /* ═══ 미적분Ⅱ — 수열의 극한과 급수, 여러 함수의 미분, 적분법 ═══ */
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'수열의 수렴과 발산', def:'n이 한없이 커질 때 aₙ이 일정한 값 α에 가까워지면 수렴(lim[n→∞] aₙ = α), 그렇지 않으면 발산', props:['수렴할 때 가까워지는 값 α를 극한값이라 한다','발산은 양의 무한대·음의 무한대·진동으로 나뉜다']},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'등비수열의 극한', b:'lim rⁿ 은\n-1 < r < 1 → 0 (수렴)\nr = 1 → 1 (수렴)\nr > 1 → 발산,  r ≤ -1 → 진동(발산)',
    when:'rⁿ 이 들어간 수열의 극한을 판정할 때', caution:'수렴 조건은 -1 < r ≤ 1 — 오른쪽만 등호가 붙는다', example:'lim (1/2)ⁿ = 0'},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'급수의 수렴 조건', b:'급수 Σaₙ 이 수렴하면 lim aₙ = 0\n(역은 성립하지 않는다)',
    when:'급수가 발산함을 보일 때', caution:'lim aₙ = 0 이라고 급수가 수렴하는 것은 아니다 (조화급수 Σ1/n 은 발산)', example:'lim aₙ = 2 ≠ 0 → 급수는 발산'},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'등비급수의 합', b:'a + ar + ar² + … = a / (1-r)\n(단, a ≠ 0 이고 |r| < 1)',
    when:'무한히 더해지는 등비수열의 합(수렴할 때)을 구할 때', caution:'|r|<1일 때만 수렴해서 합이 존재한다', example:'1+1/2+1/4+... → 2'},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'수열 + 도형', pair:1, b:'주인공 — 등비급수\n도구 — 닮음\n도형을 반복해 줄이면\n길이·넓이가 등비수열이 된다',
    when:'같은 조작을 무한히 반복하는 도형 문제', caution:'한 단계에서 몇 배가 되는지(공비)를 먼저 찾는다 — 넓이는 닮음비의 제곱이다', example:'한 변 1인 정삼각형에서\n각 변의 중점을 이어 새 삼각형을 반복\n넓이가 매번 1/4배 → 등비급수'},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'극한 + 도형', pair:1, b:'주인공 — 극한\n도구 — 도형\n정n각형에서 n을 무한히 키우면\n원이 된다',
    when:'원의 넓이나 둘레가 왜 그런지 되짚을 때', caution:'초등에서 외운 「원의 넓이 = πr²」를 고3에서 증명하는 자리다', example:'반지름 r인 원에 내접하는 정n각형\n넓이 = ½ n r² sin(2π/n)\nn → ∞ 이면 πr²'},
  {g:'미적분Ⅱ', u:'수열의 극한과 급수', f:'급수 + 확률', pair:1, b:'주인공 — 확률\n도구 — 등비급수\n일어날 수 있는 모든 경우의\n확률을 다 더하면 1',
    when:'반복 시행에서 처음 성공할 때까지를 다룰 때', caution:'등비급수의 합이 확률의 총합 1로 확인되는 자리 — 두 단원이 서로를 검산한다 / 공비가 1-p 이므로 0 < p < 1 이어야 한다', example:'n번째에 처음 성공할 확률 = p(1-p)ⁿ⁻¹\n다 더하면 p ÷ {1-(1-p)} = 1'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'무리수 e', b:'lim[n→∞] (1 + 1/n)ⁿ = e\nlim[x→0] (1 + x)^(1/x) = e\ne ≒ 2.718',
    when:'지수·로그의 극한에서 e가 나오는 꼴을 정리할 때', caution:'괄호 안의 항과 지수가 서로 역수 관계인지 확인', example:'lim (1+2/n)ⁿ = e²'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'지수·로그함수의 극한', b:'lim[x→0] (eˣ - 1)/x = 1\nlim[x→0] ln(1+x)/x = 1\nlim[x→0] (aˣ - 1)/x = ln a',
    when:'0/0 꼴의 지수·로그 극한을 계산할 때', caution:'분자와 분모의 x 자리를 같게 맞춰야 공식을 쓸 수 있다', example:'lim (e^(3x)-1)/x = 3'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'삼각함수의 극한', b:'lim[x→0] (sin x)/x = 1\nlim[x→0] (tan x)/x = 1\n(x는 라디안)',
    when:'0/0 꼴의 삼각함수 극한을 계산할 때', caution:'각이 반드시 라디안이어야 한다', example:'lim (sin 3x)/x = 3'},

  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'합성함수', def:'두 함수를 이어 붙여 만든 새 함수, (f∘g)(x) = f(g(x))', props:['g(x)의 치역이 f의 정의역에 포함되어야 한다']},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'합성함수의 미분 (연쇄법칙)', b:'{f(g(x))}′ = f′(g(x)) · g′(x)',
    when:'함수 안에 함수가 들어있는 합성함수를 미분할 때', caution:'바깥쪽 미분 × 안쪽 미분, 순서대로 곱한다', example:'(x²+1)³ → 3(x²+1)²×2x'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'곱·몫의 미분법', b:'(fg)′ = f′g + fg′\n(f/g)′ = (f′g - fg′) / g²',
    when:'두 함수의 곱이나 나눗셈 형태를 미분할 때', caution:'몫의 미분은 분자의 순서가 바뀌면 부호가 달라진다', example:'(x²sinx)′ → 2xsinx+x²cosx'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'지수·로그함수의 미분', b:'(eˣ)′ = eˣ,  (aˣ)′ = aˣ ln a\n(ln x)′ = 1/x,  (logₐx)′ = 1/(x ln a)',
    when:'eˣ이나 ln x가 포함된 함수를 미분할 때', caution:'eˣ은 미분해도 그대로, 일반 aˣ은 ln a 가 붙는다', example:'y=e^(2x) → y′=2e^(2x)'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'삼각함수의 미분', b:'(sin x)′ = cos x\n(cos x)′ = -sin x\n(tan x)′ = sec²x = 1/cos²x',
    when:'sin,cos,tan이 포함된 함수를 미분할 때', caution:'cos을 미분하면 -sin (부호 주의)', example:'y=sinx+cosx → y′=cosx-sinx'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'역함수의 미분법', b:'f가 미분가능하고 b = f(a),  f′(a) ≠ 0 일 때\n(f⁻¹)′(b) = 1 / f′(a)',
    when:'역함수를 직접 구하지 않고 그 미분계수를 구할 때', caution:'f′(a)=0 이면 쓸 수 없다 / 대입하는 점이 서로 다르다 — 역함수의 b에 대응하는 원함수의 a를 먼저 찾는다', example:'f(1)=3, f′(1)=2 → (f⁻¹)′(3)=1/2'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'음함수·매개변수 미분법', b:'음함수: 양변을 x로 미분하고 dy/dx 에 대해 푼다\n매개변수: dy/dx = (dy/dt) / (dx/dt)\n(단, dx/dt ≠ 0)',
    when:'y = f(x) 꼴로 정리되지 않는 관계식을 미분할 때', caution:'y를 미분할 때마다 dy/dx 를 곱해야 한다(연쇄법칙)', example:'x²+y²=1 → 2x+2y(dy/dx)=0'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'이계도함수와 변곡점', b:'f″(x) > 0 → 아래로 볼록\nf″(x) < 0 → 위로 볼록\nf″(x) = 0 이고 부호가 바뀌는 점 → 변곡점',
    when:'그래프의 볼록한 방향과 휘는 지점을 찾을 때', caution:'f″(x)=0 이라도 부호가 바뀌지 않으면 변곡점이 아니다', example:'y=x³ → f″(0)=0, x=0이 변곡점'},
  {g:'미적분Ⅱ', u:'여러 함수의 미분', f:'미분 + 부등식 증명', pair:1, b:'주인공 — 부등식\n도구 — 미분\n차를 함수로 놓고\n최솟값이 0 이상임을 보인다',
    when:'부등식을 증명하라는 문제를 만났을 때', caution:'증명을 어떻게 시작할지 막막할 때 문을 열어주는 카드 — 일단 (좌변 - 우변)을 f(x)로 놓는다', example:'x > 0 에서 x ≥ ln x + 1\nf(x) = x - ln x - 1\nf′(x) = 1 - 1/x = 0 → x = 1\n최솟값 f(1) = 0'},

  {g:'미적분Ⅱ', u:'적분법', f:'여러 가지 함수의 부정적분', b:'∫(1/x)dx = ln|x| + C\n∫eˣdx = eˣ + C,  ∫aˣdx = aˣ/ln a + C\n∫sin x dx = -cos x + C\n∫cos x dx = sin x + C\n∫sec²x dx = tan x + C',
    when:'기본 함수들의 부정적분이 필요할 때', caution:'1/x 의 적분에는 절댓값을 붙인다 / sin의 적분에 - 가 붙는다', example:'∫(2/x)dx = 2ln|x| + C'},
  {g:'미적분Ⅱ', u:'적분법', f:'치환적분법', b:'x = g(t)로 치환하면\n∫f(x)dx = ∫f(g(t))g′(t)dt\n∫ f′(x)/f(x) dx = ln|f(x)| + C',
    when:'식이 복잡해서 문자를 바꾸면 적분이 쉬워질 때', caution:'dx도 반드시 dt로 함께 바꿔야 한다 / 정적분이면 적분 구간도 바꾼다', example:'∫2x(x²+1)dx, t=x²+1로 치환'},
  {g:'미적분Ⅱ', u:'적분법', f:'부분적분법', b:'∫f′g dx = fg - ∫fg′ dx',
    when:'두 함수의 곱을 적분할 때(치환이 안 될 때)', caution:'미분하면 간단해지는 쪽을 g로 둔다 (로그 → 다항 → 삼각 → 지수 순)', example:'∫x·eˣdx = x·eˣ - eˣ + C'},

function appHref(a){
  const ua = (navigator.userAgent || '');
  if(/Android/i.test(ua) && a.pkg){
    return 'intent:#Intent;package=' + a.pkg
      + ';action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER'
      + ';S.browser_fallback_url=' + encodeURIComponent(a.store_and || a.web) + ';end';

  return a.web;
}

    }
    return out;
  };
  /* 각 표시 — 꼭짓점 V와 두 방향점으로 각을 계산해 호를 그린다 (짧은 쪽) */

/* 카드 이름에서 「섞였을 때 — 」를 뺐다. 예전 이름으로 남은 기록을 새 이름으로 옮긴다 */
(function(){

      const nk = k.replace('::섞였을 때 — ', '::');

})();

const $ = (s,el)=> (el||document).querySelector(s);
const esc = (s)=> String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 평행 기호는 한국 교과서처럼 비스듬히 보이도록 기울여 준다 (∥ → //) */
const mk = (s)=> esc(s).replace(/∥/g, '<span class="par">∥</span>');
const mkln = (s)=> mk(s).replace(/\n/g, '<br>');
/* 공식(b)의 각 줄이 카드 폭 안에 「한 줄로」 들어가도록 글씨 크기를 자동으로 맞춘다.
   캔버스로 실제 글자 폭을 재기 때문에 기기·폰트가 달라도 정확하다. */
function fitForms(){
  const probe = document.querySelector('.fcBack');
  if(!probe) return;
  const cs = getComputedStyle(probe);
  const avail = probe.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  if(!(avail > 0)) return;
  const ctx = fitForms._ctx || (fitForms._ctx = document.createElement('canvas').getContext('2d'));
  const fam = cs.fontFamily;
  document.querySelectorAll('.fc').forEach(fc=>{
    const el = fc.querySelector('.fcBack .form');
    if(!el) return;
    const card = CARDS[+fc.dataset.ci];
    if(!card || card.b === undefined) return;
    const lines = String(card.b).split('\n');
    let size = 19;
    while(size > 11.5){
      ctx.font = '800 ' + size + 'px ' + fam;
      let ok = true;
      for(const line of lines){ if(ctx.measureText(line).width > avail){ ok = false; break; } }
      if(ok) break;
      size -= 0.5;
    }
    el.style.fontSize = size + 'px';
  });
}

function shuffleCopy(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ═══ 오늘 5장 ═══
   하루에 다섯 장. 헷갈린 카드 → 아직 안 본 카드 → 이미 아는 카드 순으로 고르고,
   그날 하루는 같은 다섯 장이 그대로 나온다(날짜로 섞어서 고정). */
const dayKey = ()=>{ const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function hash32(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function pickToday(){
  const scope = cardGrade + (cardGrade==='고등' ? '/' + hsSubject : '/' + cardTerm);
  const store = 'deolrim.links.today.' + dayKey() + '.' + scope;
  const pool = CARDS.filter(c=> inGrade(c, cardGrade)
    && (cardTerm === '전체' || termOf(c) === cardTerm)
    && (cardGrade!=='고등' || hsSubject==='전체' || c.g===hsSubject) && !c.adv);
  if(!pool.length) return [];
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(store) || 'null'); }catch(e){}
  if(Array.isArray(saved) && saved.length){
    const byKey = new Map(pool.map(c=>[cardKey(c), c]));
    const got = saved.map(k=>byKey.get(k)).filter(Boolean);
    if(got.length) return got;
  }
  const seed = hash32(store);
  const rank = (c)=>{ const m = progress[cardKey(c)];
    return m==='unsure' ? 0 : (m ? 2 : 1); };
  const arr = pool.map(c=>({ c, r:rank(c), j:hash32(cardKey(c) + '#' + seed) }));
  arr.sort((x,y)=> x.r - y.r || x.j - y.j);
  const out = arr.slice(0, 5).map(x=>x.c);
  try{ localStorage.setItem(store, JSON.stringify(out.map(cardKey))); }catch(e){}
  return out;
}
function todayHtml(){
  const picks = pickToday();
  if(!picks.length) return '';
  const done = picks.filter(c=>progress[cardKey(c)]).length;
  const dots = picks.map(c=>`<i class="${progress[cardKey(c)] ? 'on' : ''}"></i>`).join('');
  const go = todayOpen ? '접기' : (done >= picks.length ? '다시 보기' : (done ? '이어서' : '시작하기'));
  return `<section class="today${todayOpen?' open':''}">
      <button class="todayHead" id="todayToggle" aria-expanded="${todayOpen}">
        <span class="tdLab">오늘 5장</span>
        <span class="tdDots">${dots}</span>
        <span class="tdGo">${go}</span>
      </button>
      <div class="todayNote">하루에 다섯 장이면 충분합니다. 헷갈린 것부터 다시 데려옵니다.</div>
      ${todayOpen ? `<div class="todayBody">${picks.map(c=>cardHtml(c,{q:1})).join('')}</div>` : ''}
    </section>`;
}

function renderCard(){
  const grades = ['전체','초등','중1','중2','중3','고등'];
  // 「엮기」 = 자주 틀리는 짝 · 순서 카드 (pair). 정의/공식과는 성격이 달라 따로 센다.
  const matchType = (c, t)=> t==='전체' ? true
    : t==='엮기' ? !!c.pair
    : t==='정의' ? (!!c.def && !c.pair)
    : (!c.def && !c.pair);
  const byType = (c)=> matchType(c, cardType);
  const byAdv  = (c)=> showAdv || !c.adv;
  const inTerm = (c)=> cardTerm === '전체' || termOf(c) === cardTerm;
  const chips = grades.map(g=>
    `<button class="chip chipG" data-cg="${esc(g)}" aria-pressed="${g===cardGrade}">${esc(g)}</button>`).join('');
  let subChips = '';
  if(cardGrade === '고등'){
    subChips = `<div class="chips chipsSub">` + ['전체'].concat(HS_SUBJECTS).map(k=>{
        const n = CARDS.filter(c=>TIER[c.g]==='hs' && (k==='전체'||c.g===k) && byType(c) && byAdv(c)).length;
        return `<button class="chip" data-hs="${esc(k)}" aria-pressed="${k===hsSubject}">${esc(k)}<i>${n}</i></button>`;
      }).join('') + `</div>`;
  } else if(isMid(cardGrade)){
    subChips = `<div class="chips chipsSub">` + [['전체','전체'],[1,'1학기'],[2,'2학기']].map(([v,lab])=>{
        const n = CARDS.filter(c=>c.g===cardGrade && (v==='전체'||termOf(c)===v) && byType(c) && byAdv(c)).length;
        return `<button class="chip" data-tm="${esc(String(v))}" aria-pressed="${v===cardTerm}">${esc(lab)}<i>${n}</i></button>`;
      }).join('') + `</div>`;
  }
  const types = ['전체','정의','공식','엮기'];
  const tCount = (t)=> CARDS.filter(c=>inGrade(c,cardGrade) && inTerm(c)
      && (cardGrade!=='고등' || hsSubject==='전체' || c.g===hsSubject)
      && matchType(c, t) && byAdv(c)).length;
  const typeChips = types.map(t=>
    `<button class="chip${t==='엮기'?' chipPair':''}" data-ct="${esc(t)}" aria-pressed="${t===cardType}">${esc(t)}<i>${tCount(t)}</i></button>`).join('');
  const list = CARDS.filter((c)=> inGrade(c, cardGrade) && inTerm(c)
    && (cardGrade!=='고등' || hsSubject==='전체' || c.g===hsSubject)
    && byType(c) && byAdv(c));

  // 학년 → 단원 그룹 (CARDS 원본 순서를 그대로 따라가므로 같은 단원은 항상 붙어있다)
  const groups = [];
  const idxOf = new Map();
  list.forEach(c=>{
    const gk = c.g + '__' + c.u;
    if(!idxOf.has(gk)){ idxOf.set(gk, groups.length); groups.push({g:c.g, u:c.u, key:gk, cards:[]}); }
    groups[idxOf.get(gk)].cards.push(c);
  });

  const showAllGrades = cardGrade === '전체' || (cardGrade === '고등' && hsSubject === '전체');
  const unitsHtml = groups.map(gr=>{
    const core = gr.cards.filter(c=>!c.adv);
    const total = core.length;
    const known = core.filter(c=>progress[cardKey(c)]==='know').length;
    const advN = gr.cards.length - total;
    let cards = shuffleOn ? shuffleCopy(gr.cards) : gr.cards;
    if(onlyUnsure) cards = cards.filter(c=>progress[cardKey(c)]==='unsure');
    if(onlyUnsure && !cards.length) return ''; // 헷갈린 카드가 없는 단원은 숨김
    const open = openUnits.has(gr.key);
    return `<div class="unit${open?' open':''}" data-uk="${esc(gr.key)}">
      <button class="unitHead" data-utoggle="${esc(gr.key)}">
        ${showAllGrades ? `<span class="ug">${esc(gr.g)}</span>` : ''}
        <span class="un">${esc(gr.u)}</span>
        <span class="uprog${total && known>=total ? ' full' : ''}">${total ? `<span class="uBar"><span style="width:${Math.round(known/total*100)}%"></span></span>${known}/${total}` : ''}${advN ? `<span class="uadv"> 심화 ${advN}</span>` : ''}</span>
        <span class="uchev">›</span>
      </button>
      <div class="unitBody">${open ? cards.map(cardHtml).join('') : ''}</div>
    </div>`;
  }).join('');

  const onNow = [cardsShownAll?'답 모두 보임':'', shuffleOn?'순서 섞기':'', onlyUnsure?'헷갈린 것만':'',
                 showAdv?'':'심화 꺼짐', shapeFirst?'':'그림 먼저 꺼짐'].filter(Boolean).join(' · ');
  $('#main').innerHTML = `
    ${todayHtml()}
    <div class="chips">${chips}</div>
    ${subChips}
    <div class="chips chipsSub">${typeChips}</div>
    <div class="toolsBar">
      <button class="toolsBtn" id="toolsToggle" aria-expanded="${toolsOpen}">보기 설정 ${toolsOpen?'▴':'▾'}</button>
      <span class="toolsNow">${onNow ? esc(onNow) : '단원을 눌러 펼치고, 카드를 눌러 뒤집습니다'}</span>
    </div>
    ${toolsOpen ? `<div class="toolbar">
      <button id="cardToggleAll">${cardsShownAll?'전체 가리기':'전체 보기'}</button>
      <button id="cardShuffle" aria-pressed="${shuffleOn}">순서 섞기</button>
      <button id="cardOnlyUnsure" aria-pressed="${onlyUnsure}">헷갈린 것만</button>
      <button id="cardAdv" aria-pressed="${showAdv}">심화 ${showAdv?'켜짐':'꺼짐'}</button>
      <button id="cardPic" aria-pressed="${shapeFirst}">그림 먼저</button>
    </div>` : ''}
    <div class="unitList">${unitsHtml || '<div class="hint">해당하는 카드가 없어요.</div>'}</div>`;
  fitForms();
  paintHalos();
  scrollChips();
  toTopSync();
}

/* 도형 글씨의 배경색 테두리를 실제 배경색으로 칠한다.
   CSS 변수를 SVG stroke 에서 못 읽는 브라우저(갤럭시 브라우저 등)가 있어
   계산된 배경색을 직접 넣어야 어디서나 같게 보인다. */
function bgOf(el){
  let n = el;
  while(n && n !== document.documentElement){
    const c = getComputedStyle(n).backgroundColor;
    if(c && c !== 'transparent' && c.replace(/\s/g,'') !== 'rgba(0,0,0,0)') return c;
    n = n.parentElement;
  }
  return getComputedStyle(document.body).backgroundColor || '#ffffff';
}
function paintHalos(){
  document.querySelectorAll('.fcShape').forEach(box=>{
    const halos = box.querySelectorAll('text.halo');
    if(!halos.length) return;
    const bg = bgOf(box);
    halos.forEach(t=>{ t.style.stroke = bg; t.style.fill = 'none'; t.style.strokeWidth = '2.2'; });
  });
}

/* 단원 제목을 헤더 바로 아래로 끌어온다 */
function scrollToUnit(key){
  const el = Array.prototype.find.call(document.querySelectorAll('[data-uk]'), x => x.dataset.uk === key);
  if(!el) return;
  const head = document.querySelector('header');
  const pad = (head ? head.offsetHeight : 60) + 8;
  const y = el.getBoundingClientRect().top + window.pageYOffset - pad;
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}

/* 「맨 위로」 — 조금이라도 내려가면 나타난다 */
let toTopSync = ()=>{};
(function(){
  const btn = document.getElementById('toTop');
  if(!btn) return;
  toTopSync = ()=> btn.classList.toggle('on', window.pageYOffset > 400);
  window.addEventListener('scroll', toTopSync, { passive:true });
  window.addEventListener('resize', toTopSync);
  btn.addEventListener('click', ()=> window.scrollTo({ top:0, behavior:'smooth' }));
})();

/* 고른 칩이 화면 밖에 있으면 가운데로 끌어온다 */
function scrollChips(){
  document.querySelectorAll('.chips').forEach(row=>{
    const on = row.querySelector('.chip[aria-pressed="true"]');
    if(!on) return;
    row.scrollLeft = Math.max(0, on.offsetLeft - row.clientWidth/2 + on.offsetWidth/2);
  });
}

function renderOpen(){
  const html = OPENERS.map((o, i)=>{
    const st = opStage.get(i) || 0;      // 0 질문만 · 1 첫 걸음 · 2 한 걸음 더
    const done = !!thought[o.q];         // 「생각해봤어요」를 누르면 답이 열린다
    let body = '';
    if(st >= 1){
      body += `<div class="opBlock">
        <b>첫 걸음</b>
        <ol class="opSteps">${o.steps.map(x=>`<li>${mk(x)}</li>`).join('')}</ol>
        <div class="opLink">잇는 곳 · ${esc(o.link)}</div>
      </div>`;
    }
    if(st >= 2) body += `<div class="opBlock hint"><b>한 걸음 더</b><p>${mkln(o.hint)}</p></div>`;
    if(done) body += `<div class="opBlock ans"><b>확인하기</b><p class="opAns">${mk(o.ans)}</p>
        <ul class="propList">${o.why.map(x=>`<li>${mk(x)}</li>`).join('')}</ul></div>`;
    const more = st < 2
      ? `<button class="opMore" data-op="${i}">${['첫 걸음 보기 ▾','한 걸음 더 보기 ▾'][st]}</button>` : '';
    const think = done
      ? `<button class="opThink on" data-think="${i}">✅ 생각해봤어요</button>`
      : `<button class="opThink" data-think="${i}">💡 생각해봤어요<small>누르면 답이 열립니다</small></button>`;
    return `<div class="op">
      <div class="opHead"><span class="opLv">${esc(o.lv)}</span></div>
      <div class="opQ">${mkln(o.q)}</div>
      ${body}${more}${think}
    </div>`;
  }).join('');
  $('#main').innerHTML = `<div class="hint">답을 바로 보지 마세요. <b>첫 걸음</b>을 밟아보고, 막히면 <b>한 걸음 더</b>를 여세요.<br>답은 <b>「생각해봤어요」</b>를 눌러야 열립니다. 맞고 틀리는 카드가 아니라 <b>오래 머무는</b> 카드예요.</div>${html}`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB));
  $('#hdrSub').textContent = TAB==='link' ? '체크인 · 등원 · 하원' : TAB==='notice' ? '공지사항'
    : TAB==='open' ? '답이 아니라 첫 걸음' : '초·중·고 공식 암기';
  if(TAB==='link') renderLink();
  else if(TAB==='notice') renderNotice();
  else if(TAB==='open') renderOpen();
  else renderCard();
}

/* ═══════════════════════ 이벤트 ═══════════════════════ */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click', ()=>{ TAB=b.dataset.tab; render(); }));

$('#themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('deolrim.links.theme', next); }catch(e){}
});
try{
  const savedTheme = localStorage.getItem('deolrim.links.theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
}catch(e){}

document.addEventListener('click', (e)=>{
  const hdrHome = e.target.closest('#hdrHome');
  if(hdrHome){
    TAB = 'link'; linkGrade = null; render();
    window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }
  const gradeCard = e.target.closest('[data-lg]');
  if(gradeCard){ linkGrade = gradeCard.dataset.lg; renderLink(); return; }
  const linkBack = e.target.closest('#linkBack');
  if(linkBack){ linkGrade = null; renderLink(); return; }
  const chip = e.target.closest('[data-cg]');
  if(chip){
    cardGrade = chip.dataset.cg;
    if(cardGrade!=='고등') hsSubject = '전체';
    if(!isMid(cardGrade)) cardTerm = '전체';
    renderCard(); return;
  }
  const tmChip = e.target.closest('[data-tm]');
  if(tmChip){
    const v = tmChip.dataset.tm;
    cardTerm = (v === '전체') ? '전체' : Number(v);
    renderCard(); return;
  }
  const hsChip = e.target.closest('[data-hs]');
  if(hsChip){ hsSubject = hsChip.dataset.hs; renderCard(); return; }
  const typeChip = e.target.closest('[data-ct]');
  if(typeChip){ cardType = typeChip.dataset.ct; renderCard(); return; }
  const todayBtn = e.target.closest('#todayToggle');
  if(todayBtn){ todayOpen = !todayOpen; renderCard(); return; }
  const toolsBtn = e.target.closest('#toolsToggle');
  if(toolsBtn){
    toolsOpen = !toolsOpen;
    try{ localStorage.setItem('deolrim.links.tools', toolsOpen ? '1' : '0'); }catch(e){}
    renderCard(); return;
  }
  const toggleAll = e.target.closest('#cardToggleAll');
  if(toggleAll){ cardsShownAll = !cardsShownAll; if(cardsShownAll) flipped.clear(); renderCard(); return; }
  const shuffle = e.target.closest('#cardShuffle');
  if(shuffle){ shuffleOn = !shuffleOn; renderCard(); return; }
  const onlyUnsureBtn = e.target.closest('#cardOnlyUnsure');
  if(onlyUnsureBtn){ onlyUnsure = !onlyUnsure; renderCard(); return; }
  const opMore = e.target.closest('[data-op]');
  if(opMore){ const i=+opMore.dataset.op; opStage.set(i, Math.min(2,(opStage.get(i)||0)+1)); renderOpen(); return; }
  const opThink = e.target.closest('[data-think]');
  if(opThink){
    const o = OPENERS[+opThink.dataset.think];
    if(thought[o.q]) delete thought[o.q]; else thought[o.q] = 1;
    saveThought(); renderOpen(); return;
  }
  const picBtn = e.target.closest('#cardPic');
  if(picBtn){
    shapeFirst = !shapeFirst;
    try{ localStorage.setItem('deolrim.links.shapeFirst', shapeFirst ? '1' : '0'); }catch(e){}
    renderCard(); return;
  }
  const advBtn = e.target.closest('#cardAdv');
  if(advBtn){
    showAdv = !showAdv;
    try{ localStorage.setItem('deolrim.links.adv', showAdv ? '1' : '0'); }catch(e){}
    renderCard(); return;
  }
  const utoggle = e.target.closest('[data-utoggle]');
  if(utoggle){
    const key = utoggle.dataset.utoggle;
    if(openUnits.has(key)) openUnits.delete(key); else openUnits.add(key);
    renderCard();
    scrollToUnit(key);           // 접든 펼치든 그 단원 제목이 화면 위로 온다
    return;
  }
  const detailBtn = e.target.closest('[data-detail]');
  if(detailBtn){
    const idx = Number(detailBtn.dataset.detail);
    if(detailOpen.has(idx)) detailOpen.delete(idx); else detailOpen.add(idx);
    renderCard(); return;
  }
  const knowBtn = e.target.closest('[data-know]');
  if(knowBtn){
    const idx = Number(knowBtn.dataset.know);
    const key = cardKey(CARDS[idx]);
    progress[key] = progress[key]==='know' ? null : 'know';
    if(!progress[key]) delete progress[key];
    saveProgress(); renderCard(); return;
  }
  const unsureBtn = e.target.closest('[data-unsure]');
  if(unsureBtn){
    const idx = Number(unsureBtn.dataset.unsure);
    const key = cardKey(CARDS[idx]);
    progress[key] = progress[key]==='unsure' ? null : 'unsure';
    if(!progress[key]) delete progress[key];
    saveProgress(); renderCard(); return;
  }
  const fc = e.target.closest('.fc');
  if(fc && (!cardsShownAll || fc.classList.contains('tdCard'))){
    const idx = Number(fc.dataset.ci);
    if(flipped.has(idx)) flipped.delete(idx); else flipped.add(idx);
    renderCard();
  }
});

render();
fetch('/api/links', {cache:'no-store'})
  .then(r=>r.json()).then(j=>{ LINKS = (j && j.links) || []; if(TAB==='link') renderLink(); })
  .catch(()=>{ LINKS = []; if(TAB==='link') renderLink(); });
