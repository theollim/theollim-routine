  --surface:#fffdf8; --plane:#f6f3ec; --sunk:#efebe1;
  --ink:#17150f; --ink2:#514d44; --muted:#8b8579; --line:rgba(23,21,15,.11);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --goodBg:rgba(12,163,12,.10); --warnBg:rgba(250,178,25,.16); --critBg:rgba(208,59,59,.10);
  --gEs:#3987e5; --gM1:#12a594; --gM2:#8b5cf6; --gM3:#e2478a; --gHs:#c2760c;
  --accent:#2a5ec9; --accentBg:rgba(42,94,201,.10);
  --tdInk:#a4562a; --tdBg:#fdf3e6; --tdLine:rgba(164,86,42,.28);
  --advInk:#b45309; --advBg:rgba(180,83,9,.13); --advLine:rgba(180,83,9,.35);
  --opInk:#7c3aed; --opBg:rgba(124,58,237,.10); --opLine:rgba(124,58,237,.32);
  --pairInk:#0e8f8a; --pairBg:rgba(14,143,138,.12); --pairLine:rgba(14,143,138,.34);
}
@media (prefers-color-scheme: dark){
  :root{ --pairInk:#4fd1c5; --pairBg:rgba(79,209,197,.15); --pairLine:rgba(79,209,197,.38); --tdInk:#e6a86b; --tdBg:#241d15; --tdLine:rgba(230,168,107,.3); --surface:#1c1a17; --plane:#100f0d; --sunk:#26241f; --ink:#fbf9f4; --ink2:#c6c1b4; --muted:#8e887c; --line:rgba(255,255,255,.12);
    --goodBg:rgba(12,163,12,.16); --warnBg:rgba(250,178,25,.14); --critBg:rgba(208,59,59,.18); }
}
:root[data-theme="dark"]{ --pairInk:#4fd1c5; --pairBg:rgba(79,209,197,.15); --pairLine:rgba(79,209,197,.38); --opInk:#c4a2ff; --opBg:rgba(167,139,250,.14); --opLine:rgba(167,139,250,.38); --advInk:#f0b429; --advBg:rgba(240,180,41,.16); --advLine:rgba(240,180,41,.4); --tdInk:#e6a86b; --tdBg:#241d15; --tdLine:rgba(230,168,107,.3); --surface:#1c1a17; --plane:#100f0d; --sunk:#26241f; --ink:#fbf9f4; --ink2:#c6c1b4; --muted:#8e887c; --line:rgba(255,255,255,.12);
  --goodBg:rgba(12,163,12,.16); --warnBg:rgba(250,178,25,.14); --critBg:rgba(208,59,59,.18); }
:root[data-theme="light"]{ --surface:#fffdf8; --plane:#f6f3ec; --sunk:#efebe1; --ink:#17150f; --ink2:#514d44; --muted:#8b8579; --line:rgba(23,21,15,.11); --tdInk:#a4562a; --tdBg:#fdf3e6; --tdLine:rgba(164,86,42,.28);
  --goodBg:rgba(12,163,12,.10); --warnBg:rgba(250,178,25,.16); --critBg:rgba(208,59,59,.10); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px}
#hdrHome{cursor:pointer;-webkit-tap-highlight-color:transparent}
#hdrHome:active{opacity:.6}
header .sub{font-size:12px;color:var(--muted);margin-top:1px}
#themeBtn{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:15px}
main{padding:14px 14px 6px;max-width:480px;margin:0 auto}
header .in{max-width:480px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 2px 12px}

/* ── 링크 탭 ── */
.gradeGrid{display:grid;grid-template-columns:1fr;gap:10px}
.gradeCard{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);text-align:left;width:100%}
.gradeCard .emo{font-size:30px;width:42px;text-align:center;flex:0 0 auto}
.gradeCard .lab{font-weight:750;font-size:17px}
.gradeCard .go{margin-left:auto;font-size:12px;color:var(--accent);font-weight:650;flex:0 0 auto}
.backBtn{font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:10px;padding:6px 2px}
.linkCard{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px}
.linkCard .emo{font-size:24px;width:38px;text-align:center;flex:0 0 auto}
.linkCard .lab{font-weight:650;font-size:15px}
.linkCard .go{margin-left:auto;font-size:13px;color:var(--good);font-weight:650;flex:0 0 auto}
.linkCard.off{opacity:.55}
.linkCard.off .go{color:var(--muted)}
.linkCard.skel{background:linear-gradient(90deg,var(--sunk) 25%,var(--line) 37%,var(--sunk) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;height:58px}
.hintTool{margin:18px 2px 10px;font-weight:700;color:var(--ink2);
  display:flex;align-items:center;gap:8px}
.hintTool::after{content:'';flex:1;height:1px;background:var(--line)}
.linkCard.tool{border-color:var(--accent);background:var(--accentBg)}
.linkCard.tool .go{color:var(--accent)}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* ── 어디서부터 탭 ── */
.op{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px;margin-bottom:12px;
  border-top:3px solid var(--opInk)}
.opHead{display:flex;margin-bottom:8px}
.opLv{font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--opInk);
  background:var(--opBg);border:1px solid var(--opLine);border-radius:999px;padding:2px 9px}
.opQ{font-size:16px;font-weight:750;line-height:1.5;letter-spacing:-.01em;margin-bottom:12px;text-wrap:balance;word-break:keep-all}
.opBlock{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opBlock b{display:block;font-size:10.5px;font-weight:800;color:var(--opInk);margin-bottom:7px;letter-spacing:.02em}
.opBlock p{font-size:13px;line-height:1.55;color:var(--ink);word-break:keep-all}
.opSteps{margin:0;padding-left:19px;font-size:13px;line-height:1.55}
.opSteps li{margin-bottom:5px;word-break:keep-all}
.opLink{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);word-break:keep-all}
.opBlock.hint{background:var(--opBg);border-color:var(--opLine)}
.opBlock.ans .opAns{font-size:18px;font-weight:800;margin-bottom:7px}
.opMore{width:100%;min-height:46px;border-radius:12px;background:var(--opBg);border:1px solid var(--opLine);
  color:var(--opInk);font-size:13px;font-weight:700;margin-bottom:9px}
.opThink{width:100%;min-height:44px;border-radius:11px;background:var(--sunk);border:1px solid var(--line);
  color:var(--ink2);font-size:12.5px;font-weight:650}
.opThink{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0}
.opThink small{font-size:10.5px;font-weight:500;opacity:.7}
.opThink.on{background:var(--opBg);border-color:var(--opInk);color:var(--opInk);font-weight:750}

/* ── 공지 탭 ── */
.noticeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-radius:14px;padding:13px 12px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid transparent}
.notice .emo{font-size:19px;margin-bottom:6px}
.notice .t{font-weight:700;font-size:13px;line-height:1.3;margin-bottom:4px}
.notice .b{font-size:11.5px;color:var(--ink2);line-height:1.45}
.notice.crit{border-left-color:var(--crit)}
.notice.warn{border-left-color:var(--warn)}
.notice.good{border-left-color:var(--good)}

/* ── 공식암기 탭 ── */
/* ── 오늘 5장 ── */
.today{background:var(--tdBg);border:1px solid var(--tdLine);border-radius:18px;
  padding:4px 4px 12px;margin-bottom:16px}
.todayHead{width:100%;min-height:60px;display:flex;align-items:center;gap:10px;padding:12px 14px 6px;text-align:left}
.tdLab{font-size:16.5px;font-weight:800;letter-spacing:-.015em;color:var(--tdInk);flex:0 0 auto}
.tdDots{display:flex;gap:5px;flex:1 1 auto;align-items:center}
.tdDots i{width:9px;height:9px;border-radius:50%;background:transparent;
  border:1.5px solid var(--tdLine);display:block}
.tdDots i.on{background:var(--tdInk);border-color:var(--tdInk)}
.tdGo{font-size:12.5px;font-weight:750;color:var(--tdInk);flex:0 0 auto;
  border:1px solid var(--tdLine);border-radius:999px;padding:6px 12px}
.todayNote{font-size:11.5px;color:var(--muted);padding:0 15px 2px;word-break:keep-all;line-height:1.5}
.todayBody{display:flex;flex-direction:column;gap:10px;padding:12px 10px 2px}

/* ── 보기 설정 접기 ── */
.toolsBar{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
.toolsBtn{font-size:12px;font-weight:700;color:var(--ink2);padding:8px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);min-height:36px}
.toolsBtn[aria-expanded="true"]{background:var(--sunk)}
.toolsNow{font-size:11.5px;color:var(--muted);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;
  scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip.chipG{padding:6px 11px;font-size:12.5px;flex:1 1 auto;justify-content:center}
.chipsSub{margin-bottom:12px}
.chip{flex:0 0 auto;min-height:42px;padding:6px 15px;border-radius:999px;font-size:13px;border:1px solid var(--line);
  color:var(--ink2);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.chip i{font-style:normal;font-size:10.5px;font-weight:700;margin-left:5px;opacity:.6}
.chip[aria-pressed="true"] i{opacity:.85}
.chipsSub .chip{font-size:12.5px;padding:6px 14px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar button{flex:1 1 auto;min-height:44px;min-width:100px;padding:9px;border-radius:11px;background:var(--accentBg);
  color:var(--accent);font-size:12.5px;font-weight:650;border:1px solid var(--accent)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:#fff}
.unitList{display:flex;flex-direction:column;gap:10px}
.unit{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.unitHead{width:100%;min-height:52px;display:flex;align-items:center;gap:10px;padding:10px 14px;text-align:left;background:transparent}
.unitHead .ug{font-size:10.5px;font-weight:800;opacity:.6;flex:0 0 auto}
.unitHead .un{font-size:14.5px;font-weight:700;flex:1 1 auto;line-height:1.3}
.unitHead .uprog{font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto;white-space:nowrap;
  display:flex;align-items:center;gap:7px}
.uBar{width:34px;height:4px;border-radius:999px;background:var(--sunk);overflow:hidden;display:block;flex:0 0 auto}
.uBar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.unitHead .uprog.full{color:var(--good)}
.unitHead .uprog.full .uBar span{background:var(--good)}
.unitHead .uadv{color:var(--advInk)}
.unitHead .uchev{font-size:12px;color:var(--muted);flex:0 0 auto;transition:transform .2s}
.unit.open .uchev{transform:rotate(90deg)}
.unitBody{display:none;flex-direction:column;gap:10px;padding:0 12px 14px}
.unit.open .unitBody{display:flex}
.fc{perspective:1000px}
.fcIn{position:relative;width:100%;min-height:196px;display:grid;transition:transform .4s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d}
.fc.on .fcIn{transform:rotateY(180deg)}
.fcFace{position:relative;grid-row:1;grid-column:1;min-height:196px;border-radius:15px;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:22px 16px 14px;border-top:3px solid transparent;border-left:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.fcFront{background:var(--sunk);font-size:16px;font-weight:750;line-height:1.4;letter-spacing:-.015em;
  text-wrap:balance;word-break:keep-all}
.fcFront::after{content:'눌러서 뒤집기';position:absolute;bottom:12px;left:0;right:0;
  font-size:10.5px;font-weight:600;color:var(--muted);opacity:.7;letter-spacing:.02em}
.fcBack{background:var(--surface);color:var(--ink);transform:rotateY(180deg);box-shadow:0 2px 4px rgba(23,21,15,.05),0 10px 26px rgba(23,21,15,.07);
  font-size:13px;line-height:1.5;font-weight:600;letter-spacing:-.01em;gap:2px}
.fcBack .def{font-size:13.5px;font-weight:800;line-height:1.4;margin-bottom:6px;text-wrap:balance;word-break:keep-all}
.fcBack .form{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.45;
  text-wrap:balance;word-break:keep-all}
.fcShape{width:100%;height:88px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  margin-bottom:5px;opacity:.92}
.fcShape svg{height:100%;width:auto;max-width:100%}
.fcShape text.halo{fill:none;stroke:var(--sunk);stroke-width:2.2px;stroke-linejoin:round;stroke-linecap:round}
.fcBack .fcShape text.halo{stroke:var(--surface)}
.fcShape.big{height:132px;margin-bottom:0;opacity:1}
.fcFront .fcShape.big svg{stroke-width:2.1}
.fcName{font-size:14.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:7px;
  padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.18);width:100%}
.propList{margin:2px 0 0;padding:0;list-style:none;text-align:left;width:100%}
.propList li{position:relative;padding-left:12px;margin-bottom:4px;font-weight:550;opacity:.94;font-size:12.5px;line-height:1.45;
  text-wrap:pretty;word-break:keep-all}
.propList li::before{content:'·';position:absolute;left:0;top:-1px;font-weight:900;opacity:.7}
.par{display:inline-block;transform:skewX(-20deg);margin:0 .06em}
.gradeTag{font-size:9.5px;font-weight:800;position:absolute;top:9px;left:12px;letter-spacing:.03em;opacity:.85}
.advTag{position:absolute;top:7px;right:10px;font-size:9px;font-weight:800;letter-spacing:.02em;
  padding:2px 7px;border-radius:999px;background:var(--advBg);color:var(--advInk);border:1px solid var(--advLine)}
.fc.adv .fcFace{border-top-color:var(--advInk) !important}
.pairTag{position:absolute;top:7px;right:10px;font-size:9px;font-weight:800;letter-spacing:.02em;
  padding:2px 7px;border-radius:999px;background:var(--pairBg);color:var(--pairInk);border:1px solid var(--pairLine)}
.fc.pairc .fcFace{border-top-color:var(--pairInk) !important}
.chip.chipPair[aria-pressed="true"]{background:var(--pairBg);color:var(--pairInk);border-color:var(--pairLine)}
.fc[data-t="es"] .fcFace{border-top-color:var(--gEs)} .fc[data-t="es"] .gradeTag{color:var(--gEs)}
.fc[data-t="m1"] .fcFace{border-top-color:var(--gM1)} .fc[data-t="m1"] .gradeTag{color:var(--gM1)}
.fc[data-t="m2"] .fcFace{border-top-color:var(--gM2)} .fc[data-t="m2"] .gradeTag{color:var(--gM2)}
.fc[data-t="m3"] .fcFace{border-top-color:var(--gM3)} .fc[data-t="m3"] .gradeTag{color:var(--gM3)}
.fc[data-t="hs"] .fcFace{border-top-color:var(--gHs)} .fc[data-t="hs"] .gradeTag{color:var(--gHs)}
.fcFooter{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.detailToggle{width:100%;min-height:40px;border-radius:10px;background:transparent;border:1px dashed var(--line);
  color:var(--ink2);font-size:12.5px;font-weight:650}
.detailPanel{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.5}
.detailPanel .drow b{display:block;font-size:10.5px;font-weight:800;color:var(--accent);margin-bottom:2px;letter-spacing:.02em}
.detailPanel .drow span{color:var(--ink);text-wrap:pretty;word-break:keep-all}
.judgeRow{display:flex;gap:8px}
.judgeRow button{flex:1;min-height:44px;border-radius:11px;font-size:13px;font-weight:700;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.judgeRow button[data-know]{border-color:var(--good)}
.judgeRow button[data-unsure]{border-color:var(--warn)}
.judgeRow button.active[data-know]{background:var(--good);color:#fff;border-color:var(--good)}
.judgeRow button.active[data-unsure]{background:var(--warn);color:#fff;border-color:var(--warn)}
.fcBack .gradeTag{opacity:.75}

/* ── 하단 탭바 ── */
#toTop{position:fixed;right:14px;z-index:25;bottom:calc(80px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-size:18px;font-weight:700;line-height:1;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .18s,transform .18s;
  box-shadow:0 3px 12px rgba(23,21,15,.18);display:flex;align-items:center;justify-content:center}
#toTop.on{opacity:1;pointer-events:auto;transform:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:480px;margin:0 auto;width:100%}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:650}
nav button .ic{font-size:19px}
</style>
</head>
<body>
<header>
  <div class="in">
    <div id="hdrHome" role="button" tabindex="0" aria-label="처음 화면으로"><h1>더올림수학 루틴</h1><div class="sub" id="hdrSub">체크인 · 공지 · 공식 암기</div></div>
    <button id="themeBtn">🌓</button>
  </div>
</header>
<main id="main"></main>
<button id="toTop" aria-label="맨 위로">↑</button>
<nav>
  <div class="in">
    <button data-tab="link" class="on"><span class="ic">🔗</span>링크</button>
    <button data-tab="notice"><span class="ic">📌</span>공지</button>
    <button data-tab="card"><span class="ic">🧠</span>공식암기</button>
    <button data-tab="open"><span class="ic">👣</span>어디서부터</button>
  </div>
</nav>

<script>
/* ═══════════════════════ 데이터 ═══════════════════════ */
const NOTICES = [
  {k:'crit', e:'🚫', t:'당일 결석 · 보강 없음', b:'당일에 빠지면 보강 자리를 못 잡아드려요.'},
  {k:'crit', e:'⏰', t:'지각 · 보강 대상 아님', b:'늦은 만큼 그날 수업이 줄어듭니다.'},
  {k:'crit', e:'🔁', t:'보강도 한 번뿐', b:'보강에 못 오면 재보강은 어려워요.'},
  {k:'warn', e:'📅', t:'결석은 미리 알려주세요', b:'2주 전 신고하면 보강 자리를 잡아드려요.'},
  {k:'warn', e:'📞', t:'숙제 3회째도 안 되면 연락', b:'2번은 챙겨보고, 3번째부터 연락드려요.'},
  {k:'good', e:'✏️', t:'필기도구는 개인 지참', b:'여분 비치는 안 합니다. 교재도 챙겨주세요.'},
];

const CARDS = [

    when:'문자식끼리 더하거나 뺄 때', caution:'빼는 괄호 안 모든 항의 부호가 바뀐다 — 첫 항만 바꾸는 실수가 가장 많다', example:'(3x²-2x+1) - (x²-5x+4)\n= 3x²-2x+1-x²+5x-4 = 2x²+3x-3'},
  {g:'중2', u:'지수법칙과 다항식의 계산', f:'(단항식) × (다항식)', b:'분배법칙으로 괄호 안 각 항에 곱한다\na(b + c) = ab + ac',
    when:'단항식을 괄호가 있는 식에 곱해 전개할 때', caution:'음수 단항식이면 괄호 안 모든 항의 부호가 바뀐다 — 뒤쪽 항을 빠뜨리는 실수가 많다', example:'-2x(3x - 4y + 1)\n= -6x² + 8xy - 2x'},
  {g:'중2', u:'지수법칙과 다항식의 계산', f:'(다항식) ÷ (단항식)', b:'각 항을 단항식으로 나눈다\n(a + b) ÷ c = a/c + b/c',

  {g:'중2', u:'연립방정식과 부등식', f:'연립방정식과 부등식', def:'연립방정식: 두 개 이상의 방정식을 한 쌍으로 묶어 공통의 해를 구하는 것 / 일차부등식: 정리했을 때 ax + b > 0 (또는 <, ≥, ≤) 꼴(a ≠ 0)로 나타낼 수 있는 부등식', props:['부등식의 해는 부등식을 참이 되게 하는 값의 범위이다','연립방정식의 해는 두 방정식을 동시에 만족하는 x, y의 짝이다'],
    when:'연립방정식·부등식의 뜻과 해를 구분할 때', caution:'방정식의 해는 값 하나, 부등식의 해는 범위', example:'x = 2, y = 1 이 x+y=3 과 x-y=1 을\n둘 다 만족 → 연립방정식의 해'},
  {g:'중2', u:'연립방정식과 부등식', f:'부등식의 성질', b:'양변에 같은 수를 더하거나 빼면 → 부등호 그대로\n양변에 양수를 곱하거나 나누면 → 부등호 그대로\n양변에 음수를 곱하거나 나누면 → 부등호 반대',
    when:'부등식을 풀기 위해 양변을 조작할 때', caution:'이 단원 오답의 대부분이 음수로 곱하거나 나눌 때 부등호를 안 뒤집어서 나온다', example:'-3x > 12\n양변을 -3으로 나눔 → x < -4'},
  {g:'중2', u:'연립방정식과 부등식', f:'일차부등식 풀이 순서', b:'괄호 풀기 → 이항 → ax > b 꼴로 정리\n→ 양변을 a로 나눈다 (a < 0 이면 부등호 반대)',
    when:'x가 포함된 일차부등식의 해의 범위를 구할 때', caution:'이항하고 나서야 음수 계수가 나타나는 경우가 많다 — 처음엔 안 보인다', example:'2x - 1 ≤ 5x + 8\n-3x ≤ 9 → x ≥ -3'},
  {g:'중2', u:'연립방정식과 부등식', f:'연립방정식 풀이', b:'대입법 또는 가감법으로\n한 문자를 없애고 푼다',
    when:'미지수가 2개인 두 방정식을 동시에 풀 때', caution:'한 문자를 없애는 게 목표 — x = 또는 y = 꼴이 이미 있으면 대입법, 아니면 가감법', example:'x+y=5, x-y=1 → 더하면 2x=6\nx=3, y=2'},
  {g:'중2', u:'연립방정식과 부등식', f:'연립방정식 — 가감법', b:'없앨 문자의 계수를 같게\n(또는 부호만 반대로) 만든 뒤\n두 식을 더하거나 뺀다',
    when:'두 식이 모두 ax + by = c 꼴일 때', caution:'어느 문자를 없앨지 먼저 고른다 — 계수가 +1, -1인 문자가 있으면 그것부터', example:'x+y=7, 2x-y=2\n더하면 3x=9 → x=3, y=4'},
  {g:'중2', u:'연립방정식과 부등식', f:'연립방정식 — 대입법', b:'한 식을 x = … (또는 y = …) 꼴로 고쳐\n다른 식에 대입한다',
    when:'한 식이 이미 x = 또는 y = 꼴로 정리되어 있을 때', caution:'대입할 때 괄호를 씌운다 — 안 씌우면 부호가 틀어진다', example:'y=2x-1, 3x+y=9\n3x+(2x-1)=9 → 5x=10 → x=2, y=3'},
  {g:'중2', u:'연립방정식과 부등식', f:'계수가 소수·분수인 연립방정식', b:'소수 → 양변에 10, 100 …을 곱한다\n분수 → 양변에 분모의 최소공배수를 곱한다\n정수로 만든 뒤 가감법·대입법',
    when:'계수에 소수나 분수가 있어 계산이 복잡할 때', caution:'양변의 모든 항에 빠짐없이 곱한다 — 상수항을 빠뜨리는 실수가 많다', example:'0.2x+0.3y=1.2 → ×10 → 2x+3y=12\nx-y=1 과 연립 → x=3, y=2'},
  {g:'중2', u:'연립방정식과 부등식', f:'해가 특수한 연립방정식', b:'a₁x+b₁y=c₁,  a₂x+b₂y=c₂ 에서\na₁:a₂ = b₁:b₂ = c₁:c₂\n→ 해가 무수히 많다 (두 직선이 일치)\na₁:a₂ = b₁:b₂ ≠ c₁:c₂\n→ 해가 없다 (두 직선이 평행)\na₁:a₂ ≠ b₁:b₂\n→ 해가 한 쌍 (한 점에서 만남)',
    when:'연립방정식을 풀었더니 0=0 또는 0=(0이 아닌 수)가 나올 때', caution:'상수항 하나로 결론이 뒤집힌다 — 계수의 비가 같으면 반드시 상수항까지 확인', example:'2x+y=3, 4x+2y=10\n좌변은 2배인데 우변은 아니다 → 해가 없다\n(우변이 6이었다면 해가 무수히 많다)'},
  {g:'중2', u:'연립방정식과 부등식', f:'A = B = C 꼴의 방정식', b:'A = B,  B = C  (또는 A = B, A = C)\n두 개를 골라 연립방정식으로 푼다',
    when:'세 식이 등호로 이어진 방정식을 풀 때', caution:'세 개를 두 쌍으로 끊는다는 발상 자체가 이 유형의 전부 / 어느 두 쌍을 골라도 해는 같다', example:'x+y = 3x-y = 8\nx+y=8, 3x-y=8 → x=4, y=4'},
  {g:'중2', u:'연립방정식과 부등식', f:'순서 — 연립방정식은 무엇부터', pair:1, b:'먼저 두 식의 모양을 본다\n계수가 같거나 반대면 가감법\n한쪽이 정리돼 있으면 대입법', when:'두 식을 받아 놓고 어느 방법으로 소거할지 정할 때.', caution:'늘 쓰던 방법 하나로만 간다. 모양을 보지 않고 대입하면 계산이 길어져 부호에서 틀린다.', example:'x + y = 7, x - y = 1이면 가감법.\n더하면 2x = 8, x = 4, y = 3.'},
  {g:'중2', u:'연립방정식과 부등식', f:'연립방정식 + 도형', pair:1, b:'주인공 — 도형의 넓이\n도구 — 연립방정식\n두 직선의 교점 = 연립방정식의 해',
    when:'직선 몇 개로 둘러싸인 도형의 넓이를 구할 때', caution:'꼭짓점 세 개를 먼저 다 구한 뒤에 밑변과 높이를 정한다', example:'y = 2x-1, y = -x+5, x축\n교점 (2,3), x절편 (1/2,0), (5,0)\n밑변 9/2, 높이 3 → 넓이 27/4'},
  {g:'중2', u:'연립방정식과 부등식', f:'일차부등식 + 도형', pair:1, b:'주인공 — 부등식\n도구 — 넓이·둘레 공식\n이상·이하·넘는다가 붙으면 부등식',
    when:'넓이나 둘레에 조건이 붙은 문제', caution:'길이는 항상 양수 — 구한 범위와 x > 0 을 함께 본다', example:'세로가 8cm인 직사각형\n넓이가 40cm² 이상이려면\n8x ≥ 40 → x ≥ 5'},
  {g:'중2', u:'연립방정식과 부등식', f:'부등식 + 삼각형이 되는 조건', pair:1, b:'주인공 — 부등식\n도구 — 삼각형의 결정조건\n가장 긴 변 < 나머지 두 변의 합',
    when:'세 변이 문자로 주어지고 삼각형이 되는 범위를 물을 때', caution:'가장 긴 변이 무엇인지 먼저 정한다 — 세 부등식 중 하나만 확인하면 된다', example:'세 변이 x, x+2, x+5\nx + (x+2) > x+5\nx > 3'},

  {g:'중2', u:'일차함수', f:'일차함수', shape:'linearFn', def:'함수: x값 하나에 y값이 하나씩 대응하는 관계 / 일차함수: y = ax+b(a≠0) 꼴로 나타나는 함수', props:['그래프는 항상 직선 모양이다'],
    when:'주어진 식이 일차함수인지 판별할 때', caution:'y = ax + b 에서 a ≠ 0 — a = 0이면 일차함수가 아니다 / x²이나 1/x이 있으면 일차함수가 아니다', example:'y=3x²+1, y=2/x, y=5x-2 중\n일차함수는 y = 5x - 2'},
  {g:'중2', u:'일차함수', f:'일차함수의 기울기', shape:'slopeTri', b:'기울기 a = (y의 증가량) ÷ (x의 증가량)\n두 점 (x₁,y₁), (x₂,y₂)를 지나면\na = (y₂ - y₁) / (x₂ - x₁)',
    when:'일차함수 그래프가 얼마나 가파른지 구할 때', caution:'감소는 음수로 바꿔서 넣는다 / 고등 「미분」의 변화율이 이것의 확장이다', example:'x가 2 증가할 때 y가 6 감소\n기울기 = -6 ÷ 2 = -3'},
  {g:'중2', u:'일차함수', f:'일차함수의 절편', shape:'linearFn', b:'x절편: y = 0을 대입해서 구한다\ny절편: x = 0을 대입해서 구한다',
    when:'그래프가 x축·y축과 만나는 점을 구할 때', caution:'절편은 좌표가 아니라 값이다 — (3, 0)이 아니라 3', example:'y = 2x - 6\nx절편 3, y절편 -6'},
  {g:'중2', u:'일차함수', f:'그래프와 사분면', shape:'quadrants', b:'x절편과 y절편 두 점을 찍어 직선을 긋는다\n지나는 사분면은\n기울기와 y절편의 부호로 정해진다',
    when:'그래프가 지나는(또는 지나지 않는) 사분면을 물을 때', caution:'절편 두 개로 머릿속에 그림을 그려야 답이 나온다 — 식만 보고는 안 보인다', example:'y = -x + 4 → x절편 4, y절편 4\n제1·2·4사분면을 지나고\n제3사분면은 지나지 않는다'},
  {g:'중2', u:'일차함수', f:'평행이동', shape:'translateLine', b:'y = ax 의 그래프를 y축 방향으로 b만큼\n평행이동하면 y = ax + b',
    when:'기울기가 같은 두 직선의 관계를 설명할 때', caution:'b > 0 이면 위로, b < 0 이면 아래로 이동', example:'y = 2x 를 위로 3만큼\n→ y = 2x + 3'},
  {g:'중2', u:'일차함수', f:'a, b의 부호와 그래프', shape:'linearFn', b:'a > 0 → 오른쪽 위로 향하는 직선\na < 0 → 오른쪽 아래로 향하는 직선\nb > 0 → y축의 양의 부분에서 만남\nb < 0 → y축의 음의 부분에서 만남',
    when:'그래프 모양만 보고 a, b의 부호를 판단할 때(또는 그 반대)', caution:'그래프를 보고 부호를 찾는 문제와, 부호를 보고 그래프를 그리는 문제가 둘 다 나온다', example:'제2·3·4사분면을 지난다\n→ a < 0, b < 0'},
  {g:'중2', u:'일차함수', f:'두 점을 지나는 직선의 식', shape:'slopeTri', b:'① 기울기 a = (y₂-y₁) / (x₂-x₁)\n② 한 점을 y = ax + b 에 대입해 b를 구한다',
    when:'두 점의 좌표만 주어졌을 때 직선의 식을 세울 때', caution:'기울기를 구한 뒤 반드시 점 하나를 대입해 b를 찾는다', example:'(1, 3), (3, 7)\n기울기 = (7-3)÷(3-1) = 2\n3 = 2×1 + b → b = 1 → y = 2x + 1'},
  {g:'중2', u:'일차함수', f:'기울기와 한 점이 주어진 직선', shape:'linearFn', b:'y = ax + b 에 기울기 a와\n지나는 점의 좌표를 대입해 b를 구한다',
    when:'기울기와 지나는 점 하나가 주어졌을 때', caution:'대입할 때 부호를 놓치지 않는다', example:'기울기 -2, 점 (2, 1)\n1 = -2×2 + b → b = 5 → y = -2x + 5'},
  {g:'중2', u:'일차함수', f:'두 직선의 평행과 일치', shape:'parallelLines2', b:'평행: 기울기가 같고 y절편이 다르다\n일치: 기울기와 y절편이 모두 같다\n한 점에서 만남: 기울기가 다르다',
    when:'두 일차함수 그래프의 위치 관계를 따질 때', caution:'기울기가 같다고 무조건 평행이 아니다 — y절편까지 같으면 일치(한 직선)', example:'y=(a-1)x+3 과 y=2x-1 이 평행\na - 1 = 2 → a = 3'},
  {g:'중2', u:'일차함수', f:'일차함수와 일차방정식', shape:'linearFn', b:'ax + by + c = 0 (a ≠ 0 또는 b ≠ 0)의\n그래프는 직선\nb ≠ 0 이면 y = -(a/b)x - (c/b)',
    when:'일차방정식 꼴로 주어진 직선의 기울기·절편을 구할 때', caution:'y에 대해 정리하는 과정을 반드시 거친다 / 고등 「직선의 방정식」에서 이 꼴이 기본형이 된다', example:'2x + 3y - 6 = 0\ny = -(2/3)x + 2\n기울기 -2/3, y절편 2'},
  {g:'중2', u:'일차함수', f:'좌표축에 평행한 직선', shape:'axisParallel', b:'x = p → y축에 평행한 세로선\ny = q → x축에 평행한 가로선',
    when:'기울기를 정할 수 없는 직선(세로선)을 다룰 때', caution:'x = p 는 함수가 아니다(x 하나에 y가 무수히 많음)', example:'두 점 (3, 1), (3, 5)를 지나는 직선\n→ x = 3'},
  {g:'중2', u:'일차함수', f:'연립방정식의 해와 두 직선', shape:'twoLinesCross', b:'연립방정식의 해 = 두 직선의 교점의 좌표\n한 점에서 만남 → 해 1개\n평행 → 해가 없다\n일치 → 해가 무수히 많다',
    when:'연립방정식을 그래프로 해석할 때', caution:'해가 없다 = 평행, 해가 무수히 많다 = 완전히 겹침', example:'두 직선이 (2, 3)에서 만남\n→ 연립방정식의 해는 x=2, y=3'},
  {g:'중2', u:'일차함수', f:'일차함수 + 거리·속력·시간', pair:1, b:'주인공 — 일차함수\n도구 — 거리·속력·시간\n시간-거리 그래프에서\n기울기가 곧 속력이다',
    when:'시간에 따른 거리 그래프를 읽을 때', caution:'활용 문제로만 배우던 거속시가 그래프로 보이는 첫 자리 / 기울기가 0이면 멈춰 있다는 뜻', example:'원점에서 출발해\n2시간에 120km 지점을 지난다\n기울기 60 → 시속 60km'},
  {g:'중2', u:'일차함수', f:'연립방정식 + 좌표 + 넓이', pair:1, b:'주인공 — 넓이\n도구 — 연립방정식\n세 직선의 교점을 연립으로 구하면\n삼각형이 생긴다',
    when:'세 직선으로 둘러싸인 삼각형의 넓이를 구할 때', caution:'x축이나 y축도 직선 하나로 센다', example:'y = x, y = -x+4, y = 0\n꼭짓점 (0,0), (4,0), (2,2)\n넓이 = ½ × 4 × 2 = 4'},

  {g:'중2', u:'삼각형의 성질', f:'이등변삼각형의 성질', def:'두 변의 길이가 같은 삼각형', shape:'isoTriangle', props:['두 밑각의 크기가 같다','꼭지각의 이등분선은 밑변을 수직으로 이등분한다','정삼각형은 세 각이 모두 60°인 이등변삼각형이다'],

  {g:'중2', u:'삼각형의 성질', f:'이등변삼각형이 되는 조건', b:'두 내각의 크기가 같은 삼각형은\n이등변삼각형이다\n(∠B = ∠C 이면 AB = AC)', shape:'isoTriangle',

  {g:'중2', u:'삼각형의 성질', f:'각의 이등분선의 성질', shape:'angleBisector', def:'각의 이등분선 위의 점에서 그 각의 두 변까지의 거리는 같다', props:['거꾸로 두 변까지의 거리가 같은 점은 그 각의 이등분선 위에 있다','내심의 성질(세 변까지 거리가 같다)이 여기서 나온다'],

  {g:'중2', u:'삼각형의 성질', f:'삼각형의 외심', def:'삼각형의 세 변의 수직이등분선이 만나는 점', shape:'circumcenter', props:['외심에서 세 꼭짓점까지의 거리가 같다 (OA = OB = OC = 외접원의 반지름)','예각삼각형 → 삼각형의 내부 / 직각삼각형 → 빗변의 중점 / 둔각삼각형 → 삼각형의 외부','OA = OB = OC 이므로 이등변삼각형 3개가 생긴다 — 각 문제는 여기서 푼다'],
    when:'외접원의 중심·반지름을 묻거나 외심에서의 각을 구할 때', caution:'외심은 세 꼭짓점까지의 거리가 같다 — 세 변까지가 같은 것은 내심이다', example:'외접원의 반지름이 5\n→ OA = OB = OC = 5'},
  {g:'중2', u:'삼각형의 성질', f:'외심의 각', b:'∠OAB + ∠OBC + ∠OCA = 90°\n∠BOC = 2∠A', shape:'circumcenter',

  {g:'중2', u:'삼각형의 성질', f:'직각삼각형의 외심', b:'외심 = 빗변의 중점\n외접원의 반지름 = 빗변의 ½', shape:'rightTriangle',

    when:'내접원의 중심·반지름을 묻거나 내심에서의 각을 구할 때', caution:'내심은 세 변까지의 거리가 같다 — 세 꼭짓점까지가 같은 것은 외심이다', example:'내접원의 반지름이 4\n→ 내심에서 세 변까지의 거리가 모두 4'},
  {g:'중2', u:'삼각형의 성질', f:'내심의 각', b:'∠IAB + ∠IBC + ∠ICA = 90°\n∠BIC = 90° + ½∠A', shape:'incenter',

  {g:'중2', u:'삼각형의 성질', f:'내접원의 반지름과 넓이', b:'△ABC의 넓이 S = ½ × r × (a + b + c)\n(r은 내접원의 반지름, a+b+c는 둘레)', shape:'incenter',

  {g:'중2', u:'삼각형의 성질', f:'직각삼각형의 내접원', b:'r = (a + b - c) ÷ 2\n(a, b는 직각을 낀 두 변, c는 빗변)', shape:'rightTriangle',

  {g:'중2', u:'삼각형의 성질', f:'외심에서의 각의 합', b:'외심 O에서\n∠OAB + ∠OBC + ∠OCA = 90°', shape:'circumcenter',

  {g:'중2', u:'삼각형의 성질', f:'자주 틀리는 짝 — 외심과 내심', pair:1, b:'외심 — 세 꼭짓점에서 같은 거리\n내심 — 세 변에서 같은 거리\n외심: OA=OB=OC\n내심: 세 변까지 = 내접원 반지름', when:'외심과 내심이 함께 나온 그림에서 어느 쪽 성질을 꺼낼지 정할 때.', caution:'내심을 「세 꼭짓점에서 같은 거리」로 적는 아이가 가장 많다. 외심은 꼭짓점, 내심은 변이다.', example:'외접원 반지름이 5이면 OA=OB=OC=5.\n내접원 반지름이 2이면 내심에서 세 변까지 거리가 모두 2.'},
  {g:'중2', u:'삼각형의 성질', f:'자주 틀리는 짝 — 성질과 되는 조건', pair:1, b:'성질 — 주고 얻는 것\n되는 조건 — 보여야 할 것\nAB=AC면 ∠B=∠C (성질)\n∠B=∠C면 AB=AC (조건)\n사각형에서도 똑같다', when:'이등변삼각형임을 이미 아는지, 이등변삼각형임을 보여야 하는지 가를 때.', caution:'화살표 방향이 뒤집힌다. 보여야 할 것을 이미 안다고 놓고 풀면 서술형에서 점수가 없다.', example:'AB=AC=7이면 ∠B=∠C. (성질)\n∠B=∠C=50도이면 AB=AC이고\n이등변삼각형이 된다. (되는 조건)'},
  {g:'중2', u:'삼각형의 성질', f:'외심·내심 + 방정식', pair:1, b:'주인공 — 방정식\n도구 — 외심·내심의 각\n각의 관계를 식으로 놓는다',
    when:'외심·내심의 각을 주고 ∠A를 물을 때', caution:'∠BOC = 2∠A, ∠BIC = 90° + ½∠A — 어느 쪽인지 먼저 정하고 식을 세운다', example:'∠BIC = 115°\n115 = 90 + ½∠A\n∠A = 50°'},

  {g:'중2', u:'사각형의 성질', f:'평행사변형의 성질', def:'두 쌍의 대변이 각각 평행한 사각형', shape:'parallelogram', props:['두 쌍의 대변의 길이가 각각 같다','두 쌍의 대각의 크기가 각각 같다','두 대각선은 서로를 이등분한다','이웃하는 두 각의 크기의 합은 180°이다'],

  {g:'중2', u:'사각형의 성질', f:'평행사변형이 되는 조건', def:'아래 중 하나만 만족해도 평행사변형이다', shape:'parallelogram', props:[

  {g:'중2', u:'사각형의 성질', f:'직사각형의 성질', def:'네 각이 모두 직각인 사각형 — 평행사변형의 성질 + 아래', shape:'rect', props:['두 대각선의 길이가 같다','두 대각선은 서로를 이등분한다','평행사변형에서 한 내각이 직각이거나 두 대각선의 길이가 같으면 직사각형이 된다'],
    when:'직사각형의 대각선 길이를 이용할 때', caution:'대각선이 서로를 이등분하고 길이도 같으므로 교점에서 네 꼭짓점까지 거리가 모두 같다', example:'대각선 AC = 10\n→ BD = 10, 교점에서 각 꼭짓점까지 5'},

    when:'마름모의 넓이나 대각선 길이를 구할 때', caution:'대각선이 수직이므로 넓이 = ½ × (대각선) × (다른 대각선)', example:'두 대각선이 6, 8\n넓이 = ½ × 6 × 8 = 24'},
  {g:'중2', u:'사각형의 성질', f:'정사각형의 성질', def:'네 변의 길이가 모두 같고 네 각이 모두 직각인 사각형', shape:'square', props:['직사각형이면서 동시에 마름모이다','두 대각선의 길이가 같다','두 대각선은 서로를 수직이등분한다'],

    when:'등변사다리꼴에서 각이나 대각선을 구할 때', caution:'AD ∥ BC 이면 ∠A + ∠B = 180° 를 함께 쓴다', example:'∠B = 65°\n→ ∠C = 65°, ∠A = ∠D = 115°'},
  {g:'중2', u:'사각형의 성질', f:'여러 가지 사각형 사이의 관계', def:'사다리꼴 → 평행사변형 → 직사각형·마름모 → 정사각형 순으로 조건이 하나씩 더해진다', props:['평행사변형 + 한 내각이 직각 (또는 대각선의 길이가 같음) → 직사각형','평행사변형 + 이웃하는 두 변의 길이가 같음 (또는 대각선이 수직) → 마름모','직사각형 + 이웃하는 두 변의 길이가 같음 → 정사각형','마름모 + 한 내각이 직각 → 정사각형'],

  {g:'중2', u:'사각형의 성질', f:'각 변의 중점을 이은 사각형', b:'사각형 → 평행사변형\n평행사변형 → 평행사변형\n직사각형 → 마름모\n마름모 → 직사각형\n정사각형 → 정사각형',

  {g:'중2', u:'도형의 닮음', f:'닮음비와 둘레의 비', b:'닮음비가 m : n 이면\n대응변의 비 = m : n\n둘레의 비 = m : n\n(둘레는 제곱이 아니다)', shape:'simRatio',

  {g:'중2', u:'평행선 사이의 선분의 길이의 비', f:'삼각형의 무게중심', def:'삼각형의 세 중선이 만나는 점', shape:'centroid', props:['중선: 꼭짓점과 마주보는 변의 중점을 이은 선분','무게중심은 각 중선을 꼭짓점 쪽에서 2 : 1로 나눈다','세 중선은 삼각형을 넓이가 같은 6개의 삼각형으로 나눈다','무게중심은 항상 삼각형의 내부에 있다'],

  {g:'중2', u:'피타고라스 정리', f:'피타고라스 정리', b:'a² + b² = c²\n(c는 직각삼각형의 빗변)', shape:'rightTriangle',

  {g:'중2', u:'피타고라스 정리', f:'변의 길이와 각의 크기', b:'가장 긴 변이 c일 때\nc² < a² + b² → 예각삼각형\nc² = a² + b² → 직각삼각형\nc² > a² + b² → 둔각삼각형', shape:'rightTriangle',
    when:'세 변의 길이로 예각·직각·둔각을 구분할 때', caution:'가장 긴 변을 먼저 찾아 c로 놓는다 — 주어진 순서대로 계산하면 틀린다', example:'6, 8, 11 → 36 + 64 = 100 < 121\n→ 둔각삼각형'},
  {g:'중2', u:'피타고라스 정리', f:'피타고라스 수', b:'(3, 4, 5)  (5, 12, 13)\n(8, 15, 17)  (7, 24, 25)\n배수도 그대로 성립: (6,8,10) (9,12,15)',
    when:'계산 없이 직각삼각형의 세 변을 알아볼 때', caution:'외워두면 제곱해서 더하고 빼는 계산 없이 답이 바로 보인다', example:'직각을 낀 변이 9, 12\n→ (3,4,5)의 3배 → 빗변 15'},
  {g:'중2', u:'피타고라스 정리', f:'정사각형의 대각선', adv:1, b:'한 변이 a인 정사각형에서\n대각선² = 2a²\n대각선 = a√2', shape:'square',
    when:'정사각형의 대각선 길이를 구할 때', caution:'근호(√)는 중3에서 배운다 — 중2 시험에서는 대각선²까지 답하는 경우가 많다', example:'한 변 5 → 대각선² = 50\n대각선 = 5√2'},
  {g:'중2', u:'피타고라스 정리', f:'두 대각선이 수직인 사각형', b:'사각형 ABCD에서 AC ⊥ BD 이면\nAB² + CD² = BC² + DA²',
    when:'대각선이 수직인 사각형에서 변의 길이를 구할 때', caution:'마주보는 변끼리 짝지어 제곱해서 더한다', example:'AB=3, CD=6, BC=5\nDA² = 9 + 36 - 25 = 20'},
  {g:'중2', u:'피타고라스 정리', f:'히포크라테스의 원의 넓이', b:'직각삼각형의 세 변을 지름으로 하는 반원에서\n(두 초승달의 넓이의 합)\n= (직각삼각형의 넓이)',
    when:'반원이 겹쳐진 초승달 모양의 넓이를 구할 때', caution:'π가 모두 약분되어 사라진다 — 삼각형의 넓이만 구하면 끝', example:'직각을 낀 변이 6, 8\n초승달 넓이의 합 = ½ × 6 × 8 = 24'},
  {g:'중2', u:'피타고라스 정리', f:'피타고라스 + 넓이', pair:1, b:'주인공 — 넓이\n도구 — 피타고라스 정리\n높이를 피타고라스로 먼저 구한다',
    when:'높이가 주어지지 않은 삼각형의 넓이를 구할 때', caution:'이등변삼각형은 꼭지각에서 내린 수선이 밑변을 이등분한다 — 반으로 나눈 뒤에 쓴다', example:'밑변 6, 두 등변 5인 이등변삼각형\n높이 = √(25-9) = 4\n넓이 = ½ × 6 × 4 = 12'},
  {g:'중2', u:'피타고라스 정리', f:'피타고라스 + 닮음', pair:1, b:'주인공 — 닮음\n도구 — 피타고라스 정리\n직각삼각형에 수선을 그으면\n닮은 삼각형 세 개가 생긴다',
    when:'직각삼각형에서 수선의 발까지의 길이를 구할 때', caution:'AH² = BH × HC, AB² = BH × BC — 어느 쪽을 쓸지는 구하려는 길이가 정한다', example:'∠A=90°, AB=6, AC=8\nBC = 10\nAH = 6 × 8 ÷ 10 = 4.8\nBH = 6² ÷ 10 = 3.6'},

  {g:'중2', u:'경우의 수와 확률', f:'경우의 수 — 합의 법칙', b:'두 사건 A, B 가 동시에 일어나지 않을 때\n(A 또는 B) = m + n',
    when:'또는·이거나 로 연결된 경우를 셀 때', caution:'동시에 일어나지 않을 때만 더한다 — 겹치는 경우가 있으면 그만큼 빼야 한다', example:'주사위 1개, 3의 배수 또는 5의 배수\n{3, 6} 2가지 + {5} 1가지 = 3가지'},
  {g:'중2', u:'경우의 수와 확률', f:'경우의 수 — 곱의 법칙', b:'A가 일어나고 이어서 B가 일어날 때\n(A 그리고 B) = m × n',
    when:'그리고·동시에·잇달아 일어나는 경우를 셀 때', caution:'왕복처럼 단계가 늘어나면 그 수만큼 곱한다 — 두 번에서 멈추면 틀린다', example:'A→B 3개, B→C 4개 길\nA→B→C→B→A (같은 길 가능)\n3×4×4×3 = 144가지'},
  {g:'중2', u:'경우의 수와 확률', f:'한 줄로 세우는 경우의 수', b:'n명을 한 줄로: n × (n-1) × … × 2 × 1\nn명 중 2명을 뽑아 줄 세우기: n × (n-1)\nn명 중 3명: n × (n-1) × (n-2)',
    when:'순서를 정해 줄을 세우거나 자리를 배정할 때', caution:'몇 명을 세우는지에 따라 곱하는 개수가 달라진다', example:'5명을 한 줄로\n5×4×3×2×1 = 120가지'},
  {g:'중2', u:'경우의 수와 확률', f:'이웃하여 세우기', b:'이웃해야 하는 것을 한 덩어리로 묶어 배열한 뒤\n덩어리 안에서 다시 배열한다\n(묶은 것의 배열) × (덩어리 안의 배열)',
    when:'A와 B가 이웃하게(또는 이웃하지 않게) 세우는 문제', caution:'묶은 뒤 덩어리 안쪽 배열을 빠뜨리는 실수가 가장 많다 / 이웃하지 않게 = (전체) - (이웃하는 경우)', example:'A,B,C,D 4명 중 A와 B가 이웃\n(3×2×1) × (2×1) = 12가지\n전체 = 4×3×2×1 = 24가지\n이웃하지 않게 = 24 - 12 = 12가지'},
  {g:'중2', u:'경우의 수와 확률', f:'자연수 만들기', b:'두 자리 자연수\n= (십의 자리 개수) × (일의 자리 개수)\n십의 자리에는 0을 쓸 수 없다',
    when:'주어진 숫자 카드로 몇 자리 자연수를 만드는 문제', caution:'0이 포함되어 있으면 십의 자리에서 0을 빼고 센다 — 0이 없는 문제와 답이 다르다', example:'0,1,2,3에서 서로 다른 숫자로 두 자리 수\n십의 자리 3가지 × 일의 자리 3가지 = 9가지'},
  {g:'중2', u:'경우의 수와 확률', f:'대표를 뽑는 경우의 수', b:'자격이 다름(회장·부회장 등, 순서 O): n × (n-1)\n자격이 같음(대표 2명, 순서 X): n × (n-1) ÷ 2',
    when:'여러 명 중 몇 명을 뽑는 경우를 셀 때', caution:'순서가 있는지 없는지를 먼저 판단하는 것이 이 유형의 전부', example:'5명 중\n회장·부회장 → 5×4 = 20가지\n대표 2명 → 20 ÷ 2 = 10가지'},
  {g:'중2', u:'경우의 수와 확률', f:'확률', def:'어떤 사건이 일어날 가능성을 수로 나타낸 것', props:['확률은 항상 0 이상 1 이하이다','반드시 일어나면 확률 1, 절대 안 일어나면 확률 0','일어날 모든 경우의 확률을 더하면 1이다'],
    when:'확률의 뜻과 범위를 확인할 때', caution:'확률이 1보다 큰 값이 나오면 반드시 계산이 틀린 것', example:'빨강 3개, 파랑 5개인 주머니\n빨강을 꺼낼 확률 = 3/8'},
  {g:'중2', u:'경우의 수와 확률', f:'확률 구하기', b:'(사건이 일어나는 경우의 수)\n÷ (모든 경우의 수)',
    when:'어떤 사건이 일어날 가능성을 수로 나타낼 때', caution:'분모는 일어날 수 있는 모든 경우의 수 — 조건에 맞는 것만 세면 안 된다', example:'주사위에서 짝수가 나올 확률\n3 ÷ 6 = 1/2'},
  {g:'중2', u:'경우의 수와 확률', f:'일어나지 않을 확률', b:'(A가 일어나지 않을 확률)\n= 1 - (A가 일어날 확률)',
    when:'적어도 …인 확률처럼 직접 세기 번거로울 때', caution:'적어도 라는 말이 나오면 이 식부터 떠올린다 / 고등학교에서는 여사건의 확률이라 부른다', example:'동전 3개 중 적어도 하나 앞면\n1 - (모두 뒷면) = 1 - 1/8 = 7/8'},
  {g:'중2', u:'경우의 수와 확률', f:'확률의 덧셈과 곱셈', b:'동시에 일어나지 않는 두 사건(또는) → p + q\n서로 영향을 주지 않는 두 사건(그리고) → p × q',
    when:'두 사건의 확률을 합치거나 이어서 일어날 확률을 구할 때', caution:'또는 → 더하기, 그리고 → 곱하기 (경우의 수와 같은 원리)', example:'주사위 짝수 그리고 동전 앞면\n½ × ½ = ¼'},
  {g:'중2', u:'경우의 수와 확률', f:'연속하여 꺼내는 확률', b:'꺼낸 것을 다시 넣는 경우\n→ 두 번째도 전체 개수가 그대로\n꺼낸 것을 다시 넣지 않는 경우\n→ 두 번째는 전체 개수가 1 줄어든다',
    when:'주머니에서 공을 두 번 꺼내는 문제를 풀 때', caution:'다시 넣는지 아닌지에 따라 분모가 달라진다 — 문제에서 꼭 확인', example:'10개 중 불량 2개, 다시 넣지 않고 2개\n(2/10) × (1/9) = 1/45'},
  {g:'중2', u:'경우의 수와 확률', f:'자주 틀리는 짝 — 확률의 곱셈과 덧셈', pair:1, b:'「그리고」는 곱한다\n「또는」은 더한다\n두 일이 함께 일어나면 곱셈\n둘 중 하나면 덧셈', when:'문제 문장에서 「그리고」와 「또는」 중 어느 말이 쓰였는지 볼 때.', caution:'말은 읽었는데 손은 반대로 간다. 곱셈과 덧셈을 바꿔 쓰면 확률이 1을 넘거나 너무 작아진다.', example:'주사위가 짝수 그리고 동전이 앞면\n= 1/2 × 1/2 = 1/4\n주사위가 2 이하 또는 5 이상\n= 2/6 + 2/6 = 2/3'},
  {g:'중2', u:'경우의 수와 확률', f:'경우의 수 + 도형', pair:1, b:'주인공 — 경우의 수\n도구 — 도형\n도형의 개수를 묻는 것은\n꼭짓점을 고르는 문제다',
    when:'다각형의 대각선이나 삼각형의 개수를 셀 때', caution:'대각선은 이웃한 꼭짓점을 뺀 것이고, 삼각형은 세 점을 순서 없이 고르는 것이다', example:'육각형\n대각선 = 6×3 ÷ 2 = 9개\n삼각형 = 6×5×4 ÷ 6 = 20개'},
  {g:'중2', u:'경우의 수와 확률', f:'확률 + 도형', pair:1, b:'주인공 — 확률\n도구 — 도형을 세는 경우의 수\n도형의 개수의 비가 곧 확률',
    when:'만든 도형이 어떤 모양일 확률을 물을 때', caution:'분모는 만들 수 있는 모든 삼각형의 개수 / 정육각형에서 마주보는 두 꼭짓점을 잇는 긴 대각선을 한 변으로 잡으면 직각삼각형이 된다', example:'정육각형의 꼭짓점에서 세 점\n전체 = 6×5×4 ÷ 6 = 20개\n긴 대각선 3개 × 나머지 4점 = 12개\n확률 = 12/20 = 3/5'},

  {g:'중2', u:'활용 문제', f:'연립방정식 — 개수와 금액', b:'개수 식: x + y = (전체 개수)\n금액 식: (단가)x + (단가)y = (전체 금액)\n두 식을 연립한다',
    when:'"모두 몇 개", "합해서 얼마" 처럼 개수와 금액이 함께 주어질 때', caution:'x, y 가 각각 어느 물건인지 먼저 적어 둔다 — 금액 식에서 단가를 바꿔 곱하는 실수가 가장 많다', example:'500원 x개, 800원 y개, 10개에 6800원\nx+y=10, 500x+800y=6800 → x=4, y=6'},
  {g:'중2', u:'활용 문제', f:'연립방정식 — 거리·속력·시간', b:'거리 식: (구간1) + (구간2) = 전체 거리\n시간 식:\n(구간1 시간) + (구간2 시간) = 전체 시간',
    when:'"걷다가 뛰었다" 처럼 구간마다 속력이 다르고 전체 거리와 전체 시간이 함께 주어질 때', caution:'거리와 시간, 두 개의 식이 필요하다', example:'3km/h로 x km, 6km/h로 y km, 총 5km·1시간 30분\nx+y=5, x/3+y/6=3/2 → x=4, y=1'},
  {g:'중2', u:'활용 문제', f:'연립방정식 — 농도', b:'양의 식: x + y = (섞은 뒤의 양)\n소금의 식:\n(농도/100)x + (농도/100)y = (섞은 뒤의 소금)',
    when:'"두 소금물을 섞었더니 …%가 되었다" 처럼 섞은 뒤의 양까지 주어질 때', caution:'섞은 뒤의 소금의 양을 먼저 구해 놓고 시작한다', example:'4% xg + 10% yg = 6% 300g\nx+y=300, 0.04x+0.1y=18 → x=200, y=100'},
  {g:'중2', u:'활용 문제', f:'연립방정식 — 증가와 감소', b:'작년 값을 x, y 로 놓는다\n작년 식: x + y = (작년 전체)\n변화 식: (증가율)x - (감소율)y = (전체 변화량)',
    when:'"작년보다 몇 % 늘고 줄어 전체가 몇 명 변했다" 가 나올 때', caution:'묻는 것이 작년 값인지 올해 값인지 반드시 확인한다', example:'작년 600명, 남 10% 증가·여 5% 감소로 15명 늘어남\nx+y=600, 0.1x-0.05y=15 → 작년 남 300명'},
  {g:'중2', u:'활용 문제', f:'일차부등식 — 최대 개수', b:'(쓰는 돈) ≤ (가진 돈)\n으로 부등식을 세운다\n개수는 자연수이므로\n답은 부등식을 만족하는 가장 큰 자연수',
    when:'"최대 몇 개까지 살 수 있는가" 처럼 가진 돈이 정해져 있을 때', caution:'최대 개수는 버림 (반올림 아님) / 반대로 최소 몇 개 유형은 올림', example:'1200원짜리를 20000원으로\n1200x ≤ 20000 → x ≤ 16.66… → 16개'},
  {g:'중2', u:'활용 문제', f:'일차부등식 — 어느 쪽이 유리한가', b:'두 경우의 비용을 각각 식으로 쓰고\n(A의 비용) > (B의 비용)\n으로 부등식을 세운다',
    when:'"몇 번 이상이면 …가 유리한가" 처럼 두 요금제를 비교할 때', caution:'등호가 있으면 같아지는 지점이고, 유리해지는 것은 그다음부터', example:'1회 5000원 vs 회원권 20000원+1회 1000원\n5000x > 20000+1000x → x > 5 → 6회부터'},
  {g:'중2', u:'활용 문제', f:'일차함수 — 변화율', b:'y = (처음 값) + (1단위마다 변하는 양) × x\n기울기 = 변화율\ny절편 = 처음 값',
    when:'"1분마다 3°C씩 오른다" 처럼 일정하게 변하는 양이 주어질 때', caution:'줄어들면 기울기가 음수', example:'20°C에서 1분마다 3°C씩 오름\ny = 3x + 20 → 10분 후 50°C'},
  {g:'중2', u:'활용 문제', f:'일차함수 — 점이 움직일 때의 넓이', b:'움직인 시간(거리)을 x로 놓고\n변하는 변의 길이를 x로 나타낸 뒤\n삼각형의 넓이 = ½ × 밑변 × 높이', shape:'rect',
    when:'"점 P가 초속 1로 움직인다" 처럼 시간에 따라 넓이가 변할 때', caution:'P가 어느 변 위에 있는지에 따라 식이 달라진다 — 구간을 나눈다', example:'∠B=90°, BC=10, AB=6, P가 B→C로 초속 1\nBP = x 이므로 △ABP = ½ × x × 6 = 3x\n(0 < x ≤ 10)'},
  {g:'중2', u:'활용 문제', f:'닮음 — 그림자와 축도', s:2, b:'같은 시각의 그림자는 서로 닮음\n(실제 높이) : (그림자 길이) 가 같다\n축척 = (도면의 길이) ÷ (실제 길이)', shape:'simRatio',

  {g:'중2', u:'활용 문제', f:'평행선 비 — 사다리꼴', s:2, b:'AD ∥ EF ∥ BC 이고 AE : EB = m : n 이면\nEF = (n × AD + m × BC) ÷ (m + n)', shape:'trapMid',

  {g:'중2', u:'활용 문제', f:'무게중심 — 넓이 구하기', s:2, b:'세 중선이 나눈 6개의 삼각형은\n넓이가 모두 같다 (각각 1/6)\n중선 하나로 나눈 삼각형은 1/2\n△GBC = 1/3', shape:'centroid',
    when:'"무게중심 G" 와 색칠한 부분의 넓이가 함께 나올 때', caution:'작은 삼각형 몇 개로 이루어졌는지 세는 것이 핵심', example:'△ABC 넓이 48\n작은 삼각형 하나 = 8, △GBC = 16'},
  {g:'중2', u:'활용 문제', f:'피타고라스 — 직육면체의 대각선', s:2, b:'가로 a, 세로 b, 높이 c 인 직육면체\n대각선² = a² + b² + c²', shape:'cuboid',
    when:'"상자 안에 넣을 수 있는 가장 긴 막대" 가 나올 때', caution:'밑면의 대각선을 먼저 구하고 다시 피타고라스 정리를 쓰면 나오는 식', example:'3, 4, 12인 직육면체\n대각선² = 9+16+144 = 169 → 13'},
  {g:'중2', u:'활용 문제', f:'피타고라스 — 겉면의 최단 거리', s:2, b:'입체도형의 겉면을 따라가는 최단 거리는\n전개도를 그려 직선으로 이은 길이\n= 피타고라스 정리로 구한다', shape:'prism',
    when:'"겉면을 따라 실을 감을 때 가장 짧은 길이" 가 나올 때', caution:'반드시 전개도를 펼쳐서 직선으로 이어야 한다', example:'전개도에서 가로 8, 세로 6인 직각삼각형\n최단 거리 = √(64+36) = 10'},
  {g:'중2', u:'활용 문제', f:'피타고라스 — 접은 도형', s:2, b:'접힌 부분과 원래 부분은 합동\n→ 대응변의 길이가 같다\n겹친 부분을 x로 놓고\n직각삼각형에서 피타고라스 정리', shape:'rightTriangle',
    when:'"종이를 접었다", "포개었다" 가 나올 때', caution:'접기 전과 후에 길이가 같은 변을 먼저 찾아 표시한다', example:'세로 8인 직사각형을 접어 x, 8-x, 4가 직각삼각형\nx² = (8-x)² + 4² → x = 5'},
  {g:'중2', u:'활용 문제', f:'확률 — 적어도', s:2, b:'(적어도 하나는 …일 확률)\n= 1 - (하나도 …이 아닐 확률)',
    when:'"적어도 하나는" 이라는 말이 나올 때', caution:'직접 세면 경우가 너무 많다 — 하나도 …이 아닐 확률을 1에서 빼는 것이 훨씬 빠르다', example:'동전 3개 중 적어도 하나 앞면\n1 - (1/2)³ = 7/8'},
  {g:'중2', u:'활용 문제', f:'무엇과 섞였는지 알아보는 신호', pair:1, b:'도형 안에 미지수가 있다 → 방정식\n넓이·부피가 조건이다 → 차수가 올라간다\n좌표평면 위의 도형이다 → 함수\n개수를 묻는다 → 경우의 수',
    when:'무슨 단원 문제인지 모르겠을 때 가장 먼저 보는 카드', caution:'자주 섞이는 네 가지 / 「이건 무슨 단원이야?」가 아니라 「뭐가 미지수야? 뭘 세라는 거야?」를 먼저 묻게 하는 카드다', example:'삼각형의 넓이가 24이고\n밑변 x, 높이 x+2\n→ 넓이가 조건이므로\nx에 대한 식의 차수가 올라간다'},

  /* ── 더올림 심화 (교과 과정 밖) ── */
  {g:'중2', u:'더올림 심화', f:'삼각형의 외각의 이등분선', s:2, adv:1, b:'∠A의 외각의 이등분선이\nBC의 연장선과 만나는 점을 D라 하면\nAB : AC = BD : CD', shape:'angleBisector',

  {g:'중2', u:'더올림 심화', f:'중선 정리 (파포스 정리)', s:2, adv:1, b:'△ABC에서 M이 BC의 중점이면\nAB² + AC² = 2(AM² + BM²)',
    when:'중선의 길이를 구하거나 두 변의 제곱의 합을 다룰 때', caution:'피타고라스 정리를 두 번 써서 유도된다 — 서술형에서 유도 과정을 묻기도 한다', example:'AB=7, AC=9, BC=8 → BM=4\n49 + 81 = 2(AM² + 16)\nAM² = 49 → AM = 7'},
  {g:'중2', u:'더올림 심화', f:'피타고라스 수 만들기', s:2, adv:1, b:'m > n 인 자연수 m, n 에 대하여\n(m² - n²,  2mn,  m² + n²)\n는 항상 피타고라스 수', shape:'rightTriangle',
    when:'피타고라스 수를 직접 만들어야 할 때', caution:'m, n이 서로소이고 하나가 짝수일 때 기본 피타고라스 수가 나온다', example:'m=2, n=1 → (3, 4, 5)\nm=3, n=2 → (5, 12, 13)\nm=4, n=1 → (15, 8, 17)'},
  {g:'중2', u:'더올림 심화', f:'수심 — 세 수선이 만나는 점', adv:1, b:'세 꼭짓점에서 마주보는 변에 내린 수선은\n한 점에서 만난다\n이 점을 수심이라 한다',
    when:'세 수선이 한 점에서 만나는 그림을 만났을 때', caution:'예각삼각형이면 안쪽, 직각삼각형이면 직각인 꼭짓점, 둔각삼각형이면 바깥에 생긴다 / 교과서에 이름이 없을 뿐 문제에는 나온다', example:'∠A = 50°인 예각삼각형의 수심 H\n∠BHC = 180° - ∠A\n= 180 - 50 = 130°'},
  {g:'중2', u:'더올림 심화', f:'방심 — 외각의 이등분선이 만나는 점', adv:1, b:'∠B와 ∠C의 외각의 이등분선,\n∠A의 내각의 이등분선이 만나는 점\n이 점을 방심이라 한다',
    when:'외각의 이등분선 두 개가 만나는 문제를 만났을 때', caution:'삼각형 바깥에 있고 세 개가 있다 / 내심의 90° + ½∠A 와 부호만 반대다 — 이 대비가 전부', example:'∠A = 50°일 때 방심 J\n∠BJC = 90° - ½∠A\n= 90 - 25 = 65°'},
  {g:'중2', u:'더올림 심화', f:'오심의 각 — 한 표로', adv:1, b:'∠BXC 는\n외심 2∠A\n내심 90° + ½∠A\n방심 90° - ½∠A\n수심 180° - ∠A',
    when:'외심·내심·방심·수심의 각을 한꺼번에 정리할 때', caution:'∠A 하나로 네 개가 전부 나온다 / 내심의 각과 방심의 각을 더하면 180°', example:'∠A = 40°일 때\n외심 80°, 내심 110°\n방심 70°, 수심 140°'},
  {g:'중2', u:'더올림 심화', f:'무게중심이 나눈 여섯 조각', adv:1, b:'세 중선이 삼각형을 나눈\n여섯 조각의 넓이는 모두 같다\n한 조각 = 전체의 1/6',
    when:'무게중심으로 나뉜 부분의 넓이를 구할 때', caution:'중선 하나가 넓이를 이등분한다는 것에서 출발한다', example:'넓이가 30인 삼각형\n한 조각의 넓이 = 30 ÷ 6 = 5'},

  /* ═══ 중3 — 제곱근·실수, 곱셈공식·인수분해, 이차방정식·이차함수, 삼각비, 원의 성질, 통계 ═══ */
  {g:'중3', u:'제곱근과 실수', f:'제곱근과 실수', def:'제곱근: 제곱하여 그 수가 되는 값 / 실수: 유리수와 무리수를 통틀어 이르는 수', props:['양수의 제곱근은 양수·음수 2개, 0의 제곱근은 0 하나, 음수의 제곱근은 없다','근호(√)는 제곱근을 나타내는 기호로, a>0일 때 √a는 a의 양의 제곱근을 뜻한다 (√0 = 0)','무리수는 순환하지 않는 무한소수로 나타난다']},
  {g:'중3', u:'제곱근과 실수', f:'제곱근의 성질', b:'(√a)² = a,  (-√a)² = a\n√a² = |a|',
    when:'제곱근이 있는 식을 계산하거나 간단히 할 때', caution:'√a² = a 가 아니라 |a| — a가 음수일 수 있다', example:'√(-3)² → |-3| = 3'},
  {g:'중3', u:'제곱근과 실수', f:'제곱근의 곱셈·나눗셈', b:'√a × √b = √(ab)\n√a ÷ √b = √(a/b)\na√b 꼴로 정리한다  (a > 0, b > 0)',
    when:'근호끼리 곱하거나 나눌 때', caution:'근호 밖의 수끼리, 근호 안의 수끼리 따로 계산', example:'2√3 × 3√2 → 6√6'},
  {g:'중3', u:'제곱근과 실수', f:'제곱근의 덧셈·뺄셈', b:'근호 안의 수가 같은 것끼리만 더하고 뺀다\n(동류항 계산과 같다)',
    when:'√가 섞인 식을 간단히 할 때', caution:'√2 + √3 은 √5 가 아니다 — 근호 안이 다르면 합칠 수 없다', example:'2√3 + 3√3 = 5√3'},
  {g:'중3', u:'제곱근과 실수', f:'분모의 유리화', b:'1 / √a = √a / a\nb / √a = b√a / a\n1 / (√a + √b) = (√a - √b) / (a - b)',
    when:'분모에 근호가 있는 식을 정리할 때', caution:'분모가 두 항이면 부호를 바꾼 식(켤레)을 분모·분자에 곱한다', example:'1/(√3+1) → (√3-1)/2'},
  {g:'중3', u:'제곱근과 실수', f:'제곱근의 대소 관계', b:'a > 0, b > 0 일 때\na < b 이면 √a < √b\n√a < √b 이면 a < b',
    when:'근호가 있는 수의 크기를 비교할 때', caution:'근호 밖의 수는 제곱해서 안으로 넣고 비교한다 (2√3 = √12)', example:'3 과 √8 → √9 > √8 이므로 3이 크다'},
  {g:'중3', u:'제곱근과 실수', f:'√A 가 자연수가 되는 조건', b:'A를 소인수분해했을 때\n모든 소인수의 지수가 짝수가 되도록 곱한다',
    when:'√(24x) 처럼 근호를 벗기는 최소 자연수 x를 구할 때', caution:'지수가 홀수인 소인수만 곱하면 된다', example:'√(24x) → 24 = 2³×3 → x = 2×3 = 6'},
  {g:'중3', u:'제곱근과 실수', f:'√(a²) = |a|', b:'√(a²) = |a|\na ≥ 0 이면 a\na < 0 이면 -a',
    when:'근호 안이 완전제곱식일 때 근호를 벗길 때', caution:'그냥 a로 벗기면 안 된다 — 범위를 보고 부호를 정하는 단계가 하나 더 있다', example:'2 < x < 5 일 때\n√(x²-4x+4) + √(x²-10x+25)\n= |x-2| + |x-5|\n= (x-2) + (5-x) = 3'},
  {g:'중3', u:'제곱근과 실수', f:'자주 틀리는 짝 — a의 제곱근과 루트 a', pair:1, b:'「a의 제곱근」 — 두 개다\n「루트 a」 — 양수 하나다\n16의 제곱근은 +4와 -4\n루트 16은 4 하나', when:'제곱근을 구하라는 문제에서 답을 하나로 쓸지 두 개로 쓸지 정할 때.', caution:'말의 순서만 다른데 답의 개수가 달라진다. 「제곱근」이 앞말이면 두 개, 루트 기호가 붙어 있으면 하나다.', example:'16의 제곱근은 +4와 -4.\n루트 16 = 4.\n9의 제곱근은 +3과 -3, 루트 9 = 3.'},
  {g:'중3', u:'제곱근과 실수', f:'제곱근 + 피타고라스', pair:1, b:'주인공 — 피타고라스 정리\n도구 — 제곱근\n길이가 무리수로 나오면\n근호를 간단히 하는 것까지가 답',
    when:'직각삼각형의 변의 길이가 근호로 나올 때', caution:'√18 처럼 나오면 3√2 로 정리해야 끝난다 — 근호 안에 제곱인수를 남기지 않는다', example:'가로 3, 세로 3인 직사각형의 대각선\n= √(9+9) = √18 = 3√2\n한 변 1인 정사각형의 대각선 = √2'},
  {g:'중3', u:'제곱근과 실수', f:'제곱근 + 부등식', pair:1, b:'주인공 — 부등식\n도구 — 제곱근\n근호는 양변을 제곱해서 벗긴다',
    when:'근호가 들어간 부등식의 범위를 구할 때', caution:'양변이 모두 0 이상일 때만 제곱해도 부등호가 그대로다', example:'3 < √n < 4\n9 < n < 16\nn = 10, 11, 12, 13, 14, 15 → 6개'},

  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해', def:'다항식을 두 개 이상의 다항식의 곱으로 나타내는 것', props:['전개의 반대 과정이다','인수분해는 공통인수로 묶는 것부터 확인한다']},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 완전제곱식', b:'(a ± b)² = a² ± 2ab + b²',

  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 합차공식', b:'(a+b)(a-b) = a² - b²',
    when:'(a+b)(a-b) 꼴을 전개할 때', caution:'가운데 항이 사라지고 제곱의 차만 남는다', example:'(x+2)(x-2) → x²-4'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 일차식의 곱', b:'(x+a)(x+b) = x² + (a+b)x + ab',
    when:'(x+a)(x+b) 꼴을 전개할 때', caution:'가운데 항은 a+b, 상수항은 a×b', example:'(x+2)(x+3) → x²+5x+6'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 계수가 있는 일차식의 곱', b:'(ax+b)(cx+d) = acx² + (ad+bc)x + bd',
    when:'x의 계수가 1이 아닌 두 일차식을 곱할 때', caution:'가운데 항은 바깥끼리·안쪽끼리 곱해서 더한다', example:'(2x+1)(3x+2) → 6x²+7x+2'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 세 항의 제곱', adv:1, b:'(a+b+c)² = a²+b²+c²+2ab+2bc+2ca',
    when:'(a+b+c)² 꼴을 전개할 때', caution:'제곱 3개 + 서로 곱한 것 2배씩 3쌍 / 고1 「다항식」에서 정식으로 배운다', example:'(x+y+1)² → x²+y²+1+2xy+2y+2x'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 세제곱의 합', adv:1, b:'a³+b³ = (a+b)(a²-ab+b²)',
    when:'a³+b³을 인수분해하거나 전개할 때', caution:'가운데 부호가 -ab로 바뀐다는 점 주의 / 고1 「다항식」에서 정식으로 배운다', example:'x³+8 → (x+2)(x²-2x+4)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'곱셈공식 — 세제곱의 차', adv:1, b:'a³-b³ = (a-b)(a²+ab+b²)',
    when:'a³-b³을 인수분해하거나 전개할 때', caution:'가운데 부호가 +ab로 바뀐다는 점 주의 / 고1 「다항식」에서 정식으로 배운다', example:'x³-8 → (x-2)(x²+2x+4)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 공통인수', b:'ma + mb + mc = m(a+b+c)\n먼저 공통인수부터 묶는다',
    when:'모든 항에 공통으로 들어있는 문자·수를 뺄 때', caution:'인수분해에서 가장 먼저 확인해야 하는 기본 단계', example:'2x²+4x → 2x(x+2)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 완전제곱식', b:'a² ± 2ab + b² = (a ± b)²',
    when:'a²±2ab+b² 꼴을 곱의 형태로 바꿀 때', caution:'가운데 항이 2×(첫항)×(둘째항)인지 확인', example:'x²+6x+9 → (x+3)²'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 합차공식', b:'a² - b² = (a+b)(a-b)',
    when:'a²-b² 꼴을 곱의 형태로 바꿀 때', caution:'두 항 모두 제곱 꼴이어야 적용 가능', example:'x²-9 → (x+3)(x-3)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — x² + (a+b)x + ab', b:'x² + (a+b)x + ab = (x+a)(x+b)\n곱해서 상수항,\n더해서 x의 계수가 되는 두 수를 찾는다',
    when:'x²의 계수가 1인 이차식을 인수분해할 때', caution:'곱이 먼저, 합이 나중 — 부호까지 맞는 짝을 찾는다', example:'x²-5x+6 → (x-2)(x-3)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 십자 곱셈법', b:'acx² + (ad+bc)x + bd = (ax+b)(cx+d)\n세로로 나누어 대각선으로 곱해 더한다',
    when:'x²의 계수가 1이 아닌 이차식을 인수분해할 때', caution:'대각선으로 곱한 두 값의 합이 가운데 항과 같아야 한다', example:'6x²+7x+2 → (2x+1)(3x+2)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 치환', b:'반복되는 부분을 한 문자로\n바꿔서 인수분해한 뒤 되돌린다',
    when:'같은 식이 반복될 때 복잡한 식을 간단히 만들 때', caution:'치환 후 인수분해하고 원래 문자로 꼭 되돌리기', example:'(x+1)²-5(x+1)+6 → t=x+1로 치환'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 — 항이 4개일 때', b:'① 2개씩 둘로 묶어 공통인수\n② 3개를 완전제곱으로 묶고 나머지와 합차공식\n③ 차수가 낮은 문자로 정리',
    when:'항이 4개라 공식이 바로 보이지 않을 때', caution:'문자가 두 개면 차수가 낮은 쪽으로 정리한다 — 고등에서 문자가 늘어난 인수분해는 전부 이 원칙이다', example:'x² + xy + 2x + 2y\n= y(x+2) + x(x+2)\n= (x+2)(x+y)'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'순서 — 인수분해는 무엇부터', pair:1, b:'1 공통인수 먼저\n2 공식에 맞는지 본다\n3 십자 곱셈\n4 항이 네 개면 묶기\n5 복잡하면 치환', when:'인수분해하라는 식을 보고 어느 방법을 꺼낼지 정할 때.', caution:'공통인수를 지나치고 공식부터 찾는다. 공통인수를 먼저 빼면 남는 식이 훨씬 쉬워진다.', example:'2x^2 - 8 = 2(x^2 - 4)\n= 2(x+2)(x-2)\n공통인수 2를 먼저 빼야 보인다.'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 + 도형', pair:1, b:'주인공 — 도형\n도구 — 인수분해\n넓이가 이차식이면\n인수분해한 두 인수가 가로와 세로',
    when:'넓이나 부피가 다항식으로 주어졌을 때', caution:'길이는 양수 — 인수 중 음수가 되는 것은 답이 될 수 없다', example:'넓이가 x² + 5x + 6 인 직사각형\n= (x+2)(x+3)\n가로 x+2, 세로 x+3'},
  {g:'중3', u:'곱셈공식과 인수분해', f:'인수분해 + 소인수분해', pair:1, b:'주인공 — 소인수분해\n도구 — 인수분해 공식\n큰 수는 공식으로 먼저 쪼갠다',
    when:'2²⁰ - 1 처럼 큰 수의 약수를 찾을 때', caution:'중1 소인수분해가 중3 인수분해와 만나는 자리 — 계산기로 나누지 말고 합차공식을 먼저 쓴다', example:'2²⁰ - 1 = (2¹⁰-1)(2¹⁰+1)\n= 1023 × 1025\n= (3×11×31) × (5²×41)'},

  {g:'중3', u:'이차방정식', f:'이차방정식과 이차함수', def:'이차방정식: ax²+bx+c=0(a≠0) 꼴의 방정식 / 이차함수: y=ax²+bx+c(a≠0) 꼴의 함수', props:['이차함수의 그래프는 포물선이다','이차방정식의 해는 이차함수의 그래프가 x축과 만나는 점의 x좌표이다']},
  {g:'중3', u:'이차방정식', f:'이차방정식 — 인수분해로 풀기', b:'AB = 0 이면 A = 0 또는 B = 0\n(x-a)(x-b) = 0 → x = a 또는 x = b',
    when:'좌변이 인수분해되는 이차방정식을 풀 때', caution:'반드시 우변을 0으로 만든 뒤 인수분해한다', example:'x²-5x+6=0 → (x-2)(x-3)=0 → x=2 또는 3'},
  {g:'중3', u:'이차방정식', f:'이차방정식 — 제곱근으로 풀기', b:'(x + p)² = q  (q ≥ 0) 이면\nx = -p ± √q',
    when:'완전제곱식 꼴로 정리되는 이차방정식을 풀 때', caution:'± 를 빠뜨리면 근을 하나 잃는다', example:'(x-2)² = 5 → x = 2 ± √5'},
  {g:'중3', u:'이차방정식', f:'이차방정식의 근의 공식', b:'x = (-b ± √(b²-4ac)) / 2a',
    when:'인수분해가 안 되는 이차방정식을 풀 때', caution:'근호 안 b²-4ac 가 음수면 실근이 없다 (판별식이라는 이름은 고등학교에서 배운다)', example:'x²+3x+1=0 → x=(-3±√5)/2'},
  {g:'중3', u:'이차방정식', f:'근의 공식 — 짝수 공식', b:'b = 2b′ 일 때 (x의 계수가 짝수)\nx = (-b′ ± √(b′² - ac)) / a',
    when:'x의 계수가 짝수인 이차방정식을 빠르게 풀 때', caution:'b′은 b의 절반 — 약분 실수를 줄여준다', example:'x²+4x+1=0 → b′=2 → x = -2±√3'},
  {g:'중3', u:'이차방정식', f:'이차방정식의 근의 개수', b:'b² - 4ac > 0 → 서로 다른 두 근\nb² - 4ac = 0 → 중근 (한 근)\nb² - 4ac < 0 → 실근이 없다',
    when:'근을 직접 구하지 않고 개수만 판단할 때', caution:'중근 조건 b²-4ac=0 은 완전제곱식이 된다는 뜻', example:'x²-4x+4=0 → 16-16=0 → 중근 x=2'},
  {g:'중3', u:'이차방정식', f:'순서 — 이차방정식은 무엇부터', pair:1, b:'1 =0 꼴로 정리한다\n2 인수분해가 되나 본다\n3 완전제곱으로 되나 본다\n4 안 되면 근의 공식', when:'이차방정식을 풀기 시작할 때 어느 방법으로 갈지 정할 때.', caution:'정리하지 않은 채 인수분해를 시도한다. 오른쪽에 항이 남아 있으면 곱이 0이라는 근거가 사라진다.', example:'x^2 = 5x - 6 → x^2 - 5x + 6 = 0\n(x-2)(x-3) = 0\nx = 2 또는 x = 3'},
  {g:'중3', u:'이차방정식', f:'닮음 + 이차방정식', pair:1, b:'주인공 — 이차방정식\n도구 — 닮음\n닮음에서 나온 비례식이\n곱으로 바뀌면 이차방정식이 된다',
    when:'직각삼각형의 수선에서 길이를 미지수로 놓을 때', caution:'AH² = BH × HC 가 곱이라서, 미지수를 넣는 순간 이차가 된다 / 길이는 양수이므로 음의 근은 버린다', example:'∠A=90°, H는 A에서 BC에 내린 수선의 발\nBH = x, HC = x+5, AH = 6\n36 = x(x+5) → x²+5x-36 = 0 → x = 4'},
  {g:'중3', u:'이차방정식', f:'이차방정식 + 확률', pair:1, b:'주인공 — 확률\n도구 — 실근을 가질 조건\n조건을 식으로 세운 뒤\n그 조건을 만족하는 경우를 센다',
    when:'주사위 눈을 계수로 하는 방정식의 근을 물을 때', caution:'x² + px + q = 0 이 실근을 가질 조건은 p² - 4q ≥ 0 / 조건을 세우고 나면 그냥 세는 문제가 된다', example:'두 눈 a, b로 x² + ax + b = 0\n실근 조건 a² ≥ 4b\na=2:1, a=3:2, a=4:4, a=5:6, a=6:6\n합 19 → 확률 19/36'},

  {g:'중3', u:'이차함수', f:'y = ax² 의 그래프', b:'꼭짓점 (0, 0),  축은 y축 (x = 0)\na > 0 → 아래로 볼록,  a < 0 → 위로 볼록\n|a|가 클수록 폭이 좁다', shape:'parabola',
    when:'가장 기본이 되는 이차함수의 그래프를 그릴 때', caution:'a의 부호는 볼록한 방향, a의 절댓값은 폭을 결정한다', example:'y=2x² 는 y=x² 보다 폭이 좁다'},
  {g:'중3', u:'이차함수', f:'이차함수의 평행이동', b:'y = a(x - p)² + q\nx축 방향으로 p, y축 방향으로 q 만큼 평행이동', shape:'parabola',
    when:'y=ax² 를 옮긴 그래프의 식을 세울 때', caution:'x축 방향 이동은 괄호 안에 반대 부호로 들어간다', example:'오른쪽 2, 위로 3 → y = a(x-2)²+3'},
  {g:'중3', u:'이차함수', f:'이차함수의 꼭짓점', b:'y = a(x-p)² + q 의 꼭짓점은 (p, q)', shape:'parabola',
    when:'이차함수 그래프의 꼭짓점 좌표를 구할 때', caution:'p의 부호에 주의(x-p이므로 +p가 아니라 p)', example:'y=(x-2)²+3 → 꼭짓점(2,3)'},
  {g:'중3', u:'이차함수', f:'이차함수의 축', b:'축의 방정식은 x = p', shape:'parabola',
    when:'이차함수 그래프의 대칭축을 구할 때', caution:'축은 항상 꼭짓점을 지나는 세로선', example:'y=(x-2)²+3 → 축 x=2'},
  {g:'중3', u:'이차함수', f:'일반형에서 꼭짓점 구하기', shape:'parabolaVertex', b:'y = ax² + bx + c 의\n축: x = -b / 2a\n꼭짓점의 y좌표: x = -b/2a 를 대입한 값',
    when:'표준형으로 고치지 않고 꼭짓점을 바로 구할 때', caution:'-b/2a 는 축의 방정식이면서 꼭짓점의 x좌표', example:'y=x²-4x+1 → 축 x=2, 꼭짓점 (2,-3)'},
  {g:'중3', u:'이차함수', f:'이차함수의 최댓값·최솟값', shape:'parabolaMinMax', b:'a > 0 → 꼭짓점에서 최솟값 q (최댓값 없음)\na < 0 → 꼭짓점에서 최댓값 q (최솟값 없음)',
    when:'이차함수의 최대·최소를 물을 때', caution:'범위 제한이 없으면 한쪽은 존재하지 않는다', example:'y=(x-1)²+2 → 최솟값 2'},
  {g:'중3', u:'이차함수', f:'이차함수와 x축의 교점', shape:'parabolaRoots', b:'y = ax²+bx+c 가 x축과 만나는 점의 x좌표\n= 이차방정식 ax²+bx+c = 0 의 해\nb²-4ac > 0 → 두 점에서 만남\n= 0 → 한 점(접함)\n< 0 → 만나지 않음',
    when:'그래프와 x축의 위치 관계를 판단할 때', caution:'x축과 만나는 점 = y = 0 인 점', example:'y=x²-4 → x축과 (-2,0),(2,0)에서 만남'},
  {g:'중3', u:'이차함수', f:'이차함수 + 도형의 넓이', pair:1, b:'주인공 — 넓이\n도구 — 이차함수의 그래프\n교점의 좌표를 구하면\n밑변과 높이가 나온다',
    when:'그래프와 축으로 둘러싸인 도형의 넓이를 구할 때', caution:'좌표의 차이가 길이다 — 음수 좌표는 절댓값으로 길이를 잡는다', example:'y = x² - 4 와 x축의 두 교점\n(-2,0), (2,0), 꼭짓점 (0,-4)\n넓이 = ½ × 4 × 4 = 8'},
  {g:'중3', u:'이차함수', f:'이차함수 + 대칭', pair:1, b:'주인공 — 이차함수\n도구 — 대칭\nf(a) = f(b) 이면\n축은 x = (a+b) ÷ 2',
    when:'식을 모르는데 축이나 꼭짓점을 물을 때', caution:'식을 구하지 않고도 축을 아는 카드 — 시험에 자주 나온다', example:'f(1) = f(5) 인 이차함수\n축은 x = (1+5) ÷ 2 = 3'},
  {g:'중3', u:'이차함수', f:'이차함수 + 좌표', pair:1, b:'주인공 — 이차함수\n도구 — 좌표\ny = x² 위의 두 점을 지나는\n직선의 기울기는 두 x좌표의 합',
    when:'포물선 위의 두 점을 지나는 직선의 기울기를 볼 때', caution:'기울기 = (b² - a²) ÷ (b - a) = a + b — 합차공식이 그대로 쓰인다', example:'y = x² 위의 (1,1), (3,9)\n기울기 = (9-1) ÷ (3-1) = 4\n= 1 + 3'},

  {g:'중3', u:'삼각비', f:'삼각비의 뜻', def:'직각삼각형에서 한 예각의 크기에 따라 정해지는 변의 길이의 비(sin, cos, tan)', shape:'trigRatio', props:['직각삼각형의 크기(닮음)와 관계없이 각의 크기만으로 정해진다','기준이 되는 각은 직각이 아닌 예각이어야 한다'],
    when:'직각삼각형에서 세 삼각비를 모두 구할 때', caution:'기준각이 바뀌면 세 값이 전부 바뀐다 — 이 단원 오답의 절반이 기준각을 놓쳐서 나온다', example:'∠C=90°, AB=13, BC=5 → AC=12\nsin A=5/13, cos A=12/13, tan A=5/12'},
  {g:'중3', u:'삼각비', f:'삼각비', b:'sin A = 높이 ÷ 빗변  (높이 = ∠A의 대변)\ncos A = 밑변 ÷ 빗변  (밑변 = ∠A에 이웃한 변)\ntan A = 높이 ÷ 밑변', shape:'trigRatio',
    when:'직각삼각형의 변의 길이나 각을 구할 때', caution:'높이·밑변은 기준각 A를 기준으로 정한다 — 각이 바뀌면 높이와 밑변도 바뀐다', example:'높이 3, 빗변 5\nsin A = 3/5'},
  {g:'중3', u:'삼각비', f:'특수각의 삼각비', b:'sin 30°=1/2, sin 45°=√2/2, sin 60°=√3/2\ncos 30°=√3/2, cos 45°=√2/2, cos 60°=1/2\ntan 30°=√3/3, tan 45°=1, tan 60°=√3',
    when:'30°·45°·60°가 들어간 식의 값을 구할 때 (반드시 외울 것)', caution:'sin은 30→45→60 순으로 커지고, cos은 정확히 그 반대 순서 / 고등 「삼각함수」에서 이 세 각이 계속 기준이 된다', example:'sin60° × cos30° - tan45°\n= (√3/2)(√3/2) - 1 = 3/4 - 1 = -1/4'},
  {g:'중3', u:'삼각비', f:'0°와 90°의 삼각비', b:'sin 0°=0, cos 0°=1, tan 0°=0\nsin 90°=1, cos 90°=0\ntan 90°은 정할 수 없다',
    when:'각이 0°나 90°일 때의 값을 물을 때', caution:'tan 90°만 값이 없다 — 분모가 0이 되기 때문', example:'sin0° + cos0° + sin90° + cos90°\n= 0 + 1 + 1 + 0 = 2'},
  {g:'중3', u:'삼각비', f:'삼각비 값의 변화', b:'A가 0°에서 90°로 커질 때\nsin A: 0 → 1 로 증가\ncos A: 1 → 0 으로 감소\ntan A: 0 에서 한없이 커진다',
    when:'두 삼각비 값의 크기를 비교할 때', caution:'45°가 판단 기준 — 45°보다 작으면 cos이 크고, 크면 sin이 크다 / tan45°=1 이고 그 뒤로 급격히 커진다', example:'sin35° 와 cos35° 중 큰 것은?\n35° < 45° 이므로 cos35° 가 크다'},
  {g:'중3', u:'삼각비', f:'사분원에서의 삼각비', b:'반지름이 1인 사분원에서\nsin A = (대변) ÷ 1 = 대변의 길이\ncos A = (밑변) ÷ 1 = 밑변의 길이', shape:'sector',
    when:'사분원 그림으로 예각의 삼각비 값을 읽을 때', caution:'빗변이 1이라서 분모가 사라지는 것이 이 그림의 전부 — 여기를 놓치면 그림만 외우게 된다', example:'반지름 1인 사분원에서\nsin55° = 그 각의 대변의 길이를 그대로 읽는다'},
  {g:'중3', u:'삼각비', f:'삼각비 사이의 관계', adv:1, b:'sin²A + cos²A = 1\ntan A = sin A ÷ cos A',
    when:'sin, cos 중 하나만 알고 나머지를 구할 때', caution:'sin²A 는 (sin A)² 를 줄여 쓴 것 / 고1 「다항식」에서 정식으로 배운다', example:'sin A = 3/5 → cos A = 4/5\ntan A = 3/4'},
  {g:'중3', u:'삼각비', f:'직각삼각형의 변의 길이', b:'빗변과 각을 알 때\n(대변) = (빗변) × sin A\n(이웃한 변) = (빗변) × cos A\n(대변) = (이웃한 변) × tan A', shape:'trigRatio',
    when:'직각삼각형에서 한 변과 한 각으로 다른 변을 구할 때', caution:'어느 변이 빗변인지를 먼저 정해야 sin을 쓸지 cos을 쓸지 결정된다', example:'∠B=90°, ∠A=30°, AC=10 (빗변)\nBC = 10 × sin30° = 5'},
  {g:'중3', u:'삼각비', f:'일반 삼각형에서 변의 길이', b:'직각삼각형이 아니면\n한 꼭짓점에서 수선을 그어\n직각삼각형 두 개로 나눈 뒤 삼각비를 쓴다',
    when:'직각이 없는 삼각형에서 변의 길이를 구할 때', caution:'수선을 긋는 것이 이 유형의 전부 / 고등 「코사인법칙」이 이 과정을 한 줄로 줄인 것이다', example:'AB=8, ∠B=60°, BC=5\nBH = 8cos60° = 4, HC = 5 - 4 = 1\nAH = 8sin60° = 4√3 → AH² = 48\nAC = √(48+1) = √49 = 7'},
  {g:'중3', u:'삼각비', f:'삼각비의 활용 — 높이', b:'꼭짓점 A에서 BC에 수선 AH를 내리고\n∠BAH = x, ∠CAH = y 라 하면\nH가 BC 위: h = a ÷ (tan x + tan y)\nH가 BC 밖: h = a ÷ (tan x - tan y)',
    when:'두 지점에서 올려본각을 재어 건물·산의 높이를 구할 때', caution:'x, y는 수선 AH와 이루는 각 / 한 지점만 주어지면 (높이) = (거리) × tan(올려본각) 으로 바로 구한다', example:'나무에서 20m 떨어진 곳에서 올려본각 30°\n높이 = 20 × tan30° = 20√3/3 m'},
  {g:'중3', u:'삼각비', f:'삼각형의 넓이', b:'S = ½ × a × b × sin C\nC가 둔각이면 sin(180° - C) 를 쓴다',
    when:'두 변의 길이와 그 끼인각을 알 때 넓이를 구할 때', caution:'반드시 두 변의 끼인각이어야 한다 — 끼인각이 아니면 이 식이 성립하지 않는다', example:'AB=6, BC=8, ∠B=150°\n½×6×8×sin150° = 24 × ½ = 12'},
  {g:'중3', u:'삼각비', f:'사각형의 넓이', b:'평행사변형(두 변 a, b, 끼인각 x)\nS = ab sin x\n사각형(대각선 p, q, 이루는 각 x)\nS = ½ pq sin x',
    when:'각이 주어진 사각형의 넓이를 구할 때', caution:'평행사변형은 변, 일반 사각형은 대각선으로 쓴다', example:'두 대각선 6, 8이 30°로 만남\n½ × 6 × 8 × ½ = 12'},
  {g:'중3', u:'삼각비', f:'90°-A의 삼각비', b:'sin(90° - A) = cos A\ncos(90° - A) = sin A\ntan(90° - A) = 1 ÷ tan A',
    when:'sin과 cos을 서로 바꿔 나타낼 때', caution:'두 각을 더하면 90° — 직각삼각형의 두 예각 사이의 관계다', example:'sin 50° = cos 40°\ncos 70° = sin 20°'},
  {g:'중3', u:'삼각비', f:'삼각비 + 이차방정식', pair:1, b:'주인공 — 이차방정식\n도구 — sin²A + cos²A = 1\n합을 주면 제곱해서 곱을 얻는다',
    when:'sinA + cosA 의 값만 주어졌을 때', caution:'제곱하면 2 sinA cosA 가 나온다 — 그 자리에 1을 대입하는 것이 전부', example:'sinA + cosA = 7/5\n1 + 2 sinA cosA = 49/25\nsinA cosA = 12/25\n(5t-3)(5t-4) = 0 → 3/5 와 4/5'},
  {g:'중3', u:'삼각비', f:'원의 성질 + 삼각비', pair:1, b:'주인공 — 삼각비\n도구 — 원의 성질\n원에 내접한 삼각형은\n지름을 그으면 직각삼각형이 생긴다',
    when:'원에 내접한 삼각형의 변을 구할 때', caution:'지름에 대한 원주각이 90° — 이 한 줄이 삼각비를 쓸 수 있게 만든다', example:'반지름 5인 원에 내접한 △ABC\nAB가 지름, ∠A = 30°\n∠ACB = 90°, AB = 10\nBC = 10 × sin30° = 5'},
  {g:'중3', u:'삼각비', f:'삼각비 + 좌표평면', pair:1, b:'주인공 — 좌표평면\n도구 — 삼각비\n직선의 기울기\n= tan(직선이 x축과 이루는 각)',
    when:'직선이 x축과 이루는 각을 물을 때', caution:'교과서가 잘 안 짚어주는 자리 — 중2 「기울기」와 중3 「삼각비」가 여기서 만난다 / 고등 「직선의 방정식」에서 계속 쓰인다', example:'기울기 1 → tanθ = 1 → 45°\n기울기 √3 → tanθ = √3 → 60°'},

  {g:'중3', u:'원의 성질', f:'현', def:'원 위의 두 점을 이은 선분', shape:'chord', props:['원의 중심을 지나는 현을 지름이라 하며, 가장 긴 현이다','호: 원 위의 두 점 사이의 곡선 부분','활꼴: 현과 호로 둘러싸인 도형'],
    when:'현·호·활꼴을 구분할 때', caution:'반지름 두 개와 현 하나가 늘 이등변삼각형을 만든다 — 원 문제의 출발점이다', example:'반지름 5인 원에서 가장 긴 현\n= 지름 = 10'},
  {g:'중3', u:'원의 성질', f:'현의 수직이등분선', b:'원의 중심에서 현에 내린 수선은\n그 현을 이등분한다\n(거꾸로 현의 수직이등분선은 중심을 지난다)', shape:'chord',
    when:'현의 길이나 중심에서 현까지의 거리를 구할 때', caution:'중심-현의 중점-현의 끝점이 직각삼각형을 이룬다 / 깨진 원판에서 두 현의 수직이등분선을 그으면 그 교점이 원의 중심', example:'반지름 5, 중심에서 현까지 3\n반현 = √(25-9) = 4 → 현의 길이 8'},
  {g:'중3', u:'원의 성질', f:'중심에서 현까지의 거리', b:'한 원(또는 합동인 두 원)에서\n길이가 같은 두 현은 중심에서 같은 거리에 있다\n중심에서 같은 거리에 있는 두 현은 길이가 같다', shape:'chord',
    when:'두 현의 길이나 중심까지의 거리를 비교할 때', caution:'양쪽 다 성립한다(역도 성립) / 중심에 가까울수록 현이 길다', example:'중심까지의 거리가 같은 두 현 AB, CD\nAB = 10 → CD = 10'},
  {g:'중3', u:'원의 성질', f:'원과 접선의 성질', b:'접선은 그 접점을 지나는\n반지름과 서로 수직이다', shape:'tangent',
    when:'원의 접선과 관련된 각·길이를 구할 때', caution:'수직이라는 사실을 알아야 피타고라스 정리를 꺼낼 수 있다 / 고등 「원의 방정식」의 접선에서 그대로 쓰인다', example:'반지름 5, OP = 13\n∠OTP = 90° → PT = √(169-25) = 12'},
  {g:'중3', u:'원의 성질', f:'접선의 길이', b:'원 밖의 한 점 P에서 그은 두 접선의 길이는 같다\nPA = PB', shape:'tangent',
    when:'원 밖의 점에서 그은 두 접선이 나오는 문제를 풀 때', caution:'길이가 같다는 것을 식으로 세워야 미지수가 구해진다', example:'PA = x+3, PB = 2x-1\nx+3 = 2x-1 → x = 4 (접선의 길이 7)'},
  {g:'중3', u:'원의 성질', f:'삼각형의 내접원과 접선의 길이', b:'내접원이 세 변에 접할 때\nAD = AF = x,  BD = BE = y,  CE = CF = z\nx+y = AB,  y+z = BC,  z+x = CA', shape:'incenter',
    when:'내접원의 접점이 변을 나눈 길이를 구할 때', caution:'세 식을 모두 더하면 2(x+y+z) = 둘레 → x+y+z 를 먼저 구한 뒤 하나씩 빼서 되돌아간다', example:'AB=8, BC=10, CA=12\n2(x+y+z) = 30 → x+y+z = 15\nx = 15 - (y+z) = 15 - 10 = 5'},
  {g:'중3', u:'원의 성질', f:'원에 외접하는 사각형', b:'원에 외접하는 사각형 ABCD에서\nAB + CD = BC + DA\n(마주보는 두 변의 길이의 합이 서로 같다)',
    when:'원이 사각형의 네 변에 모두 접할 때 변의 길이를 구할 때', caution:'마주보는 변끼리 더한다 — 이웃한 변을 더하는 실수가 가장 많다', example:'AB=6, BC=8, CD=9\n6 + 9 = 8 + DA → DA = 7'},
  {g:'중3', u:'원의 성질', f:'원주각의 성질', b:'한 호에 대한 원주각은\n중심각의 절반이다\n(중심각 = 원주각의 2배)', shape:'inscribedAngle',
    when:'원주각과 중심각을 서로 바꿔 구할 때', caution:'중2 「삼각형의 외심 ∠BOC = 2∠A」가 바로 이것의 특수한 경우다 / 거꾸로 원주각을 주고 중심각을 묻는 문제도 나온다', example:'호 AB에 대한 원주각 ∠APB = 35°\n→ 중심각 ∠AOB = 70°'},
  {g:'중3', u:'원의 성질', f:'같은 호에 대한 원주각', b:'한 원에서 같은 호에 대한 원주각의 크기는\n모두 같다', shape:'inscribedAngle',
    when:'원 위의 여러 점에서 같은 호를 바라볼 때', caution:'두 점이 호의 같은 쪽에 있어야 한다 — 반대쪽에 있으면 180°에서 뺀 값이 된다', example:'∠APB = 40° 이고 Q가 같은 쪽에 있으면\n∠AQB = 40°'},
  {g:'중3', u:'원의 성질', f:'반원에 대한 원주각', b:'지름에 대한 원주각은 90°\n(지름이라는 말이 곧 직각이다)', shape:'inscribedAngle',
    when:'원에 내접한 삼각형의 한 변이 지름일 때', caution:'90°가 문제에 적혀 있지 않다 — 지름이라는 말에서 스스로 꺼내야 한다. 원 단원 문제의 절반이 여기서 출발한다', example:'AB가 지름, ∠PAB = 35°\n∠APB = 90° → ∠PBA = 55°'},
  {g:'중3', u:'원의 성질', f:'원주각과 호의 길이', b:'한 원에서\n호의 길이가 같으면 원주각의 크기도 같다\n원주각의 크기는 호의 길이에 정비례한다',
    when:'호의 길이의 비로 원주각을 구할 때', caution:'현의 길이는 원주각에 정비례하지 않는다 — 호만 정비례한다', example:'호 AB : 호 CD = 2 : 3, ∠APB = 40°\n호 CD의 원주각 = 40 × 3/2 = 60°'},
  {g:'중3', u:'원의 성질', f:'네 점이 한 원 위에 있을 조건', b:'선분 AB에 대하여 C, D가 같은 쪽에 있고\n∠ACB = ∠ADB 이면\n네 점 A, B, C, D는 한 원 위에 있다',
    when:'그림에 원이 없는데 네 점이 한 원 위에 있음을 보일 때', caution:'원주각 성질을 역방향으로 쓰는 문제 / C, D가 AB의 같은 쪽에 있어야 한다', example:'∠ACB = ∠ADB = 50° (같은 쪽)\n→ 네 점 A, B, C, D는 한 원 위에 있다'},
  {g:'중3', u:'원의 성질', f:'원에 내접하는 사각형', b:'마주보는 두 각의 크기의 합 = 180°\n한 외각의 크기\n= 그와 이웃하지 않은 내각(내대각)의 크기', shape:'cyclicQuad',
    when:'원에 내접한 사각형의 각을 구할 때', caution:'거꾸로 대각의 합이 180°이면 그 사각형은 원에 내접한다 / 서술형에서 「네 점이 한 원 위」와 짝으로 나온다', example:'∠A = 85°, ∠B = 70°\n∠C = 180 - 85 = 95°, ∠D = 180 - 70 = 110°'},
  {g:'중3', u:'원의 성질', f:'접선과 현이 이루는 각', b:'접선과 현이 이루는 각의 크기는\n그 각 안에 있는 호에 대한 원주각의 크기와 같다', shape:'tangent',
    when:'접선이 그어진 원에서 각을 구할 때', caution:'접현각 — 각 안쪽에 들어 있는 호를 정확히 찾는 것이 전부', example:'접현각이 55°\n→ 그 호에 대한 원주각도 55°'},
  {g:'중3', u:'원의 성질', f:'순서 — 원 문제는 무엇부터', pair:1, b:'1 지름이 보이나\n2 내접사각형인가\n3 같은 호인가\n4 중심각인가', when:'원 안에 각이 여럿 표시된 그림을 처음 볼 때.', caution:'아무 각이나 잡고 계산을 시작한다. 지름과 내접사각형을 먼저 찾으면 각 하나가 바로 정해진다.', example:'지름 위의 원주각은 90도.\n내접사각형에서 마주 보는 각이\n110도이면 다른 쪽은 70도.'},
  {g:'중3', u:'원의 성질', f:'원의 성질 + 이차방정식', pair:1, b:'주인공 — 이차방정식\n도구 — 현의 수직이등분선\n현의 길이를 미지수로 놓으면\n피타고라스가 이차식이 된다',
    when:'현의 길이와 중심까지의 거리가 문자로 얽혀 있을 때', caution:'중심에서 현에 내린 수선은 현을 이등분한다 — 반현으로 놓아야 식이 선다', example:'반지름 5, 중심까지 거리 x\n현의 길이 2(x+1) → 반현 x+1\nx² + (x+1)² = 25 → x²+x-12 = 0 → x = 3'},
  {g:'중3', u:'원의 성질', f:'경우의 수 + 도형', pair:1, b:'주인공 — 경우의 수\n도구 — 반원에 대한 원주각\n도형의 개수는 점을 고르는 문제',
    when:'원 위의 점으로 만든 삼각형의 개수를 셀 때', caution:'직각삼각형이 되려면 한 변이 지름이어야 한다 — 「지름이 있어야 직각」을 도구로 쓴다', example:'원 위의 정육각형 여섯 꼭짓점\n삼각형 = 6×5×4 ÷ 6 = 20개\n직각삼각형 = 지름 3개 × 나머지 4점 = 12개'},

  {g:'중3', u:'통계', f:'대푯값과 산포도', def:'대푯값: 자료 전체를 대표하는 값(평균, 중앙값, 최빈값) / 산포도: 자료가 흩어진 정도를 나타내는 값(분산, 표준편차)', props:['평균은 극단적인 값(이상치)의 영향을 크게 받는다','산포도가 작을수록 자료가 평균 가까이 모여 있다']},
  {g:'중3', u:'통계', f:'대푯값 — 평균', b:'(자료 값의 합) ÷ (자료의 개수)',
    when:'자료 전체를 대표하는 값을 구할 때', caution:'극단적인 값(이상치)에 영향을 크게 받는다', example:'2,4,6,8 → 평균 5'},
  {g:'중3', u:'통계', f:'대푯값 — 중앙값과 최빈값', b:'중앙값: 크기순으로 늘어놓았을 때 한가운데 값\n(자료가 짝수 개면 가운데 두 값의 평균)\n최빈값: 가장 많이 나타나는 값',
    when:'평균이 적절하지 않을 때(이상치가 있을 때) 대푯값을 고를 때', caution:'중앙값은 반드시 크기순으로 먼저 정렬한다 / 최빈값은 여러 개일 수도 없을 수도 있다', example:'1,2,3,100 → 중앙값 2.5'},
  {g:'중3', u:'통계', f:'편차', b:'편차 = (변량) - (평균)\n편차의 합은 항상 0',
    when:'각 자료가 평균에서 얼마나 떨어져 있는지 볼 때', caution:'편차의 합이 0이라서 그냥 더해서는 흩어진 정도를 알 수 없다 → 제곱해서 분산을 쓴다', example:'평균 5, 변량 8 → 편차 +3'},
  {g:'중3', u:'통계', f:'분산과 표준편차', b:'분산 = {(편차)²의 합} ÷ (변량의 개수)\n표준편차 = √분산',
    when:'자료가 흩어진 정도를 수로 나타낼 때', caution:'분산은 단위가 제곱이라 표준편차로 되돌려 쓴다', example:'변량 1,2,3,4,5 → 평균 3\n편차 -2,-1,0,1,2\n분산 = (4+1+0+1+4) ÷ 5 = 2\n표준편차 = √2'},
  {g:'중3', u:'통계', f:'산점도와 상관관계', def:'산점도: 두 변량을 순서쌍으로 좌표평면에 나타낸 그래프', props:['양의 상관관계: x가 커질수록 y도 대체로 커진다','음의 상관관계: x가 커질수록 y는 대체로 작아진다','점들이 한 직선에 가까울수록 상관관계가 강하다','뚜렷한 경향이 없으면 상관관계가 없다']},
  {g:'중3', u:'통계', f:'통계 + 문자식', pair:1, b:'주인공 — 분산\n도구 — 문자식\n평균을 문자로 구하면\n편차에서 문자가 사라진다',
    when:'변량이 문자로 주어진 자료의 분산을 구할 때', caution:'그래서 모든 변량에 같은 수를 더해도 분산은 그대로다 — 평균만 그만큼 커진다', example:'변량이 x, x+2, x+4\n평균 = (3x+6) ÷ 3 = x+2\n편차 -2, 0, 2\n분산 = (4+0+4) ÷ 3 = 8/3 (x와 무관)'},

  {g:'중3', u:'활용 문제', f:'이차방정식 — 연속하는 수', b:'연속하는 두 자연수: x, x+1\n연속하는 세 자연수: x-1, x, x+1\n식을 세워 이차방정식으로 만든다',
    when:'"연속하는 두(세) 자연수의 곱이 …" 가 나올 때', caution:'자연수·나이·개수는 음수 해를 버린다', example:'연속하는 두 자연수의 곱이 56\nx(x+1) = 56 → x = 7 → 7과 8'},
  {g:'중3', u:'활용 문제', f:'이차방정식 — 도형의 넓이', b:'구하려는 길이를 x로 놓고\n(넓이) 식을 세워 이차방정식으로 만든다', shape:'rect',
    when:'"가로가 세로보다 3 길고 넓이가 …" 처럼 길이 관계와 넓이가 함께 주어질 때', caution:'길이는 양수이므로 음수 해를 반드시 버린다', example:'가로가 세로보다 3 긴 직사각형의 넓이 40\nx(x+3) = 40 → x = 5 → 5와 8'},
  {g:'중3', u:'활용 문제', f:'이차방정식 — 길 만들기', b:'길의 폭을 x로 놓고\n길을 한쪽으로 몰아붙여\n직사각형 하나로 만든 뒤 넓이 식을 세운다', shape:'rect',
    when:'"폭이 일정한 길을 내고 남은 땅의 넓이가 …" 가 나올 때', caution:'길을 몰아붙여도 남은 땅의 넓이는 변하지 않는다', example:'가로 10, 세로 8인 땅에 가로·세로 방향으로\n폭 x인 길을 각각 하나씩, 남은 넓이 63\n(10-x)(8-x) = 63 → x = 1'},
  {g:'중3', u:'활용 문제', f:'이차방정식 — 쏘아 올린 물체', b:'땅에 떨어짐 → 높이 = 0\n특정 높이 도달 → 높이 = (그 값)\n으로 놓고 이차방정식을 푼다',
    when:'"쏘아 올린 물체의 t초 후 높이가 …" 에서 시각을 물을 때', caution:'특정 높이는 올라갈 때·내려올 때 두 번 지나므로 해가 2개 / 땅에 떨어지는 문제에서 t = 0 은 쏘아 올린 순간이므로 버린다', example:'h = 40t - 5t², 땅에 떨어질 때\n40t - 5t² = 0 → t = 0 또는 8 → 8초 후'},
  {g:'중3', u:'활용 문제', f:'이차함수 — 최대 넓이', b:'변하는 길이를 x, 넓이를 y로 놓고\ny = a(x-p)² + q 로 고친다\n→ 꼭짓점에서 최댓값 q', shape:'parabola',
    when:'"둘레가 20인 직사각형의 넓이가 최대" 처럼 최대·최소를 물을 때', caution:'a < 0 이어야 최댓값이 있다', example:'둘레 20인 직사각형\ny = x(10-x) = -(x-5)² + 25 → 최대 25'},
  {g:'중3', u:'활용 문제', f:'이차함수 — 최고 높이', b:'h = at² + bt + c 를 표준형으로 고친다\n꼭짓점의 y좌표 = 최고 높이\n꼭짓점의 x좌표 = 그때의 시각', shape:'parabola',
    when:'"가장 높이 올라갔을 때" 의 높이나 시각을 물을 때', caution:'완전제곱식으로 고칠 때 앞의 계수로 먼저 묶는다', example:'h = -5t² + 30t = -5(t-3)² + 45\n3초 후 최고 45m'},
  {g:'중3', u:'활용 문제', f:'제곱근 — 정사각형의 한 변', b:'넓이가 A인 정사각형\n한 변 = √A\n대각선 = √(2A)', shape:'square',
    when:'"넓이가 18인 정사각형의 한 변(대각선)" 처럼 넓이만 주어질 때', caution:'대각선은 한 변의 √2 배 — 2배가 아니다', example:'넓이 18인 정사각형\n한 변 = √18 = 3√2, 대각선 = 6'},
  {g:'중3', u:'활용 문제', f:'삼각비 — 건물의 높이', s:2, b:'두 지점에서 올려본각을 재면\n건물의 높이 h를 두 가지 식으로 나타내어\n같다고 놓고 h를 구한다', shape:'trigRatio',
    when:'"떨어진 두 지점에서 올려본각을 쟀다" 가 나올 때', caution:'밑변의 길이를 h로 나타내는 것이 출발점', example:'A에서 45° → 밑변 = h\n20m 뒤 B에서 30°\n밑변 = h + 20 = h ÷ tan30° = √3 h\nh(√3-1) = 20 → h = 10(√3+1)'},
  {g:'중3', u:'활용 문제', f:'삼각비 — 경사면', s:2, b:'경사각 x, 빗면의 길이 l 일 때\n수평 거리 = l cos x\n수직 높이 = l sin x', shape:'trigRatio',
    when:'"경사각 30°인 비탈길을 200m 올라갔다" 가 나올 때', caution:'빗면을 따라 간 거리와 수평 거리를 헷갈리지 않는다', example:'경사각 30°인 길을 200m 오름\n높이 = 200 sin30° = 100m'},
  {g:'중3', u:'활용 문제', f:'삼각비 — 넓이 구하기', s:2, b:'삼각형: S = ½ ab sin C\n평행사변형: S = ab sin x\n사각형(대각선 p, q): S = ½ pq sin x',
    when:'"두 변과 그 끼인각" 이 주어지고 넓이를 물을 때', caution:'끼인각이어야 한다 / 둔각이면 sin(180° - 각)', example:'두 변 8, 10, 끼인각 30°\n½ × 8 × 10 × ½ = 20'},
  {g:'중3', u:'활용 문제', f:'원 — 접선의 길이', s:2, b:'원 밖의 한 점에서 그은 두 접선의 길이는 같다\n중심-접점-외부점으로 직각삼각형을 만들어\n피타고라스 정리를 쓴다', shape:'tangent',
    when:'"원 밖의 점에서 그은 접선" 이 나올 때', caution:'접점을 지나는 반지름과 접선은 수직 — 여기서 직각삼각형이 나온다', example:'중심까지 13, 반지름 5\n접선의 길이 = √(169-25) = 12'},
  {g:'중3', u:'활용 문제', f:'원 — 각의 크기 구하기', s:2, b:'같은 호에 대한 원주각은 같다\n원주각 = 중심각의 ½\n지름에 대한 원주각 = 90°\n내접사각형의 대각의 합 = 180°', shape:'inscribedAngle',
    when:'원 안에 여러 각이 그려지고 ∠x 를 물을 때', caution:'어느 호에 대한 각인지부터 표시하고 시작한다', example:'∠BAC = 35°\n→ ∠BDC = 35°, 중심각 ∠BOC = 70°'},
  {g:'중3', u:'활용 문제', f:'통계 — 평균으로 미지수 구하기', s:2, b:'(자료의 합) = (평균) × (자료의 개수)\n모르는 값을 x로 놓고 합의 식을 세운다',
    when:'"평균이 7일 때 나머지 한 값은" 이 나올 때', caution:'개수를 정확히 세는 것이 먼저', example:'4개의 평균이 7, 세 값이 5, 8, 9\n5+8+9+x = 28 → x = 6'},
  {g:'중3', u:'활용 문제', f:'통계 — 표준편차 비교', s:2, b:'표준편차가 작을수록\n자료가 평균 가까이 모여 있다\n평균이 같아도 표준편차는 다를 수 있다',
    when:'"어느 반이 더 고른가" 를 물을 때', caution:'표준편차가 작다 = 고르다 — 성적이 좋다는 뜻이 아니다', example:'A반 표준편차 2, B반 5\n→ A반이 더 고르다'},
  {g:'중3', u:'활용 문제', f:'곱셈 공식·인수분해 — 수의 계산', b:'합과 차의 곱: 97×103 = (100-3)(100+3)\n완전제곱식: 99² = (100-1)²\n공통인수로 묶기: 25×17 + 25×3 = 25(17+3)',
    when:'"97×103 을 간단히 계산하시오" 처럼 큰 수 계산이 나올 때', caution:'100, 1000 처럼 계산하기 쉬운 수로 쪼개는 것이 핵심', example:'97×103 = 10000-9 = 9991\n99² = 10000-200+1 = 9801'},

  /* ── 더올림 심화 (교과 과정 밖) ── */
  {g:'중3', u:'더올림 심화', f:'헤론의 공식', s:2, adv:1, b:'세 변이 a, b, c 이고\ns = (a + b + c) ÷ 2 일 때\nS = √(s(s-a)(s-b)(s-c))',
    when:'세 변의 길이만으로 삼각형의 넓이를 구할 때', caution:'각이 하나도 주어지지 않았을 때 쓰는 유일한 방법 / 고등 「삼각함수의 활용」에서 다시 나온다', example:'3, 4, 5 → s = 6\nS = √(6×3×2×1) = √36 = 6'},
  {g:'중3', u:'더올림 심화', f:'정삼각형의 높이와 넓이', s:2, adv:1, b:'한 변이 a인 정삼각형\n높이 = (√3 ÷ 2) a\n넓이 = (√3 ÷ 4) a²', shape:'isoTriangle',
    when:'정삼각형이나 정육각형이 나오는 문제', caution:'30°-60°-90° 직각삼각형의 변의 비 1 : √3 : 2 에서 나온다 — 이 비를 외우면 공식이 저절로 나온다', example:'한 변 6\n높이 = 3√3, 넓이 = 9√3'},
  {g:'중3', u:'더올림 심화', f:'방멱정리 — 두 현', s:2, adv:1, b:'원 안에서 두 현 AB, CD가\n점 P에서 만나면\nPA × PB = PC × PD', shape:'chord',
    when:'원 안에서 두 현이 교차할 때 길이를 구할 때', caution:'닮은 삼각형 두 개(원주각이 같아서 AA닮음)에서 나온다', example:'PA=3, PB=8, PC=4\n3 × 8 = 4 × PD → PD = 6'},
  {g:'중3', u:'더올림 심화', f:'방멱정리 — 접선과 할선', s:2, adv:1, b:'원 밖의 점 P에서\n할선이 원과 A, B에서 만나고\n접선의 접점이 T이면\nPA × PB = PT²', shape:'tangent',

  {g:'대수', u:'지수와 로그', f:'로그의 성질', b:'logₐ(MN) = logₐM + logₐN\nlogₐ(M/N) = logₐM - logₐN\nlogₐMᵏ = k·logₐM\nlogₐ1 = 0,  logₐa = 1',
    when:'로그가 포함된 식을 계산하거나 간단히 할 때', caution:'곱은 덧셈으로, 나눗셈은 뺄셈으로 바뀐다', example:'log₂4+log₂8 → log₂32=5'},
  {g:'대수', u:'지수와 로그', f:'밑의 변환 공식', b:'logₐb = log꜀b / log꜀a\nlogₐb = 1 / log_b a\nlog_(aᵐ) bⁿ = (n/m) logₐb\na^(logₐb) = b',
    when:'밑이 서로 다른 로그를 하나로 모을 때', caution:'밑을 바꿀 때 분자·분모의 위치를 헷갈리지 않기(진수가 분자)', example:'log₄8 = log₂8 / log₂4 = 3/2'},
  {g:'대수', u:'지수와 로그', f:'로그함수의 그래프', b:'y = logₐx 는 y = aˣ 의 역함수\ny = x 에 대칭이고 항상 (1, 0)을 지난다\n점근선은 y축(x=0), 정의역은 x>0', shape:'expLogGraph',
    when:'로그함수의 그래프 모양·정의역을 물을 때', caution:'a>1이면 증가, 0<a<1이면 감소 (지수함수와 같은 규칙)', example:'y=log₂x 는 (1,0),(2,1),(4,2)를 지난다'},
  {g:'대수', u:'지수와 로그', f:'상용로그', b:'밑이 10인 로그를 상용로그라 하고\nlog N 으로 쓴다\nlog 10ⁿ = n\nlog(a × 10ⁿ) = n + log a',
    when:'큰 수나 아주 작은 수를 로그로 다룰 때', caution:'0 < a < 10 이 되도록 쪼개면 log a 값만 찾으면 된다', example:'log 300 = log(3×10²) = 2 + log 3'},
  {g:'대수', u:'지수와 로그', f:'지수 + 이차방정식', pair:1, b:'주인공 — 이차방정식\n도구 — 치환\n2ˣ 를 t로 놓으면 이차방정식이 된다',
    when:'4ˣ 이나 9ˣ 처럼 밑이 제곱인 항이 섞여 있을 때', caution:'t > 0 이라는 조건을 반드시 붙인다 — 음수 해는 버려야 한다 / 중3 「치환 인수분해」가 여기서 본무대에 오른다', example:'4ˣ - 5·2ˣ + 4 = 0\nt = 2ˣ → t² - 5t + 4 = 0\nt = 1, 4 → x = 0, 2'},
  {g:'대수', u:'지수와 로그', f:'로그 + 부등식', pair:1, b:'주인공 — 부등식\n도구 — 로그\n밑이 1보다 작으면\n부등호가 뒤집힌다',
    when:'로그가 들어간 부등식을 풀 때', caution:'진수 조건(진수 > 0)을 반드시 함께 쓴다 / 중1 「음수를 곱하면 부등호가 바뀐다」와 같은 종류의 함정', example:'log_(1/2)(x-1) > 1\n밑 < 1 → x - 1 < 1/2\n진수 조건 x - 1 > 0\n1 < x < 3/2'},

  {g:'대수', u:'삼각함수', f:'호도법', def:'각의 크기를 반지름에 대한 호의 길이의 비(라디안)로 나타내는 방법', shape:'sectorRad', props:['180° = π(라디안)','도 → 라디안 변환: 각도 × π/180','30°=π/6, 45°=π/4, 60°=π/3, 90°=π/2']},
  {g:'대수', u:'삼각함수', f:'부채꼴의 호의 길이와 넓이', b:'l = rθ\nS = ½ r²θ = ½ r l\n(θ는 라디안)', shape:'sectorRad',
    when:'호도법으로 각이 주어진 부채꼴을 다룰 때', caution:'θ가 라디안일 때만 쓸 수 있다 — 도(°)면 먼저 바꾼다', example:'r=6, θ=π/3 → l=2π, S=6π'},
  {g:'대수', u:'삼각함수', f:'삼각함수의 정의', b:'원점 중심, 반지름 r 인 원 위의\n점 P(x, y)에 대하여\nsin θ = y/r,  cos θ = x/r,  tan θ = y/x', shape:'unitCircle',
    when:'각이 90°를 넘거나 음수일 때 삼각함수 값을 정할 때', caution:'단위원(r=1)에서는 P의 좌표가 그대로 (cos θ, sin θ)', example:'θ=120° → sin=√3/2, cos=-1/2'},
  {g:'대수', u:'삼각함수', f:'삼각함수의 부호', b:'1사분면: 모두 +\n2사분면: sin만 +\n3사분면: tan만 +\n4사분면: cos만 +', shape:'unitCircle',
    when:'각이 어느 사분면에 있는지로 부호를 정할 때', caution:'올(All) - 사인 - 탄젠트 - 코사인 순으로 외운다', example:'θ가 3사분면 → sin<0, cos<0, tan>0'},
  {g:'대수', u:'삼각함수', f:'삼각함수의 기본 관계', b:'sin²θ + cos²θ = 1\ntanθ = sinθ / cosθ\n1 + tan²θ = 1/cos²θ',
    when:'sin,cos,tan 중 하나만 알 때 나머지를 구할 때', caution:'sin²θ+cos²θ=1은 항상 성립하는 항등식', example:'sinθ=3/5 → cosθ=4/5(1사분면)'},
  {g:'대수', u:'삼각함수', f:'삼각함수의 성질', b:'sin(-θ) = -sin θ,  cos(-θ) = cos θ\nsin(π-θ) = sin θ,  cos(π-θ) = -cos θ\nsin(π+θ) = -sin θ,  cos(π+θ) = -cos θ\nsin(π/2-θ) = cos θ,  cos(π/2-θ) = sin θ',
    when:'각을 0~90° 범위로 줄여서 값을 구할 때', caution:'π/2 가 들어가면 sin↔cos 이 바뀌고, π 가 들어가면 이름은 그대로 부호만 바뀐다', example:'sin 150° = sin(180°-30°) = 1/2'},
  {g:'대수', u:'삼각함수', f:'삼각함수의 그래프', b:'y = a sin(bx+c) + d\n주기 = 2π / |b|   (tan은 π / |b|)\n최댓값 = |a| + d,  최솟값 = -|a| + d',
    when:'삼각함수 그래프의 주기와 최대·최소를 구할 때', caution:'주기는 b만, 최대·최소는 a와 d만 관여한다', example:'y=2sin3x+1 → 주기 2π/3, 최대 3, 최소 -1'},
  {g:'대수', u:'삼각함수', f:'사인법칙', b:'a/sinA = b/sinB = c/sinC = 2R\n(R은 외접원의 반지름)',
    when:'삼각형에서 각과 변의 관계, 외접원 반지름을 구할 때', caution:'변÷대응하는 각의 sin 이 모두 같다', example:'a=6,sinA=1/2 → 2R=12'},
  {g:'대수', u:'삼각함수', f:'코사인법칙', b:'a² = b² + c² - 2bc·cosA',
    when:'두 변과 그 사이 각으로 나머지 변을 구할 때', caution:'구하려는 변과 마주보는 각의 cos을 사용', example:'b=3,c=4,A=60° → a²=13'},
  {g:'대수', u:'삼각함수', f:'코사인법칙의 변형', b:'cos A = (b² + c² - a²) / 2bc',
    when:'세 변의 길이를 알고 각을 구할 때', caution:'구하려는 각과 마주보는 변 a가 뺄셈 자리에 들어간다', example:'a=7,b=5,c=8 → cosA = (25+64-49)/80 = 1/2'},
  {g:'대수', u:'삼각함수', f:'삼각형의 넓이', b:'S = ½ bc sin A\nS = abc / 4R   (R은 외접원의 반지름)\nS = rs   (r은 내접원의 반지름, s는 둘레의 절반)\n헤론: S = √(s(s-a)(s-b)(s-c))',
    when:'주어진 조건에 따라 삼각형의 넓이를 구할 때', caution:'무엇이 주어졌는지에 따라 네 공식 중 하나를 고른다', example:'a=3,b=4,c=5 → s=6 → S=6'},
  {g:'대수', u:'삼각함수', f:'삼각함수 + 이차방정식', pair:1, b:'주인공 — 이차방정식\n도구 — 치환\nsin x 를 t로 놓아 풀고\n각을 되돌린다',
    when:'sin²x 나 cos²x 가 섞인 방정식을 풀 때', caution:'-1 ≤ t ≤ 1 / 되돌릴 때 주어진 범위 안의 각을 모두 찾는다 — 하나만 쓰면 감점', example:'0 ≤ x < 2π 에서\n2sin²x - 3sin x + 1 = 0\nsin x = 1/2 또는 1\nx = π/6, 5π/6, π/2'},

  {g:'대수', u:'수열', f:'수열', def:'일정한 규칙에 따라 순서대로 나열된 수들의 열', props:['각 수를 항이라 하고 aₙ으로 나타낸다','첫째항부터 n번째 항까지의 합을 Sₙ으로 나타낸다']},
  {g:'대수', u:'수열', f:'등차수열', b:'일반항: aₙ = a₁+(n-1)d\n합: Sₙ = n(a₁+aₙ)/2 = n{2a₁+(n-1)d}/2',
    when:'일정하게 더해지는 수열의 일반항이나 합을 구할 때', caution:'d는 공차(뒤항-앞항), 첫째항 a₁부터 센다', example:'2,5,8,... → aₙ=3n-1'},
  {g:'대수', u:'수열', f:'등비수열', b:'일반항: aₙ = a₁rⁿ⁻¹\n합: Sₙ = a₁(rⁿ-1)/(r-1)   (r ≠ 1)\nr = 1 이면 Sₙ = na₁',
    when:'일정하게 곱해지는 수열의 일반항이나 합을 구할 때', caution:'r은 공비(뒤항÷앞항), r=1이면 별도 공식', example:'2,6,18,... → aₙ=2×3ⁿ⁻¹'},
  {g:'대수', u:'수열', f:'등차중항과 등비중항', b:'a, b, c 가 등차수열 ⇔ 2b = a + c\na, b, c 가 등비수열 ⇔ b² = ac',
    when:'세 수가 등차·등비를 이룰 조건을 세울 때', caution:'등차는 합의 절반, 등비는 곱의 제곱근 관계', example:'2, x, 8 등비 → x² = 16 → x = ±4'},
  {g:'대수', u:'수열', f:'합의 기호 Σ', b:'Σ(aₖ + bₖ) = Σaₖ + Σbₖ\nΣ(caₖ) = c Σaₖ\nΣc = cn   (c는 상수)',
    when:'수열의 합을 기호로 나타내고 계산할 때', caution:'Σ(aₖbₖ) ≠ (Σaₖ)(Σbₖ) — 곱은 나눠지지 않는다', example:'Σ(2k+1) = 2Σk + n'},
  {g:'대수', u:'수열', f:'자연수의 거듭제곱의 합', b:'Σk = n(n+1)/2\nΣk² = n(n+1)(2n+1)/6\nΣk³ = {n(n+1)/2}²',
    when:'1부터 n까지의 제곱·세제곱의 합을 구할 때', caution:'Σk³ 은 (Σk)² 와 같다 — 외워두면 편하다', example:'Σ(k=1~5) k² = 5×6×11/6 = 55'},
  {g:'대수', u:'수열', f:'수열의 합과 일반항', b:'a₁ = S₁\naₙ = Sₙ - Sₙ₋₁   (n ≥ 2)',
    when:'합 Sₙ이 주어졌을 때 일반항 aₙ을 구할 때', caution:'n≥2 로 구한 뒤 a₁을 따로 확인해 식이 맞는지 본다', example:'Sₙ=n² → aₙ=2n-1 (n≥2), a₁=1 도 성립'},
  {g:'대수', u:'수열', f:'계차수열', b:'bₙ = aₙ₊₁ - aₙ 일 때\naₙ = a₁ + Σ(k=1~n-1) bₖ   (n ≥ 2)',
    when:'항 사이의 차가 규칙적인 수열의 일반항을 구할 때', caution:'Σ의 위끝이 n이 아니라 n-1 / n=1은 따로 확인', example:'1,2,4,7,11,... → 계차 1,2,3,4'},
  {g:'대수', u:'수열', f:'부분분수를 이용한 합', b:'1 / {k(k+1)} = 1/k - 1/(k+1)\n1 / {k(k+d)} = (1/d){1/k - 1/(k+d)}',
    when:'분수 꼴 수열의 합에서 항들이 서로 지워지게 만들 때', caution:'앞뒤가 지워지고 처음과 끝만 남는다(망원급수)', example:'Σ 1/{k(k+1)} (k=1~n) = 1 - 1/(n+1)'},
  {g:'대수', u:'수열', f:'수열 + 로그', pair:1, b:'주인공 — 수열\n도구 — 로그의 성질\n로그가 등차면 진수는 등비',
    when:'로그로 이루어진 수열이 등차라고 할 때', caution:'등차의 조건 2b = a + c 를 쓰면 로그의 합이 곱이 되어 b² = ac 가 나온다 / 진수 조건으로 a, b, c 가 모두 양수라 곧바로 등비수열이 된다', example:'log a, log b, log c 가 등차\n2 log b = log a + log c\nb² = ac → a, b, c 는 등비수열'},

  /* ── 더올림 심화 (교과 과정 밖) ── */
  {g:'대수', u:'더올림 심화', f:'상용로그의 지표와 가수', adv:1, b:'log N = (지표) + (가수)\n지표: 정수 부분 / 가수: 0 이상 1 미만\nN이 n자리 자연수 → 지표 = n - 1\n0<N<1, 소수 n째 자리에서 처음\n0이 아닌 숫자 → 지표 = -n',
    when:'큰 수의 자릿수나 소수점 아래 처음 0이 아닌 자리를 구할 때', caution:'숫자 배열이 같으면 가수가 같다 — 2와 20과 0.2의 가수가 모두 같다', example:'log 300 = 2.4771…\n지표 2 → 300은 3자리 수'},
  {g:'대수', u:'더올림 심화', f:'삼각함수의 덧셈정리', adv:1, b:'sin(α±β) = sinα cosβ ± cosα sinβ\ncos(α±β) = cosα cosβ ∓ sinα sinβ\ntan(α±β)\n= (tanα ± tanβ) ÷ (1 ∓ tanα tanβ)',
    when:'특수각이 아닌 각의 삼각함수 값을 구할 때', caution:'cos의 부호가 반대로 붙는다(∓) — 여기서 가장 많이 틀린다', example:'sin75° = sin(45°+30°)\n= (√2/2)(√3/2) + (√2/2)(1/2)\n= (√6 + √2) ÷ 4'},
  {g:'대수', u:'더올림 심화', f:'배각·반각 공식', adv:1, b:'sin2θ = 2 sinθ cosθ\ncos2θ = 1 - 2sin²θ = 2cos²θ - 1\nsin²θ = (1 - cos2θ) ÷ 2\ncos²θ = (1 + cos2θ) ÷ 2',
    when:'각이 2배·절반인 삼각함수를 서로 바꿀 때', caution:'덧셈정리에 β = α 를 넣으면 바로 나온다 — 따로 외우기보다 유도가 빠르다', example:'sin²15° = (1 - cos30°) ÷ 2\n= (1 - √3/2) ÷ 2'},

  /* ═══ 미적분Ⅰ — 함수의 극한과 연속, 미분, 적분 ═══ */
  {g:'미적분Ⅰ', u:'함수의 극한과 연속', f:'함수의 극한', def:'x가 a가 아니면서 a에 한없이 가까워질 때 f(x)가 가까워지는 값, lim[x→a] f(x)로 나타낸다', props:['좌극한과 우극한이 같아야 극한이 존재한다','극한값과 함숫값 f(a)는 다를 수 있다']},
  {g:'미적분Ⅰ', u:'함수의 극한과 연속', f:'극한값의 계산', b:'0/0 꼴 → 인수분해하거나 유리화해서 약분\n∞/∞ 꼴 → 분모의 최고차항으로 나눈다\n∞-∞ 꼴 → 통분하거나 유리화',
    when:'대입했더니 꼴이 정해지지 않는(부정형) 극한을 계산할 때', caution:'그냥 대입해서 나오면 그것이 답 — 부정형일 때만 변형한다', example:'lim[x→1] (x²-1)/(x-1) = 2'},
  {g:'미적분Ⅰ', u:'함수의 극한과 연속', f:'미정계수의 결정', b:'lim (분자/분모) 가 존재하고 (분모)→0 이면\n(분자)→0 이어야 한다\n극한값이 0이 아닌데 (분자)→0 이면 (분모)→0',
    when:'극한값이 주어진 조건에서 미지의 계수를 구할 때', caution:'분모가 0으로 가는데 극한이 존재하면 분자도 반드시 0으로 간다', example:'lim[x→1](x²+ax+b)/(x-1)=3 → 1+a+b=0'},
